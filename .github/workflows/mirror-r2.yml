name: Mirror release to R2

on:
  workflow_call:
    inputs:
      tag:
        description: Published stable application tag
        required: true
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable application release tag to mirror (e.g. v0.2.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'KDZZZZZZ/sesame' && (github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft && startsWith(github.event.release.tag_name, 'v')))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require a stable application release tag
        run: node -e 'if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.TAG)) throw new Error("Only stable application releases may be mirrored")'
      - name: Download release assets
        run: gh release download "$TAG" --repo ${{ github.repository }} --dir dist --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to R2 (s3://sesame-releases/$TAG/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          content_type() {
            case "$1" in
              *.exe) echo application/vnd.microsoft.portable-executable ;;
              *.dmg) echo application/x-apple-diskimage ;;
              *.deb) echo application/vnd.debian.binary-package ;;
              *.txt) echo "text/plain; charset=utf-8" ;;
              *) echo application/octet-stream ;;
            esac
          }
          for f in dist/*; do
            b=$(basename "$f")
            echo ">>> $b"
            aws s3 cp "$f" "s3://sesame-releases/$TAG/$b"               --endpoint-url "$R2_ENDPOINT"               --content-type "$(content_type "$b")"               --no-progress
            expected=$(sha256sum "$f" | cut -d ' ' -f 1)
            actual=$(aws s3 cp "s3://sesame-releases/$TAG/$b" - \
              --endpoint-url "$R2_ENDPOINT" --no-progress | sha256sum | cut -d ' ' -f 1)
            if [ "$actual" != "$expected" ]; then
              echo "R2 SHA256 mismatch: $b" >&2
              exit 1
            fi
            echo "SHA256 verified: $actual  $b"
          done
          echo "Mirrored $TAG to https://dl.sesame.bot/$TAG/"
