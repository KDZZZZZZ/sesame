name: Historical plugin catalog
on:
  push:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  catalog-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - name: Check out the fixed historical catalog validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KDZZZZZZ/sesame
          ref: e91f45bdaaf1e0b02304f590656878ae8d23254f
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the exact catalog baseline from the canonical repository
        shell: bash
        run: |
          if [[ -z "$CATALOG_BASE_SHA" || "$CATALOG_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            exit 0
          fi
          [[ "$CATALOG_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid catalog baseline SHA' >&2; exit 1; }
          git -C candidate -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules --no-write-fetch-head https://github.com/KDZZZZZZ/sesame.git "$CATALOG_BASE_SHA"
          git -C candidate cat-file -e "${CATALOG_BASE_SHA}^{commit}"
      - name: Validate immutable sources, manifests, hashes and review records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/.github/scripts/validate-catalog.mjs candidate
      - name: Run trusted validator regression checks
        env:
          CATALOG_ROOT: candidate
        run: node --test trusted/.github/scripts/catalog.test.mjs
      - name: Publish validation scope
        run: |
          echo '### Plugin catalog static checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated the historical catalog with fixed validator e91f45bdaaf1e0b02304f590656878ae8d23254f: exact Git source, files, hashes, identity, license/provenance presence, compatibility metadata and review references. Current API 2 source capabilities are checked separately by package-static-review. No candidate plugin code, setup hook or test was executed. A green check is not a safety certification; human review is separate.' >> "$GITHUB_STEP_SUMMARY"
