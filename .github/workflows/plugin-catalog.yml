name: Plugin API 2 inventory and release plans
on:
  push:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  catalog-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the trusted base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate current locks, descriptive inventory and publication plans
        run: node trusted/.github/scripts/validate-catalog.mjs candidate
      - name: Run trusted validator regression checks
        run: node --test trusted/.github/scripts/catalog.test.mjs trusted/.github/scripts/plugin-r2.test.mjs trusted/.github/scripts/release-application.test.mjs
      - name: Publish validation scope
        run: |
          echo '### API 2 inventory and publication checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated current API 2 package locks, capabilities, licenses and descriptive inventory, plus immutable R2 plan sources and the application release plan. The inventory grants no installation authority. No candidate plugin code, setup hook or test was executed. Publication still requires exact-head checks, semantic review and immutable asset verification.' >> "$GITHUB_STEP_SUMMARY"
