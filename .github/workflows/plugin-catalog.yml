name: Plugin catalog
on:
  push:
    branches: [main]
    paths: ['.github/scripts/historical-plugin-releases.json', 'plugins/**', '.github/scripts/*catalog*', '.github/workflows/plugin-catalog.yml']
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['.github/scripts/historical-plugin-releases.json', 'plugins/**', '.github/scripts/*catalog*', '.github/workflows/plugin-catalog.yml', '.github/CODEOWNERS']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  catalog-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable sources, manifests, hashes and review records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node trusted/.github/scripts/validate-catalog.mjs candidate
      - name: Run trusted validator regression checks
        env:
          CATALOG_ROOT: candidate
        run: node --test trusted/.github/scripts/catalog.test.mjs
      - name: Publish validation scope
        run: |
          echo '### Plugin catalog static checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated exact Git source, files, hashes, identity, license/provenance presence, compatibility metadata and review references. No candidate plugin code, setup hook or test was executed. A green check is not a safety certification; human review is separate.' >> "$GITHUB_STEP_SUMMARY"
