name: Contribution routing
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  contribution-policy:
    if: github.repository == 'KDZZZZZZ/sesame'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted main policy, never contributor code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check the source and target branches from event metadata
        run: node .github/scripts/contribution-policy.mjs --pull-request
      - name: Verify contribution and review-trigger policy
        run: node --test .github/scripts/contribution-policy.test.mjs
