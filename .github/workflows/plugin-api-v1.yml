name: Plugin API 1 sources
on:
  push:
    branches: [main, feat/plugin-api-v1]
    paths: ['plugins/api-v1/**', 'plugins/optional-api-v1/**', '.github/scripts/*api1*', '.github/scripts/release-plugins*', '.github/scripts/semantic-review*', '.github/plugin-releases/**', '.github/workflows/plugin-api*.yml', '.github/workflows/plugin-semantic-review.yml']
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['plugins/api-v1/**', 'plugins/optional-api-v1/**', '.github/scripts/*api1*', '.github/scripts/release-plugins*', '.github/scripts/semantic-review*', '.github/plugin-releases/**', '.github/workflows/plugin-api*.yml', '.github/workflows/plugin-semantic-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use the supported source tool runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check out trusted validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package boundaries, metadata and every locked byte
        run: node trusted/plugins/api-v1/scripts/plugin-lock.mjs --check --source candidate/plugins/api-v1
      - name: Validate optional package data with the trusted base validator
        run: |
          node trusted/plugins/api-v1/scripts/plugin-lock.mjs --check --source candidate/plugins/optional-api-v1
          node trusted/.github/scripts/validate-api1-catalog.mjs candidate --published
      - name: Validate fixed release plans without publishing
        run: node trusted/.github/scripts/release-plugins.mjs --check candidate
      - name: Test trusted lock and archive code
        run: node --test trusted/plugins/api-v1/tests/lock.test.mjs trusted/.github/scripts/release-plugins.test.mjs trusted/.github/scripts/semantic-review.test.mjs trusted/.github/scripts/api1-required-catalog.test.mjs
      - name: Record scope
        run: |
          echo '### API 1 package identity checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checked identities, versions, local module scope, license presence, package paths, tool metadata, static import boundaries and every locked byte. Candidate plugin code was not imported or executed. Native behavior, SDK compatibility, browser rendering and target execution require separate maintainer checks.' >> "$GITHUB_STEP_SUMMARY"
