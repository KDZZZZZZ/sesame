name: Plugin API 2 sources
on:
  push:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use the supported source tool runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check out trusted validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Validate API 2 package boundaries, metadata and every locked byte
        run: node trusted/plugins/api-v1/scripts/plugin-lock.mjs --check --source candidate/plugins/api-v1
      - name: Validate API 2 optional package data with the trusted base validator
        run: node trusted/plugins/api-v1/scripts/plugin-lock.mjs --check --source candidate/plugins/optional-api-v1
      - name: Validate API 2 R2 plans with the trusted fixed-source builder
        run: node trusted/.github/scripts/plugin-r2.mjs --check candidate
      - name: Validate the application release plan without publishing
        run: node trusted/.github/scripts/release-application.mjs --check candidate
      - name: Record scope
        run: |
          echo '### API 2 source checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checked current source identities, explicit capabilities, versions, module scope, licenses, package paths, static imports, locked bytes and current publication plans with the trusted base validator. Candidate plugin code was not imported or executed. Native behavior, SDK compatibility, browser rendering and target execution require separate maintainer checks.' >> "$GITHUB_STEP_SUMMARY"
