name: Plugin semantic review gate
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to verify before merging
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  semantic-review-gate:
    if: github.repository == 'KDZZZZZZ/sesame' && (github.event.issue.pull_request || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use the trusted main publisher, never candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check exact-head completed semantic review and static checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ github.event.issue.number || inputs.pull_request }}
        run: node .github/scripts/release-plugins.mjs --review-check . "$REVIEW_PR" > review-gate.json
      - name: Preserve the completed pre-merge review and resolved discussion snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-semantic-review-${{ github.event.issue.number || inputs.pull_request }}
          path: review-gate.json
          if-no-files-found: error
          retention-days: 90
