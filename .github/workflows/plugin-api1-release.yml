name: Historical plugin release verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-api1-release
  cancel-in-progress: false
jobs:
  verify-historical-packages:
    if: github.repository == 'KDZZZZZZ/sesame' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the fixed historical API 1 validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KDZZZZZZ/sesame
          ref: 2aeb09c9d5d4a8e78572e1d7e23afe574570597e
          path: historical
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Test release identity and approval boundaries
        run: node --test historical/.github/scripts/release-plugins.test.mjs historical/.github/scripts/semantic-review.test.mjs historical/.github/scripts/api1-catalog.test.mjs historical/plugins/api-v1/tests/lock.test.mjs historical/.github/scripts/distribution-profiles.test.mjs historical/.github/scripts/api1-required-catalog.test.mjs
      - name: Verify merged source bytes and optional catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node historical/.github/scripts/validate-api1-catalog.mjs . --published
          node historical/.github/scripts/release-plugins.mjs --check .
          node historical/.github/scripts/plugin-r2.mjs --check .
