name: factor_compute
title: factor_compute
description: Compute only the specified formulas and partition using Qlib; keep evaluation and reference selection with the caller.
inputSchema:
  type: object
  properties:
    requestId:
      type: string
      minLength: 1
      maxLength: 128
    budget:
      $ref: "#/$defs/ResourceBudget"
    snapshotRef:
      $ref: "#/$defs/Ref"
    formulas:
      type: array
      items:
        $ref: "#/$defs/Candidate"
      minItems: 1
      maxItems: 64
    partition:
      type: string
      enum:
        - development
        - holdout
    diagnostics:
      type: array
      items:
        $ref: "#/$defs/Diagnostic"
      minItems: 0
      maxItems: 6
  required:
    - requestId
    - budget
    - snapshotRef
    - formulas
    - partition
  additionalProperties: false
  $defs:
    Candidate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        formula:
          $ref: "#/$defs/Formula"
        hypothesis:
          type: string
          minLength: 1
          maxLength: 4000
        origin:
          type: object
          properties:
            method:
              type: string
              enum:
                - seed
                - template
                - random
                - deap
                - optuna
            parents:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 128
              minItems: 0
              maxItems: 64
            parameters:
              type: object
              maxProperties: 32
              additionalProperties:
                type: number
          required:
            - method
            - parents
            - parameters
          additionalProperties: false
      required:
        - id
        - formula
        - hypothesis
        - origin
      additionalProperties: false
    Diagnostic:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: placebo
            required:
              type: boolean
            repetitions:
              type: integer
              minimum: 1
              maximum: 10000
            options:
              type: object
              properties:
                blockBars:
                  type: integer
                  minimum: 1
                  maximum: 100000
                seed:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                confidence:
                  type: number
                  exclusiveMinimum: 0
                  exclusiveMaximum: 1
              required:
                - blockBars
                - seed
                - confidence
              additionalProperties: false
          required:
            - kind
            - required
            - repetitions
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: bootstrap
            required:
              type: boolean
            repetitions:
              type: integer
              minimum: 1
              maximum: 10000
            options:
              type: object
              properties:
                blockBars:
                  type: integer
                  minimum: 1
                  maximum: 100000
                seed:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                confidence:
                  type: number
                  exclusiveMinimum: 0
                  exclusiveMaximum: 1
              required:
                - blockBars
                - seed
                - confidence
              additionalProperties: false
          required:
            - kind
            - required
            - repetitions
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: walk_forward
            required:
              type: boolean
            options:
              type: object
              properties:
                foldBars:
                  type: integer
                  minimum: 3
                  maximum: 1000000
              required:
                - foldBars
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: regimes
            required:
              type: boolean
            options:
              type: object
              properties:
                field:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[a-z][a-z0-9_]{0,63}$
                bins:
                  type: array
                  items:
                    type: number
                  minItems: 1
                  maxItems: 20
              required:
                - field
                - bins
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: sensitivity
            required:
              type: boolean
            options:
              type: object
              properties:
                argumentPath:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 1
                  minItems: 0
                  maxItems: 12
                neighbors:
                  type: array
                  items:
                    type: number
                  minItems: 1
                  maxItems: 16
              required:
                - argumentPath
                - neighbors
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: quantiles
            required:
              type: boolean
            options:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 2
                  maximum: 20
              required:
                - count
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
    Expr:
      oneOf:
        - type: object
          properties:
            field:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z][a-z0-9_]{0,63}$
          required:
            - field
          additionalProperties: false
        - type: object
          properties:
            constant:
              type: number
              minimum: -1000000000000
              maximum: 1000000000000
          required:
            - constant
          additionalProperties: false
        - type: object
          properties:
            call:
              type: string
              enum:
                - Add
                - Sub
                - Mul
                - Div
                - Abs
                - Log
                - Ref
                - Mean
                - Std
                - Min
                - Max
                - Sum
                - Rank
            args:
              type: array
              items:
                $ref: "#/$defs/Expr"
              minItems: 1
              maxItems: 2
          required:
            - call
            - args
          additionalProperties: false
    Formula:
      type: object
      properties:
        dsl:
          type: string
          const: qlib-expr/1
        tree:
          $ref: "#/$defs/Expr"
      required:
        - dsl
        - tree
      additionalProperties: false
    Ref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: string
          minLength: 1
          maxLength: 256
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          type: string
          minLength: 1
          maxLength: 256
        schemaVersion:
          type: string
          const: 1.0.0
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
    ResourceBudget:
      type: object
      properties:
        maxSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        maxInputBytes:
          type: integer
          minimum: 1024
          maximum: 536870912
        maxOutputBytes:
          type: integer
          minimum: 1024
          maximum: 536870912
      required:
        - maxSeconds
        - maxInputBytes
        - maxOutputBytes
      additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: run
  effects:
    - execution
    - plugin.state.write
    - resources.publish
  usage:
    purpose: Compute only the specified formulas and partition using Qlib; keep evaluation and reference selection with the caller.
    inputs: "{requestId,snapshotRef,formulas,partition,budget,diagnostics?}. diagnostics prepares explicitly requested auxiliary values. No implicit reference computation or holdout selection."
    outputs: "{valuesRef,valuesId,snapshotId,partition,candidates}; matrices remain in immutable artifacts. Independent calls may run in parallel under host Run control."
    prerequisites: []
    limitations:
      - All data and formulas must satisfy the frozen qlib-expr/1 contract; results retain missing evidence and exclusions.
  binding:
    type: native
    name: factor_compute
  resumable: true
  configurationRequirements:
    - field: pythonPath
      reason: Prepare or select the verified Qlib/DEAP/Optuna environment before numerical work.
      optional: false
  finalOutputSchema:
    type: object
    properties:
      valuesRef:
        $ref: "#/$defs/Ref"
      valuesId:
        type: string
        minLength: 1
        maxLength: 128
      snapshotId:
        type: string
        minLength: 1
        maxLength: 128
      partition:
        type: string
        enum:
          - development
          - holdout
      candidates:
        type: array
        items:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                status:
                  type: string
                  const: ok
                computeKey:
                  type: string
                  pattern: ^sha256:[a-f0-9]{64}$
              required:
                - id
                - status
                - computeKey
              additionalProperties: false
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                status:
                  type: string
                  const: failed
                error:
                  $ref: "#/$defs/Error"
              required:
                - id
                - status
                - error
              additionalProperties: false
        minItems: 0
        maxItems: 64
    required:
      - valuesRef
      - valuesId
      - snapshotId
      - partition
      - candidates
    additionalProperties: false
    $defs:
      Error:
        type: object
        properties:
          code:
            type: string
            minLength: 1
            maxLength: 128
          message:
            type: string
            minLength: 0
            maxLength: 2000
          retryable:
            type: boolean
        required:
          - code
          - message
          - retryable
        additionalProperties: false
      Ref:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 256
          revision:
            type: string
            minLength: 1
            maxLength: 256
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            type: string
            minLength: 1
            maxLength: 256
          schemaVersion:
            type: string
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
