name: factor_evaluate
title: factor_evaluate
description: Evaluate existing immutable values and archive genuine evidence in the library; do not select strategy pool members.
inputSchema:
  type: object
  properties:
    requestId:
      type: string
      minLength: 1
      maxLength: 128
    budget:
      $ref: "#/$defs/ResourceBudget"
    valuesRef:
      $ref: "#/$defs/Ref"
    profile:
      $ref: "#/$defs/Profile"
    referenceValues:
      type: array
      items:
        $ref: "#/$defs/Ref"
      minItems: 0
      maxItems: 32
  required:
    - requestId
    - budget
    - valuesRef
    - profile
    - referenceValues
  additionalProperties: false
  $defs:
    Diagnostic:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: placebo
            required:
              type: boolean
            repetitions:
              type: integer
              minimum: 1
              maximum: 10000
            options:
              type: object
              properties:
                blockBars:
                  type: integer
                  minimum: 1
                  maximum: 100000
                seed:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                confidence:
                  type: number
                  exclusiveMinimum: 0
                  exclusiveMaximum: 1
              required:
                - blockBars
                - seed
                - confidence
              additionalProperties: false
          required:
            - kind
            - required
            - repetitions
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: bootstrap
            required:
              type: boolean
            repetitions:
              type: integer
              minimum: 1
              maximum: 10000
            options:
              type: object
              properties:
                blockBars:
                  type: integer
                  minimum: 1
                  maximum: 100000
                seed:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                confidence:
                  type: number
                  exclusiveMinimum: 0
                  exclusiveMaximum: 1
              required:
                - blockBars
                - seed
                - confidence
              additionalProperties: false
          required:
            - kind
            - required
            - repetitions
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: walk_forward
            required:
              type: boolean
            options:
              type: object
              properties:
                foldBars:
                  type: integer
                  minimum: 3
                  maximum: 1000000
              required:
                - foldBars
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: regimes
            required:
              type: boolean
            options:
              type: object
              properties:
                field:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[a-z][a-z0-9_]{0,63}$
                bins:
                  type: array
                  items:
                    type: number
                  minItems: 1
                  maxItems: 20
              required:
                - field
                - bins
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: sensitivity
            required:
              type: boolean
            options:
              type: object
              properties:
                argumentPath:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 1
                  minItems: 0
                  maxItems: 12
                neighbors:
                  type: array
                  items:
                    type: number
                  minItems: 1
                  maxItems: 16
              required:
                - argumentPath
                - neighbors
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: quantiles
            required:
              type: boolean
            options:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 2
                  maximum: 20
              required:
                - count
              additionalProperties: false
          required:
            - kind
            - required
            - options
          additionalProperties: false
    Profile:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: number
          const: 1
        kind:
          type: string
          enum:
            - alpha
            - risk
            - state
        axis:
          type: string
          enum:
            - time_series
            - cross_section
        minPairs:
          type: integer
          minimum: 3
          maximum: 1000000
        minCoverage:
          type: number
          minimum: 0
          maximum: 1
        stabilityWindows:
          type: integer
          minimum: 2
          maximum: 100
        maxReferenceCorrelation:
          type: number
          minimum: 0
          maximum: 1
        score:
          type: string
          enum:
            - abs_rank_ic
            - eta_squared
        diagnostics:
          type: array
          items:
            $ref: "#/$defs/Diagnostic"
          minItems: 0
          maxItems: 6
      required:
        - id
        - version
        - kind
        - axis
        - minPairs
        - minCoverage
        - stabilityWindows
        - maxReferenceCorrelation
        - score
        - diagnostics
      additionalProperties: false
    Ref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: string
          minLength: 1
          maxLength: 256
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          type: string
          minLength: 1
          maxLength: 256
        schemaVersion:
          type: string
          const: 1.0.0
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
    ResourceBudget:
      type: object
      properties:
        maxSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        maxInputBytes:
          type: integer
          minimum: 1024
          maximum: 536870912
        maxOutputBytes:
          type: integer
          minimum: 1024
          maximum: 536870912
      required:
        - maxSeconds
        - maxInputBytes
        - maxOutputBytes
      additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: run
  effects:
    - execution
    - plugin.state.write
    - resources.publish
  usage:
    purpose: Evaluate existing immutable values and archive genuine evidence in the library; do not select strategy pool members.
    inputs: "{requestId,valuesRef,profile,referenceValues,budget}. Compute any reference factors separately and pass their matching Values refs; use [] when none are required."
    outputs: "{valuesRef,partition,evaluations,factorIds}. These are factor measurements; application backtests and final reports remain separate Agent decisions."
    prerequisites: []
    limitations:
      - All data and formulas must satisfy the frozen qlib-expr/1 contract; results retain missing evidence and exclusions.
  binding:
    type: native
    name: factor_evaluate
  resumable: true
  configurationRequirements:
    - field: pythonPath
      reason: Prepare or select the verified Qlib/DEAP/Optuna environment before numerical work.
      optional: false
  finalOutputSchema:
    type: object
    properties:
      valuesRef:
        $ref: "#/$defs/Ref"
      partition:
        type: string
        enum:
          - development
          - holdout
      evaluations:
        type: array
        items:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                status:
                  type: string
                  const: ok
                value:
                  $ref: "#/$defs/Evaluation"
              required:
                - id
                - status
                - value
              additionalProperties: false
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                status:
                  type: string
                  const: failed
                error:
                  $ref: "#/$defs/Error"
              required:
                - id
                - status
                - error
              additionalProperties: false
        minItems: 0
        maxItems: 64
      factorIds:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 128
        minItems: 0
        maxItems: 64
    required:
      - valuesRef
      - partition
      - evaluations
      - factorIds
    additionalProperties: false
    $defs:
      Diagnostic:
        oneOf:
          - type: object
            properties:
              kind:
                type: string
                const: placebo
              required:
                type: boolean
              repetitions:
                type: integer
                minimum: 1
                maximum: 10000
              options:
                type: object
                properties:
                  blockBars:
                    type: integer
                    minimum: 1
                    maximum: 100000
                  seed:
                    type: integer
                    minimum: 0
                    maximum: 2147483647
                  confidence:
                    type: number
                    exclusiveMinimum: 0
                    exclusiveMaximum: 1
                required:
                  - blockBars
                  - seed
                  - confidence
                additionalProperties: false
            required:
              - kind
              - required
              - repetitions
              - options
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                const: bootstrap
              required:
                type: boolean
              repetitions:
                type: integer
                minimum: 1
                maximum: 10000
              options:
                type: object
                properties:
                  blockBars:
                    type: integer
                    minimum: 1
                    maximum: 100000
                  seed:
                    type: integer
                    minimum: 0
                    maximum: 2147483647
                  confidence:
                    type: number
                    exclusiveMinimum: 0
                    exclusiveMaximum: 1
                required:
                  - blockBars
                  - seed
                  - confidence
                additionalProperties: false
            required:
              - kind
              - required
              - repetitions
              - options
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                const: walk_forward
              required:
                type: boolean
              options:
                type: object
                properties:
                  foldBars:
                    type: integer
                    minimum: 3
                    maximum: 1000000
                required:
                  - foldBars
                additionalProperties: false
            required:
              - kind
              - required
              - options
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                const: regimes
              required:
                type: boolean
              options:
                type: object
                properties:
                  field:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^[a-z][a-z0-9_]{0,63}$
                  bins:
                    type: array
                    items:
                      type: number
                    minItems: 1
                    maxItems: 20
                required:
                  - field
                  - bins
                additionalProperties: false
            required:
              - kind
              - required
              - options
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                const: sensitivity
              required:
                type: boolean
              options:
                type: object
                properties:
                  argumentPath:
                    type: array
                    items:
                      type: integer
                      minimum: 0
                      maximum: 1
                    minItems: 0
                    maxItems: 12
                  neighbors:
                    type: array
                    items:
                      type: number
                    minItems: 1
                    maxItems: 16
                required:
                  - argumentPath
                  - neighbors
                additionalProperties: false
            required:
              - kind
              - required
              - options
            additionalProperties: false
          - type: object
            properties:
              kind:
                type: string
                const: quantiles
              required:
                type: boolean
              options:
                type: object
                properties:
                  count:
                    type: integer
                    minimum: 2
                    maximum: 20
                required:
                  - count
                additionalProperties: false
            required:
              - kind
              - required
              - options
            additionalProperties: false
      Error:
        type: object
        properties:
          code:
            type: string
            minLength: 1
            maxLength: 128
          message:
            type: string
            minLength: 0
            maxLength: 2000
          retryable:
            type: boolean
        required:
          - code
          - message
          - retryable
        additionalProperties: false
      Evaluation:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          candidateId:
            type: string
            minLength: 1
            maxLength: 128
          valuesId:
            type: string
            minLength: 1
            maxLength: 128
          valuesRef:
            $ref: "#/$defs/Ref"
          context:
            $ref: "#/$defs/EvidenceContext"
          profile:
            $ref: "#/$defs/Profile"
          partition:
            type: string
            enum:
              - development
              - holdout
          pairs:
            type: integer
            minimum: 0
            maximum: 100000000
          coverage:
            $ref: "#/$defs/Metric"
          ic:
            $ref: "#/$defs/Metric"
          rankIC:
            $ref: "#/$defs/Metric"
          stability:
            $ref: "#/$defs/Metric"
          maxReferenceCorrelation:
            $ref: "#/$defs/Metric"
          complement:
            $ref: "#/$defs/Metric"
          score:
            $ref: "#/$defs/Metric"
          diagnostics:
            type: array
            items:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - placebo
                    - bootstrap
                    - walk_forward
                    - regimes
                    - sensitivity
                    - quantiles
                status:
                  type: string
                  enum:
                    - passed
                    - failed
                    - incomplete
                evidence:
                  oneOf:
                    - $ref: "#/$defs/Ref"
                    - type: "null"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required:
                - kind
                - status
                - evidence
              additionalProperties: false
            minItems: 0
            maxItems: 6
          eligibility:
            type: string
            enum:
              - supported
              - insufficient
              - invalid
          reasons:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 2000
            minItems: 0
            maxItems: 256
          details:
            $ref: "#/$defs/Ref"
        required:
          - id
          - candidateId
          - valuesId
          - valuesRef
          - context
          - profile
          - partition
          - pairs
          - coverage
          - ic
          - rankIC
          - stability
          - maxReferenceCorrelation
          - complement
          - score
          - diagnostics
          - eligibility
          - reasons
          - details
        additionalProperties: false
      EvidenceContext:
        type: object
        properties:
          snapshotId:
            type: string
            minLength: 1
            maxLength: 128
          sourceDigest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          layoutDigest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          profileDigest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          engineDigest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          referenceDigest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
        required:
          - snapshotId
          - sourceDigest
          - layoutDigest
          - profileDigest
          - engineDigest
          - referenceDigest
        additionalProperties: false
      Metric:
        type: object
        properties:
          value:
            oneOf:
              - type: number
              - type: "null"
          status:
            type: string
            enum:
              - computed
              - unavailable
          reason:
            type: string
            minLength: 1
            maxLength: 2000
        required:
          - value
          - status
        additionalProperties: false
      Profile:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          version:
            type: number
            const: 1
          kind:
            type: string
            enum:
              - alpha
              - risk
              - state
          axis:
            type: string
            enum:
              - time_series
              - cross_section
          minPairs:
            type: integer
            minimum: 3
            maximum: 1000000
          minCoverage:
            type: number
            minimum: 0
            maximum: 1
          stabilityWindows:
            type: integer
            minimum: 2
            maximum: 100
          maxReferenceCorrelation:
            type: number
            minimum: 0
            maximum: 1
          score:
            type: string
            enum:
              - abs_rank_ic
              - eta_squared
          diagnostics:
            type: array
            items:
              $ref: "#/$defs/Diagnostic"
            minItems: 0
            maxItems: 6
        required:
          - id
          - version
          - kind
          - axis
          - minPairs
          - minCoverage
          - stabilityWindows
          - maxReferenceCorrelation
          - score
          - diagnostics
        additionalProperties: false
      Ref:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 256
          revision:
            type: string
            minLength: 1
            maxLength: 256
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            type: string
            minLength: 1
            maxLength: 256
          schemaVersion:
            type: string
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
