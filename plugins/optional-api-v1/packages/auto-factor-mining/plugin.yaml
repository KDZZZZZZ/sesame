    artifactSchemas:
      - id: factor-resource
        kind: resource
        schemaVersion: 1.0.0
        schema:
          type: object
          properties:
            format:
              type: string
              enum:
                - factor-json/1
                - factor-binary/1
            path:
              type: string
              enum:
                - payload.json
                - payload.bin
            bytesDigest:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
            schema:
              type: string
              enum:
                - factor-snapshot/1
                - factor-source-rows/1
                - factor-provider/1
                - factor-provider-features/1
                - factor-symbol-map/1
                - factor-calendar/1
                - factor-matrix/1
                - factor-values/1
                - factor-search-state/1
                - factor-evidence/1
                - factor-usage/1
                - factor-history/1
                - factor-provider-file/1
          required:
            - format
            - path
            - bytesDigest
            - schema
          additionalProperties: false
      - id: factor-source
        kind: data
        schemaVersion: 1.0.0
        schema:
          type: object
          properties:
            format:
              type: string
              const: json-rows
            path:
              type: string
              const: payload.json
            rowCount:
              type: integer
              minimum: 0
              maximum: 100000000
            columns:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 128
              minItems: 0
              maxItems: 256
            provenance:
              type: object
              maxProperties: 128
              additionalProperties:
                $ref: "#/$defs/Json"
          required:
            - format
            - path
            - rowCount
            - columns
            - provenance
          additionalProperties: false
          $defs:
            Json:
              oneOf:
                - type: "null"
                - type: boolean
                - type: number
                - type: string
                  minLength: 0
                  maxLength: 65536
                - type: array
