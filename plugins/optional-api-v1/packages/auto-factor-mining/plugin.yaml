formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/auto-factor-mining
title: 因子研究
description: 由 Agent 直接组织因子研究：分别调用数据冻结、DEAP/Optuna 搜索、Qlib 计算、纯因子评价及因子库。策略通过明确决策维护自己的因子池。提供产物依赖工作流 factor.development。
version: 3.1.3
license: MIT
engines:
  sesame: ">=0.3.0-dev.2 <0.4.0"
author:
  name: Sesame contributors
entry: index.js
x-sesame:
  catalog:
    category: "research"
    functionalCategory: "analysis"
    implementationKinds: ["function"]
    title:
      en: "Factor research"
      zh: "因子研究"
    summary:
      en: "Agent-directed data preparation, search, Qlib computation and pure factor evaluation, with an evidence library and explicit strategy-owned pools."
      zh: "由 Agent 直接组织数据冻结、搜索、Qlib 计算及纯因子评价，保存证据库；策略明确决定自己的因子池。"
    dependencies:
      en: "Verified private Windows x64 CPython 3.12 with pinned dependencies, immutable numerical data and an explicit target/profile. Strategy backtests are external."
      zh: "需要已核验的 Windows x64 CPython 3.12 私有固定依赖、不可变数值数据及明确目标与评价配置；策略回测由外部能力执行。"
  default_state: discoverable
  agent_scope: all
  permissions:
    scopes:
      - capabilities.compose
      - process.execute
    calls:
      - host.process.exec
  contributions:
    configSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/factor_environment
      - tool/factor_prepare
      - tool/factor_search
      - tool/factor_compute
      - tool/factor_evaluate
      - tool/factor_library
      - tool/factor_pool
      - id: factor_configuration_read
        kind: function
        consumers:
          - host
        description: Read the saved environment selection for unified configuration.
        inputSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            pythonPath:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 4096
                - type: "null"
            ready:
              type: boolean
          required:
            - pythonPath
            - ready
          additionalProperties: false
        execution: immediate
        effects:
          - read
        usage:
          purpose: Read the saved environment selection for unified configuration.
          inputs: "{}; reads selected configuration without installation or numerical work."
          outputs: "{pythonPath,ready}; execution rechecks the actual environment before computing."
          prerequisites: []
          limitations:
            - All data and formulas must satisfy the frozen qlib-expr/1 contract; results retain missing evidence and exclusions.
        binding:
          type: native
          name: factor_configuration_read
      - id: factor_configuration_update
        kind: function
        consumers:
          - host
        description: Verify and select an existing compatible Python environment.
        inputSchema:
          type: object
          properties:
            pythonPath:
              type: string
              minLength: 1
              maxLength: 4096
            command_id:
              type: string
              minLength: 1
              maxLength: 128
            expected_version:
              type: integer
              minimum: 0
              maximum: 2147483647
          required:
            - pythonPath
            - command_id
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            pythonPath:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 4096
                - type: "null"
            ready:
              type: boolean
          required:
            - pythonPath
            - ready
          additionalProperties: false
        execution: immediate
        effects:
          - process
          - plugin.state.write
        usage:
          purpose: Verify and select an existing compatible Python environment.
          inputs: "{pythonPath,command_id,expected_version?}; only existing dependencies are probed; use factor_environment prepare for installation."
          outputs: "{pythonPath,ready} after actual environment verification."
          prerequisites: []
          limitations:
            - All data and formulas must satisfy the frozen qlib-expr/1 contract; results retain missing evidence and exclusions.
        binding:
          type: native
          name: factor_configuration_update
    sources: []
    services: []
    hooks: []
    views: []
    configuration:
      title: 因子研究环境
      fields:
        - id: pythonPath
          title: Python 环境
          description: 已核验的 CPython 3.12 与固定 Qlib、DEAP、Optuna 依赖。安装私有依赖请调用 factor_environment prepare。
          schema:
            type: string
            minLength: 1
            maxLength: 4096
          binding:
            type: capability
            read: factor_configuration_read
            update: factor_configuration_update
            valuePath: /pythonPath
            configuredPath: /ready
            writePath: /pythonPath
    knowledge:
      - id: prompt
        path: instructions.md
        kind: prompt
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: readme
        path: README.md
        kind: reference
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: provenance
        path: PROVENANCE.md
        kind: reference
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: validation
        path: VALIDATION.md
        kind: reference
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: factor-research
        path: skills/auto-factor-mining/SKILL.md
        kind: skill
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: contracts
        path: references/contracts.md
        kind: reference
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: evaluation
        path: references/evaluation.md
        kind: reference
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: search
        path: references/search.md
        kind: reference
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: execution
        path: references/execution.md
        kind: reference
        description: Current factor-research v3 contract, usage or verification evidence. Agent directly orchestrates each independent step.
      - id: external-factor-sources
        path: references/external-factor-sources.md
        kind: reference
        description: External formula reference links, semantic checks and on-demand registration into the user factor library. Contains no bundled upstream formula catalog or code.
