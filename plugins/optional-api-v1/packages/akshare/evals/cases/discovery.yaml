id: akshare-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/akshare/skills/akshare-research/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/akshare
  - step: 1
    pointer: /tools/0/name
    equals: akshare_catalog
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties: {}
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: |-
      ---
      name: akshare-research
      description: Query declared A-share public research interfaces and daily 
