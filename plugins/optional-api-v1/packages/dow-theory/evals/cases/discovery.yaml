id: dow-theory-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/dow-theory/skills/dow-theory/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/dow-theory
  - step: 1
    pointer: /tools
    equals: []
  - step: 2
    pointer: /contents/0/text
    contains: "# Dow Theory 趋势确认"
