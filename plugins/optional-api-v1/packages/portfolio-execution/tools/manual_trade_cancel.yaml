name: manual_trade_cancel
title: manual_trade_cancel
description: Request cancellation of a confirmed pending order created through this plugin, using a separate stable operation ID. Does not close a filled position. Query afterwards; cancel_requested is not confirmed cancellation.
inputSchema:
  type: object
  required:
    - operation_id
    - original_operation_id
    - user_authorized
  properties:
    operation_id:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,100}$
    original_operation_id:
      type: string
      minLength: 1
      maxLength: 100
      description: Original manual_trade_execute operation
    user_authorized:
      type: boolean
      const: true
  additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: run
  effects:
    - broker.write
    - state.write
  usage:
    purpose: Request cancellation of a confirmed pending order created through this plugin, using a separate stable operation ID. Does not close a filled position. Query afterwards; cancel_requested is not confirmed cancellation.
    inputs: "{operation_id:<new stable cancellation ID>,original_operation_id:<existing plugin order>,user_authorized:true}."
    outputs: Host Run output is a durable cancellation record with originalOperationId, receipt and status (cancel_requested/rejected/outcome_unknown); status(refresh:true) reads the original order evidence.
    prerequisites:
      - Main conversation only; task/tool names do not grant a delegated Agent this authority.
      - User cancellation intent for a confirmed pending order created through this plugin.
    limitations:
      - cancel_requested is not confirmed cancellation and cannot close an already filled position. Unknown cancel results retain the same cancellation ID.
  binding:
    type: native
    name: manual_trade_cancel
  finalOutputSchema:
    type: object
