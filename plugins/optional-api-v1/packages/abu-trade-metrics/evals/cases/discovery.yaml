id: abu-trade-metrics-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/abu-trade-metrics/skills/abu-trade-metrics/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/abu-trade-metrics
  - step: 1
    pointer: /tools/0/name
    equals: abu_trade_metrics_analyze
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        input:
          type: object
          properties:
            schema_version:
              const: 1
            as_of:
              type: string
              description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
            source:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 500
                kind:
                  enum:
                    - synthetic
                    - historical
                    - live
              required:
                - id
                - kind
              additionalProperties: true
              description: Caller-declared provenance; synthetic remains synthetic in output artifacts.
            parameters:
              type: object
              properties:
                periods_per_year:
                  type: number
                  default: 252
                  minimum: 1
                  maximum: 100000
                  description: 收益采样频率的每年期数
                risk_free_rate:
                  type: number
                  default: 0
                  minimum: -1
                  maximum: 1
                  description: 年化无风险利率
              additionalProperties: false
              description: Optional overrides. Defaults and limits match the existing calculation.
            portfolio:
              type: object
              properties:
                currency:
                  type: string
                basis:
                  enum:
                    - adjusted_equity
                    - closed_trade_equity
                no_external_flows:
                  const: true
                  description: Evidence must actually exclude or adjust external cash flows.
              additionalProperties: true
              required:
                - currency
                - basis
                - no_external_flows
            equity_curve:
              type: array
              items:
                type: object
                properties:
                  time:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  available_at:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  equity:
                    type: number
                additionalProperties: true
                required:
                  - time
                  - available_at
                  - equity
              maxItems: 10000
              minItems: 2
            closed_trades:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  strategy:
                    type: string
                  entry_time:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  exit_time:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  available_at:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  gross_pnl:
                    type: number
                  net_pnl:
                    type: number
                  cost:
                    type: number
                additionalProperties: true
              maxItems: 10000
          additionalProperties: true
          required:
            - schema_version
            - source
            - as_of
            - portfolio
            - equity_curve
          description: 完整的固定输入对象；examples/input.json 仅为合成格式示例，不是实盘证据。
      required:
        - input
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# 交易结果诊断"
