id: deep-reasoning-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/deep-reasoning/skills/deep-reasoning/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/deep-reasoning
  - step: 1
    pointer: /tools
    equals: []
  - step: 2
    pointer: /contents/0/text
    contains: "# 深度推理"
