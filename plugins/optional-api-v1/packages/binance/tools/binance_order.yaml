name: binance_order
title: binance_order
description: 执行已授权的币安 Spot 市价或限价单；内部并行准备账户/交易规则/报价，持久化 operation_id 后发送。
inputSchema:
  type: object
  properties:
    operation_id:
      type: string
      minLength: 1
      maxLength: 128
    environment:
      type: string
      enum:
        - production
        - testnet
    symbol:
      type: string
      minLength: 1
      maxLength: 128
    action:
      type: string
      enum:
        - market
        - limit
    side:
      type: string
      enum:
        - buy
        - sell
    quantity:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
    limit_price:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
    price_limit:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
    time_in_force:
      type: string
      enum:
        - GTC
        - IOC
        - FOK
    user_authorized:
      type: boolean
      const: true
  required:
    - operation_id
    - environment
    - symbol
    - action
    - side
    - quantity
    - user_authorized
  additionalProperties: false
outputSchema:
  type: object
  properties:
    contract:
      type: string
      const: sesame.execution-adapter/1
    backend:
      type: string
      const: binance
  required:
    - contract
    - backend
  additionalProperties: true
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - external-trading
    - network
    - plugin.state.write
  usage:
    purpose: 执行已授权的币安 Spot 市价或限价单；内部并行准备账户/交易规则/报价，持久化 operation_id 后发送。
    inputs: '{operation_id:"spot-buy-001",environment:"testnet",symbol:"BTCUSDT",action:"limit",side:"buy",quantity:"0.001",limit_price:"50000",user_authorized:true}；quantity 是基础资产数量，限价单必须有 limit_price。'
    outputs: "{contract,backend,status,submissionAttempted,raw}；raw 保存 account、clientOrderId、真实订单状态/成交或安全错误。"
    prerequisites:
      - Configure the selected environment and HMAC API key/secret through configuration_integration_apply.
      - Trading mutations require the authorized main conversation; configuration presence alone does not grant trading permission.
    limitations:
      - 同一 operation_id 只发送一次；未知结果先 binance_order_status，不能换 ID 盲目重下。
      - 市价单的 price_limit 只约束发送前报价，不能保证实际成交价格；需要价格上限时使用 limit。
      - Spot 卖出使用已有基础资产；不做空、不接受 position_id/MT5 附加止损。portfolio-execution 当前只接 MT5/QMT，币安用本包工具。
  configurationRequirements:
    - field: environment
      optional: true
      reason: Select production or Spot Testnet; default is testnet.
    - field: api_key
      reason: Binance private account or trading operation.
    - field: api_secret
      reason: HMAC signing for the selected Binance account.
  binding:
    type: native
    name: binance_order
