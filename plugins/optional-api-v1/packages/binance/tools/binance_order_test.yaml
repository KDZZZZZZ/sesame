name: binance_order_test
title: binance_order_test
description: 向币安 /order/test 验证订单参数与签名，不送入撮合；结果不代表真实下单或成交。
inputSchema:
  type: object
  properties:
    operation_id:
      type: string
      minLength: 1
      maxLength: 128
    environment:
      type: string
      enum:
        - production
        - testnet
    symbol:
      type: string
      minLength: 1
      maxLength: 128
    action:
      type: string
      enum:
        - market
        - limit
    side:
      type: string
      enum:
        - buy
        - sell
    quantity:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
    limit_price:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
    price_limit:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
      maxLength: 64
    time_in_force:
      type: string
      enum:
        - GTC
        - IOC
        - FOK
    user_authorized:
      type: boolean
      const: true
  required:
    - operation_id
    - environment
    - symbol
    - action
    - side
    - quantity
  additionalProperties: false
outputSchema:
  type: object
  properties:
    contract:
      type: string
      const: sesame.execution-adapter/1
    backend:
      type: string
      const: binance
  required:
    - contract
    - backend
  additionalProperties: true
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - network
    - plugin.state.write
  usage:
    purpose: 向币安 /order/test 验证订单参数与签名，不送入撮合；结果不代表真实下单或成交。
    inputs: Use the declared object schema; see INTERFACES.md for concrete examples.
    outputs: status:"validated", raw.createsOrder:false 表示测试接口已通过；错误仍保留原生错误码，绝不伪称成交。
    prerequisites:
      - Configure the selected environment and HMAC API key/secret through configuration_integration_apply.
      - Trading mutations require the authorized main conversation; configuration presence alone does not grant trading permission.
    limitations:
      - Spot production and Spot Testnet are distinct identities. Futures, margin and withdrawals are outside this adapter.
  configurationRequirements:
    - field: environment
      optional: true
      reason: Select production or Spot Testnet; default is testnet.
    - field: api_key
      reason: Binance private account or trading operation.
    - field: api_secret
      reason: HMAC signing for the selected Binance account.
  binding:
    type: native
    name: binance_order_test
