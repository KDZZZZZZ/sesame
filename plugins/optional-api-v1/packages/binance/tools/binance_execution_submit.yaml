name: binance_execution_submit
title: binance_execution_submit
description: Binance Spot 标准执行适配 submit；保留精确账户环境、原生数量和真实回执。
inputSchema:
  type: object
  properties:
    observation:
      type: object
      properties:
        backend:
          type: string
          const: binance
        symbol:
          type: string
          minLength: 1
          maxLength: 128
        account:
          type: object
          properties:
            accountId:
              type: string
              minLength: 1
              maxLength: 128
            connectionId:
              type: string
              minLength: 1
              maxLength: 128
            revision:
              type: string
              minLength: 1
              maxLength: 128
          required:
            - accountId
            - connectionId
            - revision
          additionalProperties: false
      required:
        - backend
        - symbol
        - account
      additionalProperties: true
    intent:
      type: object
      properties:
        operation_id:
          type: string
          minLength: 1
          maxLength: 128
        environment:
          type: string
          enum:
            - production
            - testnet
        symbol:
          type: string
          minLength: 1
          maxLength: 128
        action:
          type: string
          enum:
            - market
            - limit
        side:
          type: string
          enum:
            - buy
            - sell
        quantity:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          maxLength: 64
        limit_price:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          maxLength: 64
        price_limit:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          maxLength: 64
        time_in_force:
          type: string
          enum:
            - GTC
            - IOC
            - FOK
        user_authorized:
          type: boolean
          const: true
      required:
        - operation_id
        - action
        - side
        - quantity
        - user_authorized
      additionalProperties: false
  required:
    - observation
    - intent
  additionalProperties: false
outputSchema:
  type: object
  properties:
    contract:
      type: string
      const: sesame.execution-adapter/1
    backend:
      type: string
      const: binance
  required:
    - contract
    - backend
  additionalProperties: true
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - external-trading
    - network
    - plugin.state.write
  usage:
    purpose: Binance Spot 标准执行适配 submit；保留精确账户环境、原生数量和真实回执。
    inputs: Use the declared object schema; see INTERFACES.md for concrete examples.
    outputs: Exact source observations and status, or an explicit operation error.
    prerequisites:
      - Binance shared configuration is present and authenticated.
      - The standard service is declared for explicit composition; portfolio-execution currently excludes Spot semantics. Use the direct Binance tools for this release.
    limitations:
      - No futures, margin, position-ticket close or attached stops. prepare observes existing permissions and does not alter exchange permissions.
  configurationRequirements:
    - field: environment
      optional: true
      reason: Select production or Spot Testnet; default is testnet.
    - field: api_key
      reason: Binance private account or trading operation.
    - field: api_secret
      reason: HMAC signing for the selected Binance account.
  binding:
    type: native
    name: binance_execution_submit
