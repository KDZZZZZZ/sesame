formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/binance
title: Binance Spot backend
description: 币安现货与 Spot Testnet 后端：公开行情与共享实时订阅、账户余额、订单成交、幂等下单/减量改单/撤单与未知结果恢复；统一配置密钥。
version: 1.0.4
license: MIT
engines:
  sesame: ">=0.3.0-dev.1 <0.4.0"
author:
  name: Sesame contributors
  url: https://github.com/KDZZZZZZ/sesame
entry: index.js
x-sesame:
  default_state: discoverable
  mcp_export:
    - binance_catalog
    - binance_account
    - binance_execution_identity
    - binance_execution_snapshot
    - binance_order_status
  prompts:
    - instructions.md
  skills:
    - skills
  resources:
    - README.md
    - INTERFACES.md
    - PROVENANCE.md
    - VALIDATION.md
  permissions:
    scopes: []
    calls: []
  contributions:
    configSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/binance_catalog
      - tool/binance_account
      - tool/binance_order
      - tool/binance_order_test
      - tool/binance_order_status
      - tool/binance_cancel
      - tool/binance_amend
      - tool/binance_execution_identity
      - tool/binance_execution_snapshot
      - tool/binance_execution_prepare
      - tool/binance_execution_submit
      - tool/binance_execution_recover
      - tool/binance_execution_command
      - tool/binance_execution_cancel
      - id: market_bind
        kind: function
        consumers:
          - host
        description: Binance Spot 标准行情 bind；生产/测试网精确分离，十进制与 UTC 时间不改写。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              properties:
                connection:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 128
                    revision:
                      type: string
                      minLength: 1
                      maxLength: 128
                  required:
                    - id
                    - revision
                  additionalProperties: false
                configuration:
                  type: object
                  properties:
                    environment:
                      type: string
                      enum:
                        - production
                        - testnet
                  required:
                    - environment
                  additionalProperties: false
              required: []
              additionalProperties: false
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.write
        usage:
          purpose: Binance Spot 标准行情 bind；生产/测试网精确分离，十进制与 UTC 时间不改写。
          inputs: '{binding:{configuration:{environment:"production"}}}；也可使用 binance_catalog 返回的精确 connection。'
          outputs: 返回标准源绑定或分页 items/metadata。
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - 公开源使用官方 Binance REST/WebSocket；无 Python/CCXT 依赖。月周期 1mo 对应 Binance 1M，柱结束时间来自源，不按固定月长构造。
            - 单次历史范围最多 10000 根；每页 1000；多消费者复用相同环境/品种/周期的订阅和限流预算。
        binding:
          type: native
          name: market_bind
      - id: market_unbind
        kind: function
        consumers:
          - host
        description: Binance Spot 标准行情 unbind；生产/测试网精确分离，十进制与 UTC 时间不改写。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            closed:
              const: true
          required:
            - closed
          additionalProperties: false
        execution: immediate
        effects:
          - plugin.session.close
        usage:
          purpose: Binance Spot 标准行情 unbind；生产/测试网精确分离，十进制与 UTC 时间不改写。
          inputs: 由宿主数据入口提供 binding/query/page。Agent 使用 data_providers 返回的 sesame/binance#market 精确来源，经 market_instruments / market_read 或 canvas_binding。
          outputs: 返回标准源绑定或分页 items/metadata。
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - 公开源使用官方 Binance REST/WebSocket；无 Python/CCXT 依赖。月周期 1mo 对应 Binance 1M，柱结束时间来自源，不按固定月长构造。
            - 单次历史范围最多 10000 根；每页 1000；多消费者复用相同环境/品种/周期的订阅和限流预算。
        binding:
          type: native
          name: market_unbind
      - id: market_searchInstruments
        kind: function
        consumers:
          - host
        description: Binance Spot 标准行情 searchInstruments；生产/测试网精确分离，十进制与 UTC 时间不改写。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                query:
                  type: string
                assetClasses:
                  type: array
                  items:
                    type: string
                    minLength: 1
                venues:
                  type: array
                  items:
                    type: string
                    minLength: 1
              required: []
              additionalProperties: false
            page:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                cursor:
                  type: string
                  minLength: 1
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
            - page
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            items:
              type: array
            nextCursor:
              type: string
              minLength: 1
            metadata:
              type: object
              additionalProperties: true
          required:
            - items
            - metadata
          additionalProperties: false
        execution: immediate
        effects:
          - network
          - plugin.state.write
        usage:
          purpose: Binance Spot 标准行情 searchInstruments；生产/测试网精确分离，十进制与 UTC 时间不改写。
          inputs: 由宿主数据入口提供 binding/query/page。Agent 使用 data_providers 返回的 sesame/binance#market 精确来源，经 market_instruments / market_read 或 canvas_binding。
          outputs: 返回标准源绑定或分页 items/metadata。
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - 公开源使用官方 Binance REST/WebSocket；无 Python/CCXT 依赖。月周期 1mo 对应 Binance 1M，柱结束时间来自源，不按固定月长构造。
            - 单次历史范围最多 10000 根；每页 1000；多消费者复用相同环境/品种/周期的订阅和限流预算。
        binding:
          type: native
          name: market_searchInstruments
      - id: market_describeInstrument
        kind: function
        consumers:
          - host
        description: Binance Spot 标准行情 describeInstrument；生产/测试网精确分离，十进制与 UTC 时间不改写。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instrument:
                  type: object
                  properties:
                    sourceId:
                      type: string
                      minLength: 1
                    instrumentId:
                      type: string
                      minLength: 1
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
              required:
