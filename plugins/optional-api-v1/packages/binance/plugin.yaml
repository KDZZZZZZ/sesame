          - plugin.state.write
        usage:
          purpose: Binance Spot 标准行情 describeInstrument；生产/测试网精确分离，十进制与 UTC 时间不改写。
          inputs: 由宿主数据入口提供 binding/query/page。Agent 使用 data_providers 返回的 sesame/binance#market 精确来源，经 market_instruments / market_read 或 canvas_binding。
          outputs: 返回标准源绑定或分页 items/metadata。
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - 公开源使用官方 Binance REST/WebSocket；无 Python/CCXT 依赖。月周期 1mo 对应 Binance 1M，柱结束时间来自源，不按固定月长构造。
            - 单次历史范围最多 10000 根；每页 1000；多消费者复用相同环境/品种/周期的订阅和限流预算。
        binding:
          type: native
          name: market_describeInstrument
      - id: market_queryBars
        kind: function
        consumers:
          - host
        description: Binance Spot 标准行情 queryBars；生产/测试网精确分离，十进制与 UTC 时间不改写。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instrument:
                  type: object
                  properties:
                    sourceId:
                      type: string
                      minLength: 1
                    instrumentId:
                      type: string
                      minLength: 1
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
                spec:
                  type: object
                  properties:
                    timeframe:
                      type: string
                      minLength: 1
                    priceBasis:
                      enum:
                        - bid
                        - ask
                        - mid
                        - last
                    adjustment:
                      enum:
                        - none
                        - forward
                        - backward
                    session:
                      type: string
                      minLength: 1
                    calendarRevision:
                      type: object
                      additionalProperties: true
                  required:
                    - timeframe
                    - priceBasis
                    - adjustment
                    - session
                    - calendarRevision
                  additionalProperties: false
                range:
                  type: object
                  properties:
                    from:
                      anyOf:
                        - type: object
                          properties:
                            basis:
                              const: utc
                            unixMs:
                              type: integer
                          required:
                            - basis
                            - unixMs
                          additionalProperties: false
                        - type: object
                          properties:
                            basis:
                              const: wall
                            authority:
                              type: string
                              minLength: 1
                            zone:
                              type: string
                              minLength: 1
                            value:
                              type: string
                              minLength: 1
                            fold:
                              type: integer
                          required:
                            - basis
                            - authority
                            - value
                          additionalProperties: false
                    to:
                      anyOf:
                        - type: object
                          properties:
                            basis:
                              const: utc
                            unixMs:
                              type: integer
                          required:
                            - basis
                            - unixMs
                          additionalProperties: false
                        - type: object
                          properties:
                            basis:
                              const: wall
                            authority:
                              type: string
                              minLength: 1
                            zone:
                              type: string
                              minLength: 1
                            value:
                              type: string
                              minLength: 1
                            fold:
                              type: integer
                          required:
                            - basis
                            - authority
                            - value
                          additionalProperties: false
                  required:
                    - from
                    - to
                  additionalProperties: false
                includeForming:
                  type: boolean
                direction:
                  enum:
                    - forward
                    - backward
              required:
                - instrument
                - spec
                - range
              additionalProperties: false
            page:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                cursor:
                  type: string
                  minLength: 1
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
            - page
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            items:
              type: array
            nextCursor:
              type: string
              minLength: 1
            metadata:
              type: object
              additionalProperties: true
          required:
            - items
            - metadata
          additionalProperties: false
        execution: immediate
        effects:
          - network
          - plugin.state.write
        usage:
          purpose: Binance Spot 标准行情 queryBars；生产/测试网精确分离，十进制与 UTC 时间不改写。
          inputs: 由宿主数据入口提供 binding/query/page。Agent 使用 data_providers 返回的 sesame/binance#market 精确来源，经 market_instruments / market_read 或 canvas_binding。
          outputs: "{items,nextCursor?,metadata:{seriesId,instrument,spec,coverage,cache,meta,connection}}；缓存比视区前后各多 100 根，过期保留已有数据并后台刷新。"
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - 公开源使用官方 Binance REST/WebSocket；无 Python/CCXT 依赖。月周期 1mo 对应 Binance 1M，柱结束时间来自源，不按固定月长构造。
            - 单次历史范围最多 10000 根；每页 1000；多消费者复用相同环境/品种/周期的订阅和限流预算。
        binding:
          type: native
          name: market_queryBars
      - id: market_subscribeBars
        kind: function
        consumers:
          - host
        description: Binance Spot 标准行情 subscribeBars；生产/测试网精确分离，十进制与 UTC 时间不改写。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instrument:
                  type: object
                  properties:
                    sourceId:
                      type: string
                      minLength: 1
                    instrumentId:
                      type: string
                      minLength: 1
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
                spec:
                  type: object
                  properties:
                    timeframe:
                      type: string
                      minLength: 1
                    priceBasis:
                      enum:
                        - bid
                        - ask
                        - mid
                        - last
                    adjustment:
                      enum:
                        - none
                        - forward
                        - backward
                    session:
                      type: string
                      minLength: 1
                    calendarRevision:
                      type: object
                      additionalProperties: true
                  required:
                    - timeframe
                    - priceBasis
                    - adjustment
                    - session
                    - calendarRevision
                  additionalProperties: false
                tailLimit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                includeForming:
                  type: boolean
                resumeToken:
                  type: string
                  minLength: 1
              required:
                - instrument
                - spec
                - tailLimit
              additionalProperties: false
          required:
            - binding
            - query
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - network
          - plugin.state.write
        usage:
          purpose: Binance Spot 标准行情 subscribeBars；生产/测试网精确分离，十进制与 UTC 时间不改写。
          inputs: 由宿主数据入口提供 binding/query/page。Agent 使用 data_providers 返回的 sesame/binance#market 精确来源，经 market_instruments / market_read 或 canvas_binding。
          outputs: "{id,events,close}，首帧 snapshot 后推送 bars.upsert/bars.closed/stream.gap；断线以新快照恢复。"
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - 公开源使用官方 Binance REST/WebSocket；无 Python/CCXT 依赖。月周期 1mo 对应 Binance 1M，柱结束时间来自源，不按固定月长构造。
            - 单次历史范围最多 10000 根；每页 1000；多消费者复用相同环境/品种/周期的订阅和限流预算。
        transport: subscription
        binding:
          type: native
          name: market_subscribeBars
      - id: market_subscribeQuotes
        kind: function
        consumers:
          - host
        description: 共享 Binance Spot ticker WebSocket 提供带源时间的报价。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instruments:
                  type: array
                  items:
                    type: object
                    properties:
                      sourceId:
                        type: string
                        minLength: 1
                      instrumentId:
                        type: string
                        minLength: 1
                    required:
                      - sourceId
                      - instrumentId
                    additionalProperties: false
                  minItems: 1
                  maxItems: 20
                resumeToken:
                  type: string
                  minLength: 1
              required:
                - instruments
              additionalProperties: false
          required:
            - binding
            - query
          additionalProperties: false
        outputSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: true
        execution: immediate
        effects:
          - network
          - plugin.session.write
        usage:
          purpose: 共享 Binance Spot ticker WebSocket 提供带源时间的报价。
          inputs: '{binding,query:{instruments:[{sourceId:"binance:production:spot",instrumentId:"BTCUSDT"}]}}；最多 20 个品种。'
          outputs: 标准订阅首帧 {quotes}，随后 quotes.upsert；ticker 默认约一秒更新。
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - Spot production and Spot Testnet are distinct identities. Futures, margin and withdrawals are outside this adapter.
        transport: subscription
        binding:
          type: native
          name: market_subscribeQuotes
      - id: account_bind
        kind: function
        consumers:
          - host
        description: Binance Spot 标准账户 bind；余额为多资产，不虚构统一净值或交易对仓位。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              properties:
                connection:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 128
                    revision:
                      type: string
                      minLength: 1
                      maxLength: 128
                  required:
                    - id
                    - revision
                  additionalProperties: false
              required: []
              additionalProperties: false
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - backend.read
          - network
          - plugin.state.write
        usage:
          purpose: Binance Spot 标准账户 bind；余额为多资产，不虚构统一净值或交易对仓位。
          inputs: 通过 data_providers 的 sesame/binance#account 及账户来源入口调用。账户环境来自统一配置，connection/revision 精确校验。
          outputs: 标准账户摘要/快照；快照 native.balances 给出每资产 free/locked，未转换资产的 balance/equity 保持 unknown。
          prerequisites:
            - Configure the selected environment and HMAC API key/secret through configuration_integration_apply.
            - Trading mutations require the authorized main conversation; configuration presence alone does not grant trading permission.
          limitations:
            - Spot production and Spot Testnet are distinct identities. Futures, margin and withdrawals are outside this adapter.
        configurationRequirements:
          - field: environment
            optional: true
            reason: Select production or Spot Testnet; default is testnet.
          - field: api_key
            reason: Binance private account or trading operation.
          - field: api_secret
            reason: HMAC signing for the selected Binance account.
        binding:
          type: native
          name: account_bind
      - id: account_unbind
        kind: function
        consumers:
          - host
        description: Binance Spot 标准账户 unbind；余额为多资产，不虚构统一净值或交易对仓位。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.close
        usage:
