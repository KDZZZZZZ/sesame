          inputs: 通过 data_providers 的 sesame/binance#account 及账户来源入口调用。账户环境来自统一配置，connection/revision 精确校验。
          outputs: 标准账户摘要/快照；快照 native.balances 给出每资产 free/locked，未转换资产的 balance/equity 保持 unknown。
          prerequisites:
            - Public market operations do not require an API key.
          limitations:
            - Spot production and Spot Testnet are distinct identities. Futures, margin and withdrawals are outside this adapter.
        binding:
          type: native
          name: account_unbind
      - id: account_listAccounts
        kind: function
        consumers:
          - host
        description: Binance Spot 标准账户 listAccounts；余额为多资产，不虚构统一净值或交易对仓位。
        inputSchema:
