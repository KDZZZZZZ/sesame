    sources:
      - id: market
        contract: sesame.market/1
        consumer: host
        configSchema:
          type: object
          properties:
            connection:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                revision:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - id
                - revision
              additionalProperties: false
            configuration:
              type: object
              properties:
                environment:
                  type: string
                  enum:
                    - production
                    - testnet
              required:
                - environment
              additionalProperties: false
          required: []
          additionalProperties: false
        presentation:
          connection:
            required: false
          limits:
            transportMode: push
            minPollIntervalMs: 1000
            maxPageSize: 1000
            maxSubscriptionInstruments: 20
        operations:
          bind: market_bind
          unbind: market_unbind
          searchInstruments: market_searchInstruments
          describeInstrument: market_describeInstrument
          queryBars: market_queryBars
          subscribeBars: market_subscribeBars
          subscribeQuotes: market_subscribeQuotes
      - id: account
        contract: sesame.account/1
        consumer: host
        configSchema:
          type: object
          properties:
            connection:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                revision:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - id
                - revision
              additionalProperties: false
          required: []
          additionalProperties: false
        presentation:
          connection:
            required: false
          limits:
            minPollIntervalMs: 10000
            maxPageSize: 1000
            historyRequiresInstruments: true
            maxHistoryWindowMs: 86400000
        operations:
          bind: account_bind
          unbind: account_unbind
          listAccounts: account_listAccounts
          snapshot: account_snapshot
          queryOrders: account_queryOrders
          queryFills: account_queryFills
    services:
      - id: execution
        contract: sesame.execution-adapter/1
        consumer: host
        configSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        operations:
          identity: binance_execution_identity
          snapshot: binance_execution_snapshot
          prepare: binance_execution_prepare
          submit: binance_execution_submit
          recover: binance_execution_recover
          command: binance_execution_command
          cancel: binance_execution_cancel
