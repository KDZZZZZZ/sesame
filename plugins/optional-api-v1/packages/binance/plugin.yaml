    configuration:
      title: 币安 Spot / Spot Testnet
      fields:
        - id: environment
          title: 账户环境
          description: testnet 是 Spot 测试网，production 是币安生产现货；未配置默认 testnet。公开行情绑定可独立明确选择环境。
          schema:
            type: string
            enum:
              - production
              - testnet
            writeOnly: false
            default: testnet
          binding:
            type: environment
            name: BINANCE_ENVIRONMENT
        - id: api_key
          title: API Key
          description: 所选环境的 HMAC API key。公开行情不需要；账户读取与交易权限由 Binance 验证。
          schema:
            type: string
            writeOnly: true
            minLength: 1
            maxLength: 512
          binding:
            type: environment
            name: BINANCE_API_KEY
        - id: api_secret
          title: HMAC API Secret
          description: 所选环境的 HMAC secret；只用于原生签名，不写入插件账本或回执。
          schema:
            type: string
            writeOnly: true
            minLength: 1
            maxLength: 512
          binding:
            type: environment
            name: BINANCE_API_SECRET
