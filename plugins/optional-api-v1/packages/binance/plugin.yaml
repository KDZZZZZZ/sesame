          limitations:
            - Spot production and Spot Testnet are distinct identities. Futures, margin and withdrawals are outside this adapter.
        configurationRequirements:
          - field: environment
            optional: true
            reason: Select production or Spot Testnet; default is testnet.
          - field: api_key
            reason: Binance private account or trading operation.
          - field: api_secret
            reason: HMAC signing for the selected Binance account.
        binding:
          type: native
          name: account_listAccounts
      - id: account_snapshot
        kind: function
        consumers:
          - host
        description: Binance Spot 标准账户 snapshot；余额为多资产，不虚构统一净值或交易对仓位。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                account:
                  type: object
                  additionalProperties: true
              required:
                - account
              additionalProperties: false
            page:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                cursor:
                  type: string
                  minLength: 1
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
            - page
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - backend.read
          - network
          - plugin.state.write
        usage:
          purpose: Binance Spot 标准账户 snapshot；余额为多资产，不虚构统一净值或交易对仓位。
          inputs: 通过 data_providers 的 sesame/binance#account 及账户来源入口调用。账户环境来自统一配置，connection/revision 精确校验。
          outputs: 标准账户摘要/快照；快照 native.balances 给出每资产 free/locked，未转换资产的 balance/equity 保持 unknown。
          prerequisites:
            - Configure the selected environment and HMAC API key/secret through configuration_integration_apply.
            - Trading mutations require the authorized main conversation; configuration presence alone does not grant trading permission.
          limitations:
            - Spot production and Spot Testnet are distinct identities. Futures, margin and withdrawals are outside this adapter.
        configurationRequirements:
          - field: environment
            optional: true
            reason: Select production or Spot Testnet; default is testnet.
          - field: api_key
            reason: Binance private account or trading operation.
          - field: api_secret
            reason: HMAC signing for the selected Binance account.
        binding:
          type: native
          name: account_snapshot
      - id: account_queryOrders
        kind: function
        consumers:
          - host
        description: Binance Spot 订单分页观测；历史需明确品种与不超过 24 小时的 UTC 范围。
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              properties: {}
              required: []
              additionalProperties: true
            query:
              type: object
              properties:
                account:
                  type: object
                  properties:
                    accountId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    connectionId:
                      type: string
                      minLength: 1
                      maxLength: 128
                  required:
                    - accountId
                    - connectionId
                  additionalProperties: false
                scope:
                  enum:
                    - working
                    - history
                    - all
                  type: string
                range:
                  type: object
                  properties:
                    from:
                      type: object
                      properties:
                        basis:
                          const: utc
                          type: string
                        unixMs:
                          type: integer
                          minimum: 0
                      required:
                        - basis
                        - unixMs
                      additionalProperties: false
                    to:
                      type: object
                      properties:
                        basis:
                          const: utc
                          type: string
                        unixMs:
                          type: integer
                          minimum: 0
                      required:
                        - basis
                        - unixMs
                      additionalProperties: false
                  required:
                    - from
                    - to
                  additionalProperties: false
                instruments:
                  type: array
                  items:
                    type: object
                    properties:
                      sourceId:
                        type: string
                        minLength: 1
                        maxLength: 128
                      instrumentId:
                        type: string
                        minLength: 1
                        maxLength: 128
                    required:
                      - sourceId
                      - instrumentId
                    additionalProperties: false
                  maxItems: 5
              required:
                - account
                - scope
              additionalProperties: false
            page:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                cursor:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
            - page
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            items:
              type: array
            nextCursor:
              type: string
              minLength: 1
              maxLength: 128
            metadata:
              type: object
              properties: {}
              required: []
              additionalProperties: true
          required:
            - items
            - metadata
          additionalProperties: false
        execution: immediate
        effects:
          - backend.read
          - network
        usage:
          purpose: Binance Spot 订单分页观测；历史需明确品种与不超过 24 小时的 UTC 范围。
          inputs: '{binding,query:{account,instruments:[{sourceId,instrumentId}],range:{from:{basis:"utc",unixMs},to:{basis:"utc",unixMs}},scope?},page:{limit:100,cursor?}}；仅 working orders 可省略范围和品种。'
          outputs: "{items,nextCursor?,metadata:{coverage?,truncated?,meta,connection}}。单品种历史接口到 1000 条时标记截断，可缩小范围；分页结束不抹掉原生截断。"
          prerequisites:
