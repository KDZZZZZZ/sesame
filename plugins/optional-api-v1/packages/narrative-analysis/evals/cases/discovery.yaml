id: narrative-analysis-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/narrative-analysis/skills/narrative-analysis/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/narrative-analysis
  - step: 1
    pointer: /tools
    equals: []
  - step: 2
    pointer: /contents/0/text
    contains: "# 市场叙事研究"
