name: investment_research_report
title: investment_research_report
description: Regenerate only the synthesis presentation from one complete fixed investment-research result. Starts the original plan's designated synthesis member (manager by default), preserves the original research result, and uses Sesame reports visuals and actual rendering checks. Does not restart analysts or acquire new information.
inputSchema:
  type: object
  properties:
    result_ref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          const: data
        schemaVersion:
          const: 1.0.0
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
      description: Exact complete result_ref produced by investment_research_analyze (one sesame.investment-research.result data row).
    model:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        configurationDigest:
          type: string
          minLength: 1
      required:
        - provider
        - id
      additionalProperties: false
  required:
    - result_ref
    - model
  additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: workflow
  consumers:
    - agent
    - host
  execution: run
  resumable: true
  effects:
    - start:agents
    - publish:report
  usage:
    purpose: "Improve or regenerate the synthesis report from retained research, without another research cycle. The designated synthesis member may reweigh the same evidence rather than inherit the old conclusion: state an overall thesis, use conclusion-led subheadings and explain how evidence supports, qualifies or challenges it. Separate inclination from confidence; abstaining from judgment also requires reasoning. Preserve the original packet and evidence dates."
    inputs: "{result_ref:<full fixed data ArtifactRef>,model:{provider,id}}. Invoke with task.output:{type:'report',space:'research',path:'...html'} (or the host parent report target when nested), and a stable operationId. The original packet must contain complete member Markdown, RunRefs, summary and source_refs; a plain Markdown file is not this contract."
    outputs: Accepted native Run. Final {result_ref,summary,report_ref} retains the original result_ref and returns the designated synthesis member's exact published, actually rendered report revision. Only one child synthesis member is created; no multi-Agent collaboration graph is declared. Acceptance alone is not report delivery.
    prerequisites:
      - Original result_ref and its fixed source_refs remain readable.
      - Configured model; available sesame/reports, sesame/data-access, sesame/workspace and sesame/plugin-manager. Original source/method plugins and a trading account are not required.
    limitations:
      - The synthesis member has report/data/file-editing/knowledge-reading tools only, no source querying or trading capability.
      - The published report must have a successful report_check receipt for its exact revision; a chat answer or unchecked HTML is not accepted as the report.
      - Uses the same host checkpoint/interrupt/resume contract. Existing completed synthesis and report artifacts are retained; no repeated paid Agent after a checkpoint or render dependency interruption.
  binding:
    type: native
    name: investment_research_report
  finalOutputSchema:
    type: object
    properties:
      result_ref:
        type: object
        properties:
          id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            const: data
          schemaVersion:
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
      summary:
        type: string
      report_ref:
        type: object
        properties:
          id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            const: report
          schemaVersion:
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
    required:
      - result_ref
      - summary
    additionalProperties: false
