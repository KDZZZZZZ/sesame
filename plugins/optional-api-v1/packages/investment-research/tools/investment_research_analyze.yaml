name: investment_research_analyze
title: investment_research_analyze
description: Research one investment question with selected sources and methods. All participating members share standards for a scoped main judgment, testable mechanisms, relevant theory and comparisons, competing explanations and evidence limits; methods and inquiry order follow the question. Targeted follow-up answers and fixed evidence remain in the result. No account or trading dependency. Authorized downstream members can query the completed predecessors listed in their QA context; the default bull/bear/risk/manager query the original analysts. start_from reruns a suffix from a completed fixed result without changing the original.
inputSchema:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 120
    question:
      type: string
      minLength: 1
      maxLength: 16000
    subjects:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 200
      minItems: 1
      uniqueItems: true
    as_of:
      type: string
      minLength: 1
      description: Evidence publication/observation cutoff, preferably UTC ISO; omitted uses workflow creation time. Current research may collect after starting and must record actual retrieval time separately. Historical backtests or point-in-time claims require the historical data version, not later revisions.
    horizon:
      type: string
      minLength: 1
      maxLength: 2000
      description: Relevant investment horizon; not a trading schedule.
    research:
      type: object
      properties:
        plugins:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        tools:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
          description: Exact declared capability IDs (pluginId#capabilityId preferred). Omitted selects delegatable research functions with no declared trading/configuration/process/workflow-control effects; [] loads knowledge only.
      required:
        - plugins
      additionalProperties: false
    model:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        configurationDigest:
          type: string
          minLength: 1
      required:
        - provider
        - id
      additionalProperties: false
    agent_models:
      type: object
      additionalProperties:
        type: object
        properties:
          provider:
            type: string
            minLength: 1
          id:
            type: string
            minLength: 1
          configurationDigest:
            type: string
            minLength: 1
        required:
          - provider
          - id
        additionalProperties: false
      maxProperties: 32
    evidence_refs:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            const: data
          schemaVersion:
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
      description: Existing fixed evidence to reuse. Account snapshots are optional evidence, never an execution binding.
    start_from:
      type: object
      description: Rerun a completed research suffix. Inherits title/question/subjects/as_of/horizon/input evidence from result_ref, so do not repeat them. Retains only members and QA before role; uses the supplied research/model for new work. Original result and report remain unchanged.
      properties:
        result_ref:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            revision:
              type: string
              minLength: 1
            digest:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
            kind:
              const: data
            schemaVersion:
              const: 1.0.0
          required:
            - id
            - revision
            - digest
            - kind
            - schemaVersion
          additionalProperties: false
          description: Exact complete result_ref produced by investment_research_analyze (one sesame.investment-research.result data row).
        role:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,63}$
          description: First downstream member id to rerun; custom plans inherit the original workflow when workflow is omitted. Changed upstream members require a fresh run.
      required:
        - result_ref
        - role
      additionalProperties: false
    workflow:
      type: object
      properties:
        stages:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: array
            minItems: 1
            maxItems: 32
            items:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,63}$
                role:
                  enum:
                    - market
                    - fundamentals
                    - news
                    - sentiment
                    - bull
                    - bear
                    - risk
                    - manager
                    - custom
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                instructions:
                  type: string
                  maxLength: 6000
              required:
                - id
              additionalProperties: false
        synthesis:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,63}$
      required:
        - stages
        - synthesis
      additionalProperties: false
      description: Optional executable task plan. Every member id occurs once; stages run in order and members within a stage run in parallel. The final stage contains only synthesis. Custom roles require instructions. Omit for the existing eight-member workflow; no duplicate task.collaboration is needed. Source permissions and immutable evidence rules remain enforced.
  required:
    - research
    - model
  additionalProperties: false
  anyOf:
    - required:
        - title
        - question
        - subjects
    - required:
        - start_from
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: workflow
  consumers:
    - agent
    - host
  execution: run
  resumable: true
  effects:
    - start:agents
    - resources.create
    - resources.publish
    - invoke:selected-research
    - publish:report-if-requested
  usage:
    purpose: Combine source facts and complementary methods to answer a research question without entering a trading plan.
    inputs: Use title, question, subjects, research:{plugins,tools?}, model:{provider,id}, optional as_of/horizon/evidence_refs/agent_models. Models come from the host model catalog. Invoke with a stable host operationId. Research stages and data-heavy or complex analysis require task.output:{type:'report',space:'research',path:'...html'} and actual delivery at the bound destination, even without a separate report request. An explicit report request or path always requires that delivery. Omitted output or none produces reusable data only and cannot satisfy a research-stage report deliverable; internal data and chat summaries do not replace the report. The capability declares its collaboration; do not copy it into separate Agent roots. To rerun from an existing completed result, pass {start_from:{result_ref,role},research,model,agent_models?}; role names a member of the original custom plan, or bull/bear/risk/manager in the default plan. Original research metadata and earlier member/QA results are inherited, so omit title/question/subjects/as_of/horizon/evidence_refs. New report output uses a new path. Optional workflow:{stages:[[{id:"facts",role:"fundamentals"}],[{id:"editor",role:"manager"}]],synthesis:"editor"} selects actual members and order. agent_models keys may name these member ids. The host derives collaboration from this plan; do not duplicate it in task options.
    outputs: Accepted native workflow Run. Its final output is {result_ref,summary,report_ref?}. result_ref is one fixed json-rows data artifact containing schemaVersion/type/status/title/question/subjects/as_of/horizon?, complete members[{role,markdown,run_ref,source_refs}], qa[{from,to,question,markdown,run_ref,qa_run_ref,source_refs}], the designated synthesis summary, source_refs and optional report_ref. This data artifact is not a report file. Requested reports require the actual published revision and rendered receipt; report a failed or missing delivery instead of claiming completion. Use host Run read/wait/interrupt/resume/cancel; no second business-run API. Suffix reruns include start_from and retained member RunRefs; evidence_refs records the original input evidence separately.
    prerequisites:
      - Selected models and research plugins must be configured and available. Source-specific credentials/readiness remain declared by the selected source capabilities.
      - Report output additionally requires sesame/reports, sesame/data-access, sesame/workspace and sesame/plugin-manager. Without a report these report dependencies are not required.
    limitations:
      - No broker/account binding, target portfolio, order, strategy change or schedule is created.
      - Necessary missing evidence interrupts the same Run and retains accepted child identities and checkpoints; only unresolved members continue after resume.
      - Only the designated synthesis member (manager by default) publishes a requested report using existing evidence and the reports design rules. A completed data result is reusable independently of its HTML but does not prove report delivery.
      - Authorized downstream members may ask completed predecessors listed in qa_context.members targeted questions when answers can change the interpretation. Use their exact member IDs; do not assume the default roles participated. Follow-up work reuses the original member identity, selected model and frozen source permissions; no fixed count or forced consensus. Answers reach later members and the final result.
      - When a missing fact materially limits the judgment, use an existing verification outcome or a concrete capability/coverage limit to explain the boundary. If applicable analyst capabilities remain and no check was attempted, ask a targeted question; an inherited unknown is not proof of unavailability. Do not repeat failed acquisition without a new path or pursue nonessential completeness.
