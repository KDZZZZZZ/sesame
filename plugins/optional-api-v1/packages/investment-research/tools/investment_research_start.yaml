name: investment_research_start
title: investment_research_start
description: 投资研究报告工作流：按用户问题发现 Research 方法，明确问题、取得证据、分析并交付统一视觉报告；支持自定义实际成员与顺序。
inputSchema:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 120
    question:
      type: string
      minLength: 1
      maxLength: 16000
    subjects:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 200
      minItems: 1
      uniqueItems: true
    as_of:
      type: string
      minLength: 1
      description: Evidence publication/observation cutoff, preferably UTC ISO; omitted uses workflow creation time. Current research may collect after starting and must record actual retrieval time separately. Historical backtests or point-in-time claims require the historical data version, not later revisions.
    horizon:
      type: string
      minLength: 1
      maxLength: 2000
      description: Relevant investment horizon; not a trading schedule.
    research:
      type: object
      properties:
        plugins:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        tools:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
          description: Exact declared capability IDs (pluginId#capabilityId preferred). Omitted selects delegatable research functions with no declared trading/configuration/process/workflow-control effects; [] loads knowledge only.
      required:
        - plugins
      additionalProperties: false
    model:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        configurationDigest:
          type: string
          minLength: 1
      required:
        - provider
        - id
      additionalProperties: false
    agent_models:
      type: object
      additionalProperties:
        type: object
        properties:
          provider:
            type: string
            minLength: 1
          id:
            type: string
            minLength: 1
          configurationDigest:
            type: string
            minLength: 1
        required:
          - provider
          - id
        additionalProperties: false
      maxProperties: 32
    evidence_refs:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            const: data
          schemaVersion:
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
      description: Existing fixed evidence to reuse. Account snapshots are optional evidence, never an execution binding.
    workflow:
      type: object
      properties:
        stages:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: array
            minItems: 1
            maxItems: 32
            items:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,63}$
                role:
                  enum:
                    - market
                    - fundamentals
                    - news
                    - sentiment
                    - bull
                    - bear
                    - risk
                    - manager
                    - custom
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                instructions:
                  type: string
                  maxLength: 6000
              required:
                - id
              additionalProperties: false
        synthesis:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,63}$
      required:
        - stages
        - synthesis
      additionalProperties: false
      description: 用户自定义成员与顺序；省略则依次执行需求范围、取证、分析、报告。最后阶段为唯一synthesis。
    report_brief:
      type: object
      properties:
        objective:
          type: string
          minLength: 1
          maxLength: 12000
          description: 本次研究要帮助用户解决什么问题；省略时沿用 question。
        questions:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 6000
          description: 实际待回答的问题，不是必填报告栏目。
        method_ids:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: 可选 research_methods 返回的方法 ID；由 research_read 按需读取，不限定报告视觉。
        evidence_requirements:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 6000
          description: 用户的证据要求或需要填补的关键缺口。
        delivery:
          type: string
          minLength: 1
          maxLength: 12000
          description: 读者需要的交付内容与明确删改要求；不强制固定章节。
      additionalProperties: false
      description: 可选任务 brief；目标、问题、方法、证据和交付按需填写，无报告模板依赖。
  required:
    - title
    - question
    - subjects
    - research
    - model
  additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: workflow
  consumers:
    - agent
    - host
  execution: run
  resumable: true
  effects:
    - start:agents
    - resources.create
    - resources.publish
    - invoke:selected-research
    - publish:report-if-requested
  usage:
    purpose: 执行投资研究与报告交付；Research 提供调查和回答方法，Reports 只负责通用组件与统一视觉。
    inputs: '{title,question,subjects,research:{plugins,tools?},model,as_of?,horizon?,evidence_refs?,report_brief?:{objective?,questions?,method_ids?,evidence_requirements?,delivery?},workflow?,agent_models?}。绑定 task.output:{type:"report",space:"research",path:"...html"}。Research 方法由 research_methods 发现、research_read 按需读取；来源与计算能力由 research 显式选择。更新资料用新 start 引用既有成果；只改报告用 investment_research_report。'
    outputs: 原生Run。result_ref保留冻结report_brief、实际成员计划及证据；report_ref为实际发布且已渲染的报告。默认四阶段有不同权限，自定义workflow优先。
    prerequisites:
      - 已配置模型和明确选定的来源/计算插件可用；sesame/research 提供只读方法目录与正文。
      - 报告交付使用 sesame/reports 的 components_show 与 report_check；不需要旧模板或组合工具。
    limitations:
      - scope 读取方法与已有材料；取证和分析使用调用方选定的研究安全能力；synthesis 只综合固定证据和定向问答。
      - 方法预设按用户问题适配，不是必填栏目；事实、比较或复盘不强制预测，预测需要真实支持，不能虚构概率。
      - 不下单、不配置凭据；搜索失败不是无事件。用户明确来源、方法及交付要求优先。
      - analyze 用于显式成员计划与内部数据交接；新报告任务优先 start。
  binding:
    type: native
    name: investment_research_start
  finalOutputSchema:
    type: object
    properties:
      result_ref:
        type: object
        properties:
          id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            const: data
          schemaVersion:
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
      summary:
        type: string
      report_ref:
        type: object
        properties:
          id:
            type: string
            minLength: 1
          revision:
            type: string
            minLength: 1
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            const: report
          schemaVersion:
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
    required:
      - result_ref
      - summary
    additionalProperties: false
