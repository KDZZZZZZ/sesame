formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/abu-parameter-search
title: 参数实验基线
description: 有限网格、开发期排名与固定样本外选择记录。这是可改进基线而非标准答案；输入显式来源和截止时点，输出可复核研究结果。 自动冻结输入与结果数据工件，用户可复核。
version: 2.0.5
license: GPL-3.0-only
engines:
  sesame: ">=0.2.3"
author:
  name: Sesame contributors; ABU reference by bbfamily / 阿布
entry: index.js
x-sesame:
  catalog:
    category: "research"
    functionalCategory: "analysis"
    implementationKinds: ["function"]
    title:
      en: "Parameter experiment evidence"
      zh: "参数试验证据"
    summary:
      en: "Enumerate a bounded input-only grid, rank supplied development metrics, freeze selections and check selected-only holdout evidence; does not execute trials or a native optimizer."
      zh: "在输入内枚举有界网格，排名已提供开发指标、冻结选择并校验所选留出证据；不执行试验或原生优化器。"
    dependencies:
      en: "Node.js and explicit fixed, time-labelled inputs. Research output is not a native backtest or executable order."
      zh: "需要 Node.js 与明确来源、截止时点的固定输入。研究结果不等同于原生回测或可执行订单。"
  default_state: discoverable
  agent_scope: all
  prompts:
    - instructions.md
  skills:
    - skills
  resources:
    - LICENSE
    - PROVENANCE.md
    - README.md
    - examples/input.json
    - examples/development.json
    - scripts/baseline.mjs
    - scripts/runtime.mjs
    - references/method.md
  provides: {}
  contributions:
    capabilities:
      - tool/abu_parameter_search_analyze
    sources: []
    views: []
    services: []
    knowledge:
      - id: knowledge-0
        path: examples/input.json
        description: 参数实验基线 — examples/input.json
        kind: reference
      - id: knowledge-1
        path: instructions.md
        description: abu_parameter_search_analyze 的局部目标、解释边界和跨方法交接。
        kind: prompt
      - id: knowledge-2
        path: PROVENANCE.md
        description: 参数实验基线 — PROVENANCE.md
        kind: reference
      - id: knowledge-3
        path: README.md
        description: 参数实验基线 — README.md
        kind: reference
      - id: knowledge-4
        path: references/method.md
        description: abu_parameter_search_analyze 的公式、参数口径与基线差异；核对是否可以复用其他已计算结果。
        kind: reference
      - id: knowledge-5
        path: skills/abu-parameter-search/SKILL.md
        description: 数值方法：对已完成实验的有限网格指标排序，冻结开发期选型，再核对该固定选型的留出期证据；不运行策略。 输入为已固定证据；输出为 observations 与输入/结果工件，供方法解释或工作流复用。
        kind: skill
    hooks: []
    stateCollections: []
    artifactSchemas:
      - id: data
        kind: data
        schemaVersion: 1.0.0
        schema:
          type: object
          properties:
            format:
              const: json-rows
            path:
              type: string
              minLength: 1
            rowCount:
              type: integer
              minimum: 0
            columns:
              type: array
            provenance:
              type: object
              additionalProperties: true
          required:
            - format
            - path
            - rowCount
            - columns
            - provenance
          additionalProperties: true
    configSchema:
      type: object
      properties: {}
      additionalProperties: false
