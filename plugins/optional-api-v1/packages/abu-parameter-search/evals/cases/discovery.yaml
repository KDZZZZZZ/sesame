id: abu-parameter-search-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/abu-parameter-search/skills/abu-parameter-search/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/abu-parameter-search
  - step: 1
    pointer: /tools/0/name
    equals: abu_parameter_search_analyze
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        input:
          type: object
          properties:
            schema_version:
              const: 1
            as_of:
              type: string
              description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
            source:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 500
                kind:
                  enum:
                    - synthetic
                    - historical
                    - live
              required:
                - id
                - kind
              additionalProperties: true
              description: Caller-declared provenance; synthetic remains synthetic in output artifacts.
            parameters:
              type: object
              properties:
                phase:
                  type: string
                  default: development
                  enum:
                    - development
                    - holdout
                  description: 开发排序或固定留出验证
                objective_metric:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: 要排序的 metrics 字段，默认 input.objective.metric 或 score
                direction:
                  type: string
                  default: maximize
                  enum:
                    - maximize
                    - minimize
                  description: 目标优化方向；input.objective.direction 可提供默认值
                max_grid_points:
                  type: integer
                  default: 5000
                  minimum: 1
                  maximum: 100000
                  description: 允许的网格组合数上限
              additionalProperties: false
              description: Optional overrides. Defaults and limits match the existing calculation.
            grid:
              type: object
              minProperties: 1
              maxProperties: 10
              additionalProperties:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  anyOf:
                    - type: number
                    - type: string
                    - type: boolean
              description: Arbitrary parameter names and scalar candidates; not restricted to lookback/threshold.
            frozen_selection:
              type: object
              properties:
                selected_at:
                  type: string
                  description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                parameters:
                  type: object
                  additionalProperties:
                    anyOf:
                      - type: number
                      - type: string
                      - type: boolean
                  description: Exact grid parameter names and values for one evaluated point.
                development_sha256:
                  type: string
                grid_sha256:
                  type: string
                objective_sha256:
                  type: string
                parameter_hash:
                  type: string
                selection_sha256:
                  type: string
              additionalProperties: true
              description: Required only for holdout. Pass the exact prior observations.frozen_selection, including all hashes; never manufacture or recompute a selection to fit holdout.
            trials:
              type: array
              items:
                type: object
                properties:
                  split:
                    enum:
                      - development
                      - holdout
                  available_at:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  parameters:
                    type: object
                    additionalProperties:
                      anyOf:
                        - type: number
                        - type: string
                        - type: boolean
                    description: Exact grid parameter names and values for one evaluated point.
                  metrics:
                    type: object
                    additionalProperties: {}
                    description: Contains a finite numeric value at objective_metric. Other evidence fields are preserved.
                additionalProperties: true
                required:
                  - split
                  - available_at
                  - parameters
              maxItems: 10000
              minItems: 1
          additionalProperties: true
          required:
            - schema_version
            - source
            - as_of
            - grid
            - trials
          description: 完整的固定输入对象；examples/input.json 仅为合成格式示例，不是实盘证据。
      required:
        - input
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# 参数实验基线"
