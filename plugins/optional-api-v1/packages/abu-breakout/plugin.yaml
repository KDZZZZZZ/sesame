formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/abu-breakout
title: 突破信号基线
description: 历史窗口高低点突破观察及次时段可执行约束。这是可改进基线而非标准答案；输入显式来源和截止时点，输出可复核研究结果。 自动冻结输入与结果数据工件，用户可复核。
version: 2.0.1
license: GPL-3.0-only
engines:
  sesame: ">=0.2.3"
author:
  name: Sesame contributors; ABU reference by bbfamily / 阿布
entry: index.js
x-sesame:
  default_state: discoverable
  agent_scope: all
  prompts:
    - instructions.md
  skills:
    - skills
  resources:
    - LICENSE
    - PROVENANCE.md
    - README.md
    - examples/input.json
    - scripts/baseline.mjs
    - scripts/runtime.mjs
    - references/method.md
  provides: {}
  contributions:
    capabilities:
      - tool/abu_breakout_analyze
    sources: []
    views: []
    services: []
    knowledge:
      - id: knowledge-0
        path: examples/input.json
        description: 突破信号基线 — examples/input.json
        kind: reference
      - id: knowledge-1
        path: instructions.md
        description: abu_breakout_analyze 的局部目标、解释边界和跨方法交接。
        kind: prompt
      - id: knowledge-2
        path: PROVENANCE.md
        description: 突破信号基线 — PROVENANCE.md
        kind: reference
      - id: knowledge-3
        path: README.md
        description: 突破信号基线 — README.md
        kind: reference
      - id: knowledge-4
        path: references/method.md
        description: abu_breakout_analyze 的公式、参数口径与基线差异；核对是否可以复用其他已计算结果。
        kind: reference
      - id: knowledge-5
        path: skills/abu-breakout/SKILL.md
        description: 数值方法：用当前收盘价与此前 lookback 根 K 线的高低点比较，计算向上/向下突破研究信号。 输入为已固定证据；输出为 observations 与输入/结果工件，供方法解释或工作流复用。
        kind: skill
    hooks: []
    stateCollections: []
    artifactSchemas:
      - id: data
        kind: data
        schemaVersion: 1.0.0
        schema:
          type: object
          properties:
            format:
              const: json-rows
            path:
              type: string
              minLength: 1
            rowCount:
              type: integer
              minimum: 0
            columns:
              type: array
            provenance:
              type: object
              additionalProperties: true
          required:
            - format
            - path
            - rowCount
            - columns
            - provenance
          additionalProperties: true
    configSchema:
      type: object
      properties: {}
      additionalProperties: false
