name: vnpy_backtest
title: vnpy_backtest
description: Run actual VeighNa CTA BacktestingEngine on a fixed DataRef and one authored CtaTemplate Python file. Executes managed current-user host Python; preserves code, environment, parameters, matching assumptions and results. This is a bar backtest, not a live broker or SVL equivalence check.
inputSchema:
  type: object
  required:
    - operation_id
    - title
    - data
    - strategy_path
    - class_name
    - config
  properties:
    operation_id:
      type: string
      description: Idempotency key for this exact backtest
      minLength: 1
      maxLength: 20000
    title:
      type: string
      description: Result title
      minLength: 1
      maxLength: 20000
    data:
      type: object
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      properties:
        id:
          type: string
        revision:
          type: string
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          type: string
          const: data
        schemaVersion:
          type: string
          const: 1.0.0
      additionalProperties: false
    strategy_path:
      type: string
      description: Workspace Python source file
      minLength: 1
      maxLength: 20000
    class_name:
      type: string
      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
    config:
      type: object
      required:
        - vt_symbol
        - interval
        - rate
        - slippage
        - size
        - pricetick
        - capital
      properties:
        vt_symbol:
          type: string
          description: symbol.Exchange, using a VeighNa Exchange enum
          minLength: 1
          maxLength: 20000
        interval:
          anyOf:
            - type: string
              const: 1m
            - type: string
              const: 1h
            - type: string
              const: d
            - type: string
              const: w
        rate:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        slippage:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        size:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        pricetick:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        capital:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
        start:
          type: string
        end:
          type: string
      additionalProperties: false
    columns:
      type: object
      properties:
        datetime:
          type: string
          minLength: 1
        open:
          type: string
          minLength: 1
        high:
          type: string
          minLength: 1
        low:
          type: string
          minLength: 1
        close:
          type: string
          minLength: 1
        volume:
          type: string
          minLength: 1
      additionalProperties: false
    wall_time_authority:
      type: string
      description: Required for offset-free timestamps; preserves their original authority without guessing UTC
      minLength: 1
      maxLength: 20000
    parameters:
      type: object
      patternProperties:
        ^.*$: {}
    timeout:
      type: integer
      minimum: 1
      maximum: 600
  additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: run
  effects:
    - process
    - private-filesystem
    - resources.publish
    - plugin.state.write
  usage:
    purpose: 消费已有固定数据、策略和参数执行一次原生计算，交付结果ref、输入血缘、统计和诊断；候选选择、比较与综合由工作流负责。
    inputs: '{operation_id,title,data,strategy_path,class_name,config,parameters?,columns?,timeout?}。data 为 data_snapshot 等公开数据工具返回的固定 {id,revision,digest,kind:"data",schemaVersion:"1.0.0"}，内容为 json-rows；禁止猜引用/用可变datasetId代替。 strategy_path 是工作区真实单文件（≤512KiB），class_name 为已编写的CtaTemplate类名；输入2–100000行、≤16MiB，列默认datetime/open/high/low/close/volume，columns可改名，未知量不填0。config最小例 {vt_symbol:"TEST.LOCAL",interval:"d",rate:"0.001",slippage:"0",size:"1",pricetick:"0.01",capital:"100000"}；interval=1m|1h|d|w，start/end可限定；无时区时间必须给原始wall_time_authority。'
    outputs: '{ref:<固定strategy.result>,status:"completed"|"failed",data:[{id:"daily"|"trades"|"orders",ref,rowCount}],statistics,diagnostics,executionRunId,nativeSource,environment,rawResult,execution:"host"}；failed没有成功表；中断保留unknown/运行操作记录，不自动重放。'
    prerequisites:
      - vnpy_environment ready:true 且 configured:true；固定数据和工作区代码来自本任务。公开 skill 给出原生接口/单位，无须阅读安装源码。
    limitations:
      - 执行当前用户权限的真实Python，宿主可取消但不是OS沙箱；引擎本身只使用固定数据，不连接实盘broker。
      - operation_id绑定代码、数据、参数和撮合配置；相同输入重试读原结果，改变输入须新研究意图。失败读diagnostics；未知不声称完成。
      - demo来源保持demo；completed只表示引擎完成，不证明盈利、SVL等价或实盘有效。原生浮点不具decimal34等价。
  binding:
    type: native
    name: vnpy_backtest
  finalOutputSchema:
    type: object
    additionalProperties: true
