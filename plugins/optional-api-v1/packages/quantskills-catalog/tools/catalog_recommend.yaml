name: catalog_recommend
title: catalog_recommend
description: Recommend Research, Strategy, independently selected methods/backends, and existing-result diagnostics; distinguish native execution from input-only evidence. Does not install plugins or verify availability.
inputSchema:
  type: object
  properties:
    need:
      type: string
      enum:
        - market-data
        - market-explanation
        - technical-analysis
        - investment-research
        - strategy
        - native-backtest
        - report
        - judgment-review
        - historical-evidence
        - trade-results
        - parameter-evidence
        - series-similarity
    method:
      type: string
      enum:
        - ict
        - price-action
        - elliott-wave
        - wyckoff
        - dow-theory
        - behavioral-finance
        - institutional-analysis
        - narrative-analysis
      description: Optional explicit method for technical-analysis or market-explanation. Without it return choices only; do not automatically load all methods.
  required:
    - need
  additionalProperties: false
outputSchema:
  type: object
  additionalProperties: true
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
  invalid_input:
    message: Invalid catalog arguments.
    recovery: Correct the indicated arguments and retry.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects: []
  binding:
    type: mcp
    server: analysis
    name: catalog_recommend
  usage:
    purpose: Recommend Research for investment questions and Strategy for factor/strategy experiments; preserve specific method and backend choices. Recommendations do not install plugins or check availability.
    inputs: Use need:investment-research for Research; need:strategy for factor and strategy experiments. Method selection remains limited to technical-analysis or market-explanation. Use need:historical-evidence for independent historical matching and probability calibration.
    outputs: The selected route, primary plugin IDs, optional methods/backends and fixed upstream references; availability remains not_checked. Investment questions use need:investment-research; factor and strategy experiments use need:strategy.
    prerequisites:
      - Python 3 available to the host MCP transport.
    limitations:
      - Results describe supplied content or the bundled snapshot, not live network observations.
    examples:
      - input:
          need: native-backtest
        output:
          need: native-backtest
          method: null
          workflow:
            purpose: 在选定的成熟引擎上运行固定策略与数据，保存真实结果。
            primary_plugins: []
            shared_plugins:
              - sesame/data-access
              - sesame/reports
            backend_choices:
              - sesame/mt5
              - sesame/vnpy
              - sesame/backtrader
            selection: MQL5 用 MT5 Tester、兼容 CTA Python 用 vn.py、Backtrader Strategy 用 Cerebro。撮合假设不可互换；对比结果须统一日期、成本、复权、数量与期末仓位处理。
            reference_names:
              - skill-backtest
              - skill-factor-backtest
              - skill-backtest-assumption-check
          selection_required: false
          references:
            - name: skill-backtest
              repo_url: https://github.com/quantskills/skill-backtest
              category: 05 策略回测与交易工具
              subcategory: 回测引擎（2）
              stage: backtesting
              asset_type: skill
              verification_level: pending_review
            - name: skill-factor-backtest
              repo_url: https://github.com/quantskills/skill-factor-backtest
              category: 05 策略回测与交易工具
              subcategory: 回测引擎（2）
              stage: backtesting
              asset_type: skill
              verification_level: pending_review
            - name: skill-backtest-assumption-check
              repo_url: https://github.com/quantskills/skill-backtest-assumption-check
              category: 07 研究验证与质量工具
              subcategory: 工作流审计（2）
              stage: reporting
              asset_type: skill
              verification_level: pending_review
          availability: not_checked
          next_steps:
            - Use the declared plugin catalog capability to inspect exact published IDs and versions.
            - Choose capabilities that meet the task objective; installation includes prerequisite checks.
            - Read the selected SKILL and retain its sources; directory references are not imported implementations or proof of trading performance.
          snapshot_date: 2026-10-03T14:34:06.311Z
          version: 4.2.0
