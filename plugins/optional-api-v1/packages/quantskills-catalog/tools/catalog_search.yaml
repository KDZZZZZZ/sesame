name: catalog_search
title: catalog_search
description: Search QuantSkills catalog by keyword in name or description
inputSchema:
  type: object
  properties:
    query:
      type: string
      description: Keyword to search
      maxLength: 2000
      minLength: 1
    limit:
      type: integer
      default: 20
      maximum: 100
      minimum: 1
  required:
    - query
  additionalProperties: false
outputSchema:
  type: object
  properties:
    results:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          repo_url:
            type: string
          category:
            type: string
          subcategory:
            type: string
          stage:
            type: string
          asset_type:
            type: string
          verification_level:
            type: string
        additionalProperties: true
    count:
      type: number
    query:
      type: string
    version:
      type: string
  additionalProperties: true
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
  invalid_input:
    message: Invalid catalog arguments.
    recovery: Correct the indicated arguments and retry.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects: []
  binding:
    type: mcp
    server: analysis
    name: catalog_search
  usage:
    purpose: Search QuantSkills catalog by keyword in name or description
    inputs: Use the catalog query fields; omitted optional filters mean no restriction.
    outputs: Structured JSON fields follow outputSchema; original source and version are preserved.
    prerequisites:
      - Python 3 available to the host MCP transport.
    limitations:
      - Results describe supplied content or the bundled snapshot, not live network observations.
    examples:
      - input:
          query: alpha191
          limit: 10
        output:
          results:
            - name: skill-factor-alpha191-alpha101
              repo_url: https://github.com/quantskills/skill-factor-alpha191-alpha101
              category: 02 因子研发工具箱
              subcategory: 因子生成（26）
              stage: factor-generation
              asset_type: skill
              verification_level: pending_review
          count: 1
          query: alpha191
          version: 4.2.0
