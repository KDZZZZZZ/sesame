id: quantskills-catalog-discovery
environment:
  mode: replay
  fixtures: quantskills-catalog-recorded-call.json
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/quantskills-catalog/skills/quantskills-catalog/SKILL.md
  - operation: tools/call
    params:
      name: catalog_list_categories
      arguments: {}
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/quantskills-catalog
  - step: 1
    pointer: /tools/0/name
    equals: catalog_filter
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        category:
          type: string
          description: Category name (e.g. '02 因子研发工具箱')
          maxLength: 2000
        stage:
          type: string
          description: Workflow stage (e.g. 'data-ingestion')
          maxLength: 2000
        asset_type:
          type: string
          description: "Asset type: skill, agent, template, infrastructure"
          maxLength: 2000
        verification_level:
          type: string
          description: "Verification level: published_endpoint, pending_review, unknown"
          maxLength: 2000
        limit:
          type: integer
          default: 50
          maximum: 1000
          minimum: 1
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# quantskills-catalog"
  - step: 3
    pointer: /structuredContent
    equals:
      categories:
        - id: "01"
          name: 01 数据接口与数据仓库
          count: 7
        - id: "02"
          name: 02 因子研发工具箱
          count: 44
        - id: "03"
          name: 03 市场与标的分析
          count: 44
        - id: "04"
          name: 04 风险监控与预警
          count: 22
        - id: "05"
          name: 05 策略回测与交易工具
          count: 25
        - id: "06"
          name: 06 投研模型与研究复现
          count: 30
        - id: "07"
          name: 07 研究验证与质量工具
          count: 12
        - id: "08"
          name: 08 资讯搜索与知识分析
          count: 10
        - id: "09"
          name: 09 量化智能体与自动化
          count: 14
        - id: "10"
          name: 10 基础设施与模板
          count: 6
      total_items: 214
      version: 4.2.1
