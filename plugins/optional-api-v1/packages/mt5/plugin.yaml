      - tool/mt5_trading_context
      - tool/mt5_trading_pause
      - tool/mt5_trading_order
      - tool/mt5_trading_command
      - id: activate
        kind: function
        consumers:
          - host
        description: "MT5 lifecycle activate: preserve credentials, native state and cleanup evidence."
        inputSchema:
          type: object
          properties:
            config:
              type: object
              properties:
                disabled:
                  type: boolean
                autoConnect:
                  type: boolean
                directory:
                  type: string
              additionalProperties: false
          required:
            - config
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.state.write
          - native-observation
        usage:
          purpose: 执行MT5 activate 生命周期职责。
          inputs: "{config:{disabled?,autoConnect?,directory?}}；例{config:{autoConnect:false}}。"
          outputs: "{ready:true}；初始化私有存储、providers、观察器，默认可启动连接监视。"
          prerequisites:
            - 仅宿主生命周期调用；Agent无需按步骤调用这些钩子。
          limitations:
            - disabled/autoConnect:false可用于隔离；激活不证明券商可用。
        binding:
          type: native
          name: activate
      - id: dispose
        kind: function
        consumers:
          - host
        description: "MT5 lifecycle dispose: preserve credentials, native state and cleanup evidence."
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.close
        usage:
          purpose: 执行MT5 dispose 生命周期职责。
          inputs: "{}。"
          outputs: "{closed:true}；关闭监视器、数据provider、自有进程与存储。"
          prerequisites:
            - 仅宿主生命周期调用；Agent无需按步骤调用这些钩子。
          limitations:
            - 不是平仓操作。
        binding:
          type: native
          name: dispose
      - id: beforeAgentTurn
        kind: function
        consumers:
          - host
        description: "MT5 lifecycle beforeAgentTurn: preserve credentials, native state and cleanup evidence."
        inputSchema:
          type: object
          properties:
            messageId:
              type: string
            conversation:
              type: object
              additionalProperties: true
            parts:
              type: array
              items:
                type: object
                additionalProperties: true
            source: {}
            metadata:
              type: object
              additionalProperties: true
          required:
            - messageId
            - conversation
            - parts
          additionalProperties: true
        outputSchema:
          type: object
          properties:
            parts:
              type: array
              items:
                type: object
                additionalProperties: true
          required:
            - parts
          additionalProperties: false
        execution: immediate
        effects:
          - plugin.state.write
        usage:
          purpose: 执行MT5 beforeAgentTurn 生命周期职责。
          inputs: "{messageId,conversation,parts,source?,metadata?}。"
          outputs: "{parts:<处理后消息部分>}；原生配置敏感内容转换为安全待导入引用。"
          prerequisites:
            - 仅宿主生命周期调用；Agent无需按步骤调用这些钩子。
          limitations:
            - 仅宿主入站钩子；Agent使用mt5_settings/pendingImports，不读取原密钥。
        binding:
          type: native
          name: beforeAgentTurn
      - id: beforeConfigChange
        kind: function
        consumers:
          - host
        description: "MT5 lifecycle beforeConfiguration: preserve credentials, native state and cleanup evidence."
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects: []
        usage:
          purpose: 执行MT5 beforeConfigChange 生命周期职责。
          inputs: "{}。"
          outputs: "{}；Tester在途时抛mt5_busy。"
          prerequisites:
            - 仅宿主生命周期调用；Agent无需按步骤调用这些钩子。
          limitations:
            - 等待实际任务结束，不用改ID/关插件绕过。
        binding:
          type: native
          name: beforeConfigChange
      - id: beforeDeactivate
        kind: function
        consumers:
          - host
        description: "MT5 lifecycle beforeDeactivate: preserve credentials, native state and cleanup evidence."
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects: []
        usage:
          purpose: 执行MT5 beforeDeactivate 生命周期职责。
          inputs: "{}。"
          outputs: "{}；仍有preparing/attaching/running/unknown挂载时抛ACTIVE_RUNS。"
          prerequisites:
            - 仅宿主生命周期调用；Agent无需按步骤调用这些钩子。
          limitations:
            - 保留原生运行观察通道；不可将卸载当停止EA。
        binding:
          type: native
          name: beforeDeactivate
      - id: configChanged
        kind: function
        consumers:
          - host
        description: "MT5 lifecycle configurationChanged: preserve credentials, native state and cleanup evidence."
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.write
        usage:
          purpose: 执行MT5 configChanged 生命周期职责。
          inputs: "{}。"
          outputs: "{}；通知连接监视器settingsChanged。"
          prerequisites:
            - 仅宿主生命周期调用；Agent无需按步骤调用这些钩子。
          limitations:
            - 不表示重连已成功。
        binding:
          type: native
          name: configChanged
      - id: beforeRunRelease
        kind: function
        consumers:
          - host
        description: "MT5 lifecycle protectArtifacts: preserve credentials, native state and cleanup evidence."
        inputSchema:
          type: object
          properties:
            runId:
              type: string
          required:
            - runId
          additionalProperties: true
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - process.cancel
          - resources.publish
          - private-filesystem
        usage:
          purpose: 执行MT5 beforeRunRelease 生命周期职责。
          inputs: "{runId:<宿主运行ID>}。"
          outputs: "{artifacts:[<封存成果Ref>],resources:[{id,path,digest,reason}]}；取消/等待自有编译Tester、封存证据、清理安全的任务暂存。"
          prerequisites:
            - 仅宿主生命周期调用；Agent无需按步骤调用这些钩子。
          limitations:
            - 原生进程清理不确定则抛runtime_cleanup_failed并保留现场；不停止独立实盘挂载。
        binding:
          type: native
          name: beforeRunRelease
      - id: market.bind
        kind: function
        consumers:
          - host
        description: MT5 market bind; typed native data retains exact account binding, broker wall time, coverage and actual availability.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.write
        usage:
          purpose: 为宿主建立精确行情来源会话；不代表已取得报价。
          inputs: '{binding:{}} 使用插件当前终端连接；也可带公开查询返回的精确 connection:{id:"mt5-terminal",revision:<当前配置版本字符串>}。不接受猜测的端口/登录身份。'
          outputs: "{bindingId,connection,sourceIds,accounts,health,timeBasis}；MT5 broker 时间保留其 wall authority，未提供时区就不转换 UTC。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/mt5#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - mt5_settings 给出当前配置/连接；mt5_connect 用已有配置核验终端和券商。原生行情依赖 terminal，不依赖可选 marketdata 服务。
          limitations:
            - connection.id/revision 来自当前绑定或公开查询的 metadata.connection，不等于插件 source.revision。STALE_REVISION/CONNECTION_CHANGED 时重新取得当前身份；不能猜账号、版本或静默切换来源。
        binding:
          type: native
          name: market.bind
        configurationRequirements:
          - field: account_login
            reason: 使用已绑定的券商账户身份。
          - field: account_server
            reason: 使用已绑定的券商服务器身份。
      - id: market.unbind
        kind: function
        consumers:
          - host
        description: MT5 market unbind; typed native data retains exact account binding, broker wall time, coverage and actual availability.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.write
        usage:
          purpose: 释放宿主创建的行情绑定。
          inputs: '{binding:<bind返回的含bindingId对象>}；例 {binding:{bindingId:"host-owned-id"}}。'
          outputs: "{closed:true}；释放该绑定与其分页状态。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/mt5#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - mt5_settings 给出当前配置/连接；mt5_connect 用已有配置核验终端和券商。原生行情依赖 terminal，不依赖可选 marketdata 服务。
          limitations:
            - 仅释放本次来源会话，不是平仓或停终端。
        binding:
          type: native
          name: market.unbind
      - id: market.searchInstruments
        kind: function
        consumers:
          - host
        description: MT5 market searchInstruments; typed native data retains exact account binding, broker wall time, coverage and actual availability.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              additionalProperties: true
            page:
              type: object
              properties:
                cursor:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            items:
              type: array
              items: {}
            nextCursor:
              type: string
            metadata:
              type: object
              additionalProperties: true
          required:
            - items
          additionalProperties: false
        execution: immediate
        effects:
          - process
          - network
        usage:
          purpose: 检索该明确来源的真实品种；返回 ref 是后续 instrument 的来源。
          inputs: '{binding:<bind结果>,query:{query:"EURUSD",assetClasses?,venues?},page:{limit:20,cursor?}}；limit≤1000，cursor 仅沿用同一来源/过滤条件。'
          outputs: "{items:[{ref:{sourceId,instrumentId},symbol,name,assetClass,venue?}],nextCursor?,metadata:{snapshotId?,consistency?,meta,connection?}}；空 items 仅是该次检索无匹配。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/mt5#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - mt5_settings 给出当前配置/连接；mt5_connect 用已有配置核验终端和券商。原生行情依赖 terminal，不依赖可选 marketdata 服务。
          limitations:
            - connection.id/revision 来自当前绑定或公开查询的 metadata.connection，不等于插件 source.revision。STALE_REVISION/CONNECTION_CHANGED 时重新取得当前身份；不能猜账号、版本或静默切换来源。
            - 历史缓存仅是历史；coverage 与时区不补猜。取消宿主订阅不停止EA/交易，也不关闭终端。
        binding:
          type: native
          name: market.searchInstruments
        configurationRequirements:
          - field: account_login
            reason: 使用已绑定的券商账户身份。
          - field: account_server
            reason: 使用已绑定的券商服务器身份。
          - field: terminal_token
            reason: 通过已配置的 Terminal MCP 读取当前券商数据。
          - field: terminal_url
            reason: 所选 MCP 服务使用此连接设置；启用状态和实际连接由原服务检查。
            optional: true
          - field: terminal_enabled
            reason: 所选 MCP 服务使用此连接设置；启用状态和实际连接由原服务检查。
            optional: true
      - id: market.describeInstrument
        kind: function
        consumers:
          - host
        description: MT5 market describeInstrument; typed native data retains exact account binding, broker wall time, coverage and actual availability.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              additionalProperties: true
            page:
              type: object
              properties:
                cursor:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            items:
              type: array
              items: {}
            nextCursor:
              type: string
            metadata:
              type: object
              additionalProperties: true
          required:
            - items
          additionalProperties: false
        execution: immediate
        effects:
          - process
          - network
        usage:
          purpose: 读取具体品种的价格/数量单位、时间基准和支持周期。
          inputs: "{binding:<bind结果>,query:{instrument:{sourceId:<search返回的sourceId>,instrumentId:<券商精确symbol>}}}；实际 instrument 用 search 返回 ref。"
          outputs: "{items:[{ref,symbol,name,assetClass,price,quantity,volume,timeBasis,calendar,features,native}],metadata:{meta,connection?}}；unknown/unsupported 字段保留，features 决定支持的 spec。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/mt5#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - mt5_settings 给出当前配置/连接；mt5_connect 用已有配置核验终端和券商。原生行情依赖 terminal，不依赖可选 marketdata 服务。
          limitations:
            - 历史缓存仅是历史；coverage 与时区不补猜。取消宿主订阅不停止EA/交易，也不关闭终端。
        binding:
          type: native
          name: market.describeInstrument
        configurationRequirements:
          - field: account_login
            reason: 使用已绑定的券商账户身份。
          - field: account_server
            reason: 使用已绑定的券商服务器身份。
          - field: terminal_token
            reason: 通过已配置的 Terminal MCP 读取当前券商数据。
          - field: terminal_url
            reason: 所选 MCP 服务使用此连接设置；启用状态和实际连接由原服务检查。
            optional: true
          - field: terminal_enabled
            reason: 所选 MCP 服务使用此连接设置；启用状态和实际连接由原服务检查。
            optional: true
      - id: market.queryBars
        kind: function
        consumers:
          - host
        description: MT5 market queryBars; typed native data retains exact account binding, broker wall time, coverage and actual availability.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              additionalProperties: true
            page:
              type: object
              properties:
                cursor:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            items:
              type: array
              items: {}
            nextCursor:
              type: string
            metadata:
              type: object
              additionalProperties: true
          required:
            - items
          additionalProperties: false
        execution: immediate
        effects:
          - process
          - network
        usage:
          purpose: 读取有界历史柱和真实覆盖证据，供宿主查询/冻结。
          inputs: '{binding:<bind结果>,query:{instrument:<search.ref>,spec:<describe支持的spec>,range:{from:<SourceTime>,to:<SourceTime>},includeForming:false,direction:"forward"},page:{limit:100,cursor?}}。timeframe 使用 describeInstrument.features.timeframes 的值（如15m），priceBasis=bid、adjustment=none、session=all，calendarRevision:{status:"unknown"}。range 保留源 SourceTime，区间 [from,to)。'
          outputs: "{items:[{id,revision,openTime,endTime,open,high,low,close,volume,isClosed,closure}],nextCursor?,metadata:{seriesId,instrument,spec,coverage,snapshotId,consistency,meta,connection?}}；OHLC 是十进制字符串，volume 自带单位/未知状态；无 nextCursor 只说明本次快照分页结束。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/mt5#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
