      fields:
        - id: terminal_url
          title: MT5 Terminal MCP 地址
          schema:
            type: string
            maxLength: 2048
            pattern: ^[^\r\n\u0000]*$
          binding:
            type: capability
            read: configuration.read
            update: mt5_update_configuration
            valuePath: /settings/servers/terminal/url
            writePath: /changes/servers/terminal/url
            versionPath: /settings/version
        - id: terminal_enabled
          title: 启用 MT5 Terminal
          schema:
            type: boolean
          binding:
            type: capability
            read: configuration.read
            update: mt5_update_configuration
            valuePath: /settings/servers/terminal/enabled
            writePath: /changes/servers/terminal/enabled
            versionPath: /settings/version
        - id: terminal_token
          title: MT5 Terminal MCP 密钥
          description: 仅显示是否已保存；实际认证以对应能力的连接结果为准。
          schema:
            type: string
            maxLength: 8192
            pattern: ^[^\r\n\u0000]*$
            writeOnly: true
            description: 用户提供的 MCP API Key 原文；省略保留现有值，空字符串清除。保存后立即生效，回执不返回密钥。
          binding:
            type: capability
            read: configuration.read
            update: mt5_update_configuration
            configuredPath: /settings/servers/terminal/authenticated
            writePath: /changes/servers/terminal/token
            versionPath: /settings/version
