                      type: string
                      minLength: 1
                      maxLength: 300
                    instrumentId:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
                side:
                  type: string
                  minLength: 1
                  maxLength: 300
                quantity:
                  type: object
                  properties:
                    value:
                      type: string
                      pattern: ^(0|[1-9]\d*)(\.\d+)?$
                      maxLength: 100
                    unit:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - value
                    - unit
                  additionalProperties: false
              required:
                - revision
                - instrument
                - side
                - quantity
              additionalProperties: false
          required:
            - binding
            - positionId
            - operationId
            - expected
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            operationId:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,100}$
            positionId:
              type: string
              minLength: 1
              maxLength: 300
