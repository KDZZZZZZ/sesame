              minLength: 16
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
            expected_version:
              type: integer
              minimum: 1
            changes:
              type: object
              properties:
                terminal_directory:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 4096
                      pattern: ^[^\r\n\u0000]*$
                    - type: "null"
                data_directory:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 4096
                      pattern: ^[^\r\n\u0000]*$
                    - type: "null"
                python:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 4096
                      pattern: ^[^\r\n\u0000]*$
                    - type: "null"
                wine:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 4096
                      pattern: ^[^\r\n\u0000]*$
                    - type: "null"
                wine_prefix:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 4096
                      pattern: ^[^\r\n\u0000]*$
                    - type: "null"
              additionalProperties: false
              minProperties: 1
          required:
            - command_id
            - expected_version
            - changes
          additionalProperties: false
        outputSchema:
          type: object
          description: Saved public native-dependency paths and the resulting version. This receipt contains no connection credentials.
          properties:
            id:
              type: string
            version:
              type: integer
              minimum: 1
            terminal_directory:
              anyOf:
                - type: string
                  minLength: 1
                  maxLength: 4096
                  pattern: ^[^\r\n\u0000]*$
                - type: "null"
            data_directory:
              anyOf:
                - type: string
                  minLength: 1
                  maxLength: 4096
                  pattern: ^[^\r\n\u0000]*$
                - type: "null"
            python:
              anyOf:
                - type: string
                  minLength: 1
                  maxLength: 4096
                  pattern: ^[^\r\n\u0000]*$
                - type: "null"
            wine:
              anyOf:
                - type: string
                  minLength: 1
                  maxLength: 4096
                  pattern: ^[^\r\n\u0000]*$
                - type: "null"
            wine_prefix:
              anyOf:
                - type: string
                  minLength: 1
                  maxLength: 4096
                  pattern: ^[^\r\n\u0000]*$
                - type: "null"
          required:
            - id
            - version
            - terminal_directory
            - data_directory
            - python
            - wine
            - wine_prefix
          additionalProperties: false
        effects:
          - plugin.state.write
          - application-configuration
        usage:
          purpose: Forward shared configuration edits to the existing MT5 dependency authority.
          inputs: "{command_id,expected_version,changes:{terminal_directory?,data_directory?,python?,wine?,wine_prefix?}}; null clears an override."
          outputs: The original dependency settings and version, with the existing command receipt preserved.
          prerequisites:
            - Main conversation; the expected_version comes from dependencies.read or mt5_dependencies inspect.
          limitations:
            - Reuses the existing idempotency receipts and busy/path validation. Saving does not download dependencies or launch a terminal.
        binding:
          type: native
          name: dependencies.configure
      - tool/mt5_execution_identity
      - tool/mt5_execution_snapshot
      - tool/mt5_execution_prepare
      - tool/mt5_execution_submit
      - tool/mt5_execution_recover
      - tool/mt5_execution_command
      - tool/mt5_execution_cancel
      - tool/mt5_backtest_operation
