          additionalProperties: false
        outputSchema:
          type: object
          properties:
            type:
              type: string
          required:
            - type
          additionalProperties: true
        execution: immediate
        transport: subscription
        effects:
          - process
          - network
          - plugin.session.write
        usage:
          purpose: 为宿主持续提供初始行情快照及增量。
          inputs: '{binding:<bind结果>,query:{instrument:<search.ref>,spec:<describe支持的spec>,tailLimit:100,includeForming:true}}；不传历史range或复用分页cursor，tailLimit正整数≤2000；恢复使用新快照。timeframe 使用 describeInstrument.features.timeframes 的值（如15m），priceBasis=bid、adjustment=none、session=all，calendarRevision:{status:"unknown"}。'
          outputs: '{id,events:AsyncIterable,close}；首帧 {type:"snapshot",snapshot:{seriesId,instrument,spec,bars,coverage,meta?},position:{streamId,epoch,seq},consistency,recovery:"snapshot"}；后续 {streamId,epoch,seq,eventId,schemaVersion,observedAt,type,payload}，type 为 bars.upsert/bars.closed（按源能力）或 stream.gap。position/consistency/recovery 平铺在首帧，不嵌入 metadata。'
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/mt5#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
