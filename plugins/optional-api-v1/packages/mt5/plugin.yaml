                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            operationId:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,100}$
            expected:
              type: object
              properties:
                revision:
                  type: string
                  minLength: 1
                  maxLength: 300
                instrument:
