            optional: true
          - field: account_login
            reason: 保留原操作的账户身份及历史回执边界，执行时核验当前账户。
            optional: true
          - field: account_server
            reason: 保留原操作的账户身份及历史回执边界，执行时核验当前账户。
            optional: true
