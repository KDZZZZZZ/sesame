      - id: configuration.read
        kind: function
        consumers:
          - host
        description: Read only the declared public MT5 settings and credential presence for host configuration and capability readiness; available to service and task contexts without changing main-session configuration permissions.
        inputSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            settings:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 1
                allow_trading:
                  type: boolean
                allow_host_operations:
                  type: boolean
                servers:
                  type: object
                  properties:
                    terminal:
                      type: object
                      properties:
                        url:
                          type: string
                        enabled:
                          type: boolean
                        authenticated:
                          type: boolean
                      required:
                        - url
                        - enabled
                        - authenticated
                      additionalProperties: false
                    metaeditor:
                      type: object
                      properties:
                        url:
                          type: string
                        enabled:
                          type: boolean
                        authenticated:
                          type: boolean
                      required:
                        - url
                        - enabled
                        - authenticated
                      additionalProperties: false
                    marketdata:
                      type: object
                      properties:
                        url:
                          type: string
                        enabled:
                          type: boolean
                        authenticated:
                          type: boolean
                      required:
                        - url
                        - enabled
                        - authenticated
                      additionalProperties: false
                  required:
                    - terminal
                    - metaeditor
                    - marketdata
                  additionalProperties: false
                account:
                  type: object
                  properties:
                    login:
                      type: string
                    server:
                      type: string
                    password_configured:
                      type: boolean
                      writeOnly: false
                  required:
                    - login
                    - server
                    - password_configured
                  additionalProperties: false
                tester_agent:
                  type: object
                  properties:
                    address:
                      type: string
                    port:
                      type: integer
                    password_configured:
                      type: boolean
                      writeOnly: false
                  required:
                    - address
                    - port
                    - password_configured
                  additionalProperties: false
              required:
                - version
                - allow_trading
                - allow_host_operations
                - servers
                - account
                - tester_agent
              additionalProperties: false
          required:
            - settings
          additionalProperties: false
        execution: immediate
        effects:
          - read-only
        usage:
          purpose: Provide a public configuration projection to the host without pending imports or diagnostic content.
          inputs: Empty object {}.
          outputs: "{settings:{version,servers,account,tester_agent,allow_trading,allow_host_operations}}; credentials are represented only by booleans."
          prerequisites: []
          limitations:
            - Presence does not verify remote authentication or connectivity; configuration writes and the existing mt5_settings tool retain main-conversation permissions.
        binding:
          type: native
          name: configuration.read
      - tool/mt5_settings
      - tool/mt5_update_configuration
      - tool/mt5_import_configuration
      - tool/mt5_start_terminal
      - tool/mt5_connect
