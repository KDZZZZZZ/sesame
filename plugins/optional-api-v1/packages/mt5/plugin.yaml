              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            remainingPositionQuantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            orderIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 300
              maxItems: 100
            observedAt:
              type: integer
              minimum: 0
            error:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 300
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
              required:
                - code
                - message
              additionalProperties: false
          required:
            - operationId
            - positionId
            - status
            - requestedQuantity
            - observedAt
          additionalProperties: false
        execution: immediate
        effects:
          - external-trading
          - plugin.state.write
        usage:
          purpose: 执行账户页确认的手动平仓。
          inputs: "{binding:{connection:{id,revision},account:{connectionId,accountId}},positionId,operationId,expected:{revision,instrument:{sourceId,instrumentId},side,quantity:{value,unit}},quantity?}；expected来自用户确认的账户页持仓，quantity省略表示确认数量。"
          outputs: "{operationId,positionId,status,requestedQuantity,observedAt,filledQuantity?,remainingPositionQuantity?,orderIds?,dealIds?,error?}；status=closed|filled|partially_filled|submitted|rejected|outcome_unknown；closed确认持仓已全平，filled仅确认本次数量已完成。"
          prerequisites:
