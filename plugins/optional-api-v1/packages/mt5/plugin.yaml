          type: object
          properties:
            type:
              type: string
          required:
            - type
          additionalProperties: true
        execution: immediate
        transport: subscription
        effects:
          - process
          - network
          - plugin.session.write
        usage:
          purpose: 向宿主提供账户观察快照与增量。
          inputs: '{binding:<bind结果>,query:{account:<账户ref>,topics:["snapshot","positions","orders"]}}；可选非空子集，不支持fills/history订阅或resumeToken。'
          outputs: '{id,events:AsyncIterable,close}；首帧 {type:"snapshot",snapshot:{account,coverage,snapshot?,positions?,orders?},position:{streamId,epoch,seq},consistency,recovery:"snapshot"}；后续 account.snapshot、positions.upsert、orders.upsert 或 stream.gap。position等字段平铺。'
          prerequisites:
            - 宿主 sesame/mt5#account 数据源专用；普通Agent读取账户使用已声明 portfolio_execution_context 或 mt5_trading_context，原生查询使用该包公开工具。
            - mt5_settings 给出当前配置/连接；mt5_connect 用已有配置核验终端和券商。原生行情依赖 terminal，不依赖可选 marketdata 服务。
          limitations:
            - 订阅由宿主绑定、取消和释放，Agent 不持有 bindingId。stream.gap/RESYNC_REQUIRED 可按同一来源重新取得快照；具体 SCHEMA_MISMATCH 或首帧 position 缺失是协议问题，反复重绑、新建图或启用无关服务不能修复。
            - 持仓/订单消失需新快照，不能仅凭upsert推断删除。约1秒轮询不等于交易所事件流。
        binding:
          type: native
          name: account.subscribeAccount
        configurationRequirements:
          - field: account_login
            reason: 使用已绑定的券商账户身份。
          - field: account_server
            reason: 使用已绑定的券商服务器身份。
          - field: terminal_token
            reason: 通过已配置的 Terminal MCP 读取当前券商数据。
          - field: terminal_url
            reason: 所选 MCP 服务使用此连接设置；启用状态和实际连接由原服务检查。
            optional: true
          - field: terminal_enabled
            reason: 所选 MCP 服务使用此连接设置；启用状态和实际连接由原服务检查。
            optional: true
      - id: datasets.query
