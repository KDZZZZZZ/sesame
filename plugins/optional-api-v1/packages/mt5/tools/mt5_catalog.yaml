name: mt5_catalog
title: mt5_catalog
description: 读取MT5当前明确声明的原生方法、inputSchema、调用入口与不可用原因。缺少有效方法声明时按server/query读取；已有当前声明可直接复用。Python只提供官方API，不能执行任意代码；server:"tester"是terminal Tester发现别名，实际调用使用返回的server。
inputSchema:
  type: object
  properties:
    server:
      anyOf:
        - type: string
          const: terminal
        - type: string
          const: metaeditor
        - type: string
          const: marketdata
        - type: string
          const: python
        - type: string
          const: launcher
        - type: string
          const: tester
    query:
      type: string
      description: 过滤方法名或说明
      minLength: 1
      maxLength: 200
  additionalProperties: false
outputSchema:
  description: "Domain result: native responses retain explicit status/errors, actual identities, provenance and availability; command outputs depend on the selected declared operation."
  type:
    - object
    - array
  additionalProperties: true
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - native-discovery
  usage:
    purpose: 取得当前原生方法定义、归属工具及不可用原因。
    inputs: '{server?:"terminal"|"metaeditor"|"marketdata"|"python"|"launcher"|"tester",query?:<≤200字符方法名或说明>}；例 {server:"python",query:"version"}。server:"tester" 映射至 terminal，省略 query 时过滤 Tester 方法；实际调用使用返回的 server。'
    outputs: "{checked_at,items:[{server,status,reason,server_info,workspace,tools:[{name,description,inputSchema,agent_tool,permission,callable,blocked_reason,...}],prerequisite?}]}；目录就是当前版本声明，不需试猜方法。"
    prerequisites:
      - 原生接口需要时使用；Sesame行情有已声明 data-access/canvas 入口，不以catalog作为必经流程。
    limitations:
      - 目录查询不启动终端或 MetaEditor。Terminal MCP 拒绝连接返回 unavailable，不推断终端进程或账户状态；用 mt5_connect 先核对所选终端进程。MetaEditor 未监听返回 not_running；确需编辑时由主 Agent 使用 mt5_edit 的 launcher/start_editor，或执行已授权的编辑/编译能力。installed 不等于已连接。marketdata 是独立可选服务，disabled 不影响 terminal 券商行情。
  binding:
    type: native
    name: mt5_catalog
