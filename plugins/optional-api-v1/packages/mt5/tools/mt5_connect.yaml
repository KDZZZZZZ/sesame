name: mt5_connect
title: mt5_connect
description: 验证并恢复已配置的 MT5 Terminal 连接。先按配置路径检查本机终端进程，再核验 MCP 监听/认证、券商及绑定账户。MCP 未连接不等于终端未开或账户未登录；不切换账户、不重放交易，不返回秘密。
inputSchema:
  type: object
  required:
    - command_id
  properties:
    command_id:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
    start_if_needed:
      type: boolean
  additionalProperties: false
outputSchema:
  description: "Domain result: native responses retain explicit status/errors, actual identities, provenance and availability; command outputs depend on the selected declared operation."
  type:
    - object
    - array
  additionalProperties: true
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - native-connection
    - may-start-terminal
    - plugin.state.write
  usage:
    purpose: 复用现有MT5配置，依次检查所选终端进程、MCP、券商和账户身份。
    inputs: '{command_id:<稳定ID>,start_if_needed?:boolean}；例 {command_id:"connect-existing-01",start_if_needed:false} 只恢复/验证现有连接。'
    outputs: 命令回执status=applied|failed，result:{server:"terminal",status:"connected"或不可用状态,code,reason,terminal_process?,mcp_connected?,broker_connected?,account?,settings_version?,started,steps}；terminal_process:{status,running,terminal_path,pids,checked_at}按完整路径匹配，running:null保留未知；connected需MCP和券商及账户一致。
    prerequisites:
      - 主会话；mt5_settings/mt5_dependencies说明已有配置。只诊断传start_if_needed:false；允许启动时仅在确认所选终端未运行后按现有配置启动，不重复启动运行中或状态未知的终端。
    limitations:
      - MCP未连接先检查配置对应终端是否开启，不直接索取账户/密码/token，不循环重试；仅实际缺token或明确401处理MCP凭据。进程查询失败或不支持的平台保留unknown。保存配置不等于connected；connected不证明Python IPC。独立marketdata disabled不是券商行情故障；身份不符不自动切换账号；健康连接和正常交易不添加诊断步骤。
  binding:
    type: native
    name: mt5_connect
