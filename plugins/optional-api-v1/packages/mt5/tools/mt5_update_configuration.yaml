name: mt5_update_configuration
title: mt5_update_configuration
description: 直接保存用户提供的 MT5 连接 token、券商账户密码、MetaTester 代理密码或普通运行选项。只需当前版本和稳定 command_id，无需导入文件、设置页或重启；返回脱敏回执，连接另行核验。
inputSchema:
  type: object
  required:
    - command_id
    - expected_version
    - changes
  properties:
    command_id:
      type: string
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
    expected_version:
      type: integer
      minimum: 1
    changes:
      anyOf:
        - type: object
          required:
            - import_native
          properties:
            import_native:
              type: boolean
              const: true
          additionalProperties: false
          minProperties: 1
        - type: object
          properties:
            allow_trading:
              type: boolean
            allow_host_operations:
              type: boolean
            servers:
              type: object
              properties:
                terminal:
                  type: object
                  properties:
                    url:
                      type: string
                      maxLength: 2048
                      pattern: ^[^\r\n\u0000]*$
                    enabled:
                      type: boolean
                    token:
                      type: string
                      maxLength: 8192
                      pattern: ^[^\r\n\u0000]*$
                      writeOnly: true
                      description: 用户提供的 MCP API Key 原文；省略保留现有值，空字符串清除。保存后立即生效，回执不返回密钥。
                  additionalProperties: false
                  minProperties: 1
                metaeditor:
                  type: object
                  properties:
                    url:
                      type: string
                      maxLength: 2048
                      pattern: ^[^\r\n\u0000]*$
                    enabled:
                      type: boolean
                    token:
                      type: string
                      maxLength: 8192
                      pattern: ^[^\r\n\u0000]*$
                      writeOnly: true
                      description: 用户提供的 MCP API Key 原文；省略保留现有值，空字符串清除。保存后立即生效，回执不返回密钥。
                  additionalProperties: false
                  minProperties: 1
                marketdata:
                  type: object
                  properties:
                    url:
                      type: string
                      maxLength: 2048
                      pattern: ^[^\r\n\u0000]*$
                    enabled:
                      type: boolean
                    token:
                      type: string
                      maxLength: 8192
                      pattern: ^[^\r\n\u0000]*$
                      writeOnly: true
                      description: 用户提供的 MCP API Key 原文；省略保留现有值，空字符串清除。保存后立即生效，回执不返回密钥。
                  additionalProperties: false
                  minProperties: 1
              additionalProperties: false
              minProperties: 1
            account:
              type: object
              properties:
                login:
                  type: string
                  pattern: ^(|[1-9][0-9]{0,19})$
                server:
                  type: string
                  maxLength: 200
                  pattern: ^[^\r\n\u0000]*$
                password:
                  type: string
                  maxLength: 1024
                  pattern: ^[^\r\n\u0000]*$
                  writeOnly: true
                  description: 用户提供的券商账户密码；省略保留现有值，空字符串清除。账户改变时需明确提供对应密码。
              additionalProperties: false
              minProperties: 1
            tester_agent:
              type: object
              properties:
                address:
                  type: string
                  maxLength: 15
                  pattern: ^[^\r\n\u0000]*$
                port:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                password:
                  type: string
                  maxLength: 1024
                  pattern: ^[^\r\n\u0000]*$
                  writeOnly: true
                  description: 用户提供的 MetaTester 代理密码；省略保留现有值，空字符串清除。
              additionalProperties: false
              minProperties: 1
          additionalProperties: false
          minProperties: 1
  additionalProperties: false
outputSchema:
  type: object
  description: Public configuration receipt. Submitted credentials remain private; result contains only settings and credential-presence flags.
  properties:
    id:
      type: string
    conversation_id:
      type: string
    target:
      type: string
      const: mt5
    status:
      type: string
      enum:
        - running
        - applied
        - failed
    changes:
      anyOf:
        - type: object
          required:
            - import_native
          properties:
            import_native:
              type: boolean
              const: true
          additionalProperties: false
          minProperties: 1
        - type: object
          properties:
            allow_trading:
              type: boolean
            allow_host_operations:
              type: boolean
            servers:
              type: object
              properties:
                terminal:
                  type: object
                  properties:
                    url:
                      type: string
                      maxLength: 2048
                      pattern: ^[^\r\n\u0000]*$
                    enabled:
                      type: boolean
                    token:
                      type: string
                      maxLength: 8192
                      pattern: ^[^\r\n\u0000]*$
                      writeOnly: true
                      description: 用户提供的 MCP API Key 原文；省略保留现有值，空字符串清除。保存后立即生效，回执不返回密钥。
                  additionalProperties: false
                  minProperties: 1
                metaeditor:
                  type: object
                  properties:
                    url:
                      type: string
                      maxLength: 2048
                      pattern: ^[^\r\n\u0000]*$
                    enabled:
                      type: boolean
                    token:
                      type: string
                      maxLength: 8192
                      pattern: ^[^\r\n\u0000]*$
                      writeOnly: true
                      description: 用户提供的 MCP API Key 原文；省略保留现有值，空字符串清除。保存后立即生效，回执不返回密钥。
                  additionalProperties: false
                  minProperties: 1
                marketdata:
                  type: object
                  properties:
                    url:
                      type: string
                      maxLength: 2048
                      pattern: ^[^\r\n\u0000]*$
                    enabled:
                      type: boolean
                    token:
                      type: string
                      maxLength: 8192
                      pattern: ^[^\r\n\u0000]*$
                      writeOnly: true
                      description: 用户提供的 MCP API Key 原文；省略保留现有值，空字符串清除。保存后立即生效，回执不返回密钥。
                  additionalProperties: false
                  minProperties: 1
              additionalProperties: false
              minProperties: 1
            account:
              type: object
              properties:
                login:
                  type: string
                  pattern: ^(|[1-9][0-9]{0,19})$
                server:
                  type: string
                  maxLength: 200
                  pattern: ^[^\r\n\u0000]*$
                password:
                  type: string
                  maxLength: 1024
                  pattern: ^[^\r\n\u0000]*$
                  writeOnly: true
                  description: 用户提供的券商账户密码；省略保留现有值，空字符串清除。账户改变时需明确提供对应密码。
              additionalProperties: false
              minProperties: 1
            tester_agent:
              type: object
              properties:
                address:
                  type: string
                  maxLength: 15
                  pattern: ^[^\r\n\u0000]*$
                port:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                password:
                  type: string
                  maxLength: 1024
                  pattern: ^[^\r\n\u0000]*$
                  writeOnly: true
                  description: 用户提供的 MetaTester 代理密码；省略保留现有值，空字符串清除。
              additionalProperties: false
              minProperties: 1
          additionalProperties: false
          minProperties: 1
    result:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        allow_trading:
          type: boolean
        allow_host_operations:
          type: boolean
        servers:
          type: object
          properties:
            terminal:
              type: object
              properties:
                url:
                  type: string
                enabled:
                  type: boolean
                authenticated:
                  type: boolean
              required:
                - url
                - enabled
                - authenticated
              additionalProperties: false
            metaeditor:
              type: object
              properties:
                url:
                  type: string
                enabled:
                  type: boolean
                authenticated:
                  type: boolean
              required:
                - url
                - enabled
                - authenticated
              additionalProperties: false
            marketdata:
              type: object
              properties:
                url:
                  type: string
                enabled:
                  type: boolean
                authenticated:
                  type: boolean
              required:
                - url
                - enabled
                - authenticated
              additionalProperties: false
          required:
