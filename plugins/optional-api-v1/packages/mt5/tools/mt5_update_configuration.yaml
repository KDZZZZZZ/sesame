            - metaeditor
            - marketdata
          additionalProperties: false
        account:
          type: object
          properties:
            login:
              type: string
            server:
              type: string
            password_configured:
              type: boolean
              writeOnly: false
          required:
            - login
            - server
            - password_configured
          additionalProperties: false
        tester_agent:
          type: object
          properties:
            address:
              type: string
            port:
              type: integer
            password_configured:
              type: boolean
              writeOnly: false
          required:
            - address
            - port
            - password_configured
          additionalProperties: false
        startup_configured:
          type: boolean
        python_installed:
          type: boolean
      required:
        - version
        - allow_trading
        - allow_host_operations
        - servers
        - account
        - tester_agent
        - startup_configured
        - python_installed
      additionalProperties: false
    created_at:
      type: string
    completed_at:
      type: string
    error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
      additionalProperties: false
  required:
    - id
    - conversation_id
    - target
    - status
    - changes
    - created_at
  additionalProperties: false
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - plugin.state.write
    - application-configuration
  usage:
    purpose: 直接配置 MT5 连接、账户、凭据及运行权限，立即刷新后台配置并保留脱敏幂等回执。
    inputs: '{command_id:<稳定16–128字符>,expected_version:<settings.version>,changes}。changes支持 servers:{terminal|metaeditor|marketdata:{url?,enabled?,token?}}、account:{login?,server?,password?}、tester_agent:{address?,port?,password?}、allow_trading、allow_host_operations；也可单独用 {import_native:true} 读取已有原生配置。例 {command_id:"configure-terminal-token-01",expected_version:1,changes:{servers:{terminal:{token:"用户提供的API Key"}}}}。凭据字段省略保留现有值，空字符串清除；更换endpoint或账户身份会清除对应旧凭据，必要时同次传入新凭据。'
    outputs: "{id,conversation_id,target,status,changes,result?,error?,created_at,completed_at}；changes里的token/password均为[redacted]，result只含脱敏settings。applied说明已保存且立即生效；mt5_connect核验终端与账户，mt5_catalog单独核验其他服务。"
    prerequisites:
      - 主会话；expected_version来自mt5_settings。目标及凭据来自用户提供或已知配置，已取得的用户授权继续有效。
    limitations:
      - 直接配置和可选mt5_import_configuration均可用；用户已给信息就保存并核验，不要求重新导出、设置页填写或重复授权。不回显密钥，不把密钥写入报告、脚本或长期记忆。
      - 版本冲突读取当前settings；相同command_id和输入重试仅返回原回执。保存不自动登录、启动终端或下单；外部原生拒绝保留其具体事实。
  binding:
    type: native
    name: mt5_update_configuration
