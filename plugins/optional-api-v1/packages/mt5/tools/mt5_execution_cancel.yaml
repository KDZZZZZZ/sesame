name: mt5_execution_cancel
title: mt5_execution_cancel
description: Guarded native execution adapter cancel. Retains raw audit receipts; unknown outcomes never authorize resend.
inputSchema:
  type: object
  properties:
    record:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        backend:
          const: mt5
        account:
          type: object
          properties:
            accountId:
              type: string
              minLength: 1
            server:
              type: string
              minLength: 1
            revision:
              type: string
              minLength: 1
          required:
            - accountId
            - server
            - revision
          additionalProperties: false
        backendCommandId:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        action:
          enum:
            - market
            - limit
            - close
        side:
          enum:
            - buy
            - sell
        createdAt:
          type: integer
        remark:
          type: string
          minLength: 1
        quantity:
          type: string
          minLength: 1
        planExecution:
          type: boolean
      required:
        - backend
        - account
      additionalProperties: true
    operationId:
      type: string
      minLength: 1
  required:
    - record
    - operationId
  additionalProperties: false
outputSchema:
  type: object
  properties:
    contract:
      const: sesame.execution-adapter/1
      type: string
    backend:
      const: mt5
      type: string
    status:
      enum:
        - submitted
        - cancel_requested
        - rejected
        - partially_filled
        - execution_reported
        - outcome_unknown
    submissionAttempted:
      type:
        - boolean
        - "null"
    raw:
      type: object
      additionalProperties: true
    timing:
      type: object
      additionalProperties: true
  required:
    - contract
    - backend
    - status
    - submissionAttempted
    - raw
  additionalProperties: false
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - external-trading
    - plugin.state.write
  usage:
    purpose: sesame.execution-adapter/1 cancel; native SDK mechanics stay in this adapter.
    inputs: Use the declared normalized operation input, exact account/revision and retained operation IDs.
    outputs: Versioned adapter projection plus unchanged raw native evidence. Snapshot/identity do not establish permission or broker readiness.
    prerequisites:
      - Delegated access requires a matching frozen execution task; writes additionally require a live workflow-to-portfolio apply invocation chain.
    limitations:
      - No broker acceptance is inferred from a declaration. Missing history never proves no submission.
  binding:
    type: native
    name: mt5_execution_cancel
