        kind: reference
      - id: knowledge-5
        path: skills/abu-exit-rules/SKILL.md
        description: 数值方法：针对一个已声明的假设持仓计算 ATR 止损、止盈、追踪回撤与最长持有期退出观察。 输入为已固定证据；输出为 observations 与输入/结果工件，供方法解释或工作流复用。
        kind: skill
