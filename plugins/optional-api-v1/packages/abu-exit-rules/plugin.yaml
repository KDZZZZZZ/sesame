formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/abu-exit-rules
title: 退出规则基线
description: ATR止损止盈、峰值回撤和持有期退出观察。这是可改进基线而非标准答案；输入显式来源和截止时点，输出可复核研究结果。 自动冻结输入与结果数据工件，用户可复核。
version: 2.0.1
license: GPL-3.0-only
engines:
  sesame: ">=0.2.3"
author:
  name: Sesame contributors; ABU reference by bbfamily / 阿布
entry: index.js
x-sesame:
  default_state: discoverable
  agent_scope: all
  prompts:
    - instructions.md
  skills:
    - skills
  resources:
    - LICENSE
    - PROVENANCE.md
    - README.md
    - examples/input.json
    - scripts/baseline.mjs
    - scripts/runtime.mjs
    - references/method.md
  provides: {}
  contributions:
    capabilities:
      - tool/abu_exit_rules_analyze
    sources: []
    views: []
    services: []
    knowledge:
      - id: knowledge-0
        path: examples/input.json
        description: 退出规则基线 — examples/input.json
        kind: reference
      - id: knowledge-1
        path: instructions.md
        description: abu_exit_rules_analyze 的局部目标、解释边界和跨方法交接。
        kind: prompt
      - id: knowledge-2
        path: PROVENANCE.md
        description: 退出规则基线 — PROVENANCE.md
        kind: reference
