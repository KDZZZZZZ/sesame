id: behavioral-finance-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/behavioral-finance/skills/behavioral-finance/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/behavioral-finance
  - step: 1
    pointer: /tools
    equals: []
  - step: 2
    pointer: /contents/0/text
    contains: "# 行为金融研究"
