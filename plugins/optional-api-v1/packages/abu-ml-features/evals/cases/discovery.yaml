id: abu-ml-features-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/abu-ml-features/skills/abu-ml-features/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/abu-ml-features
  - step: 1
    pointer: /tools/0/name
    equals: abu_ml_features_analyze
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        input:
          type: object
          properties:
            schema_version:
              const: 1
            as_of:
              type: string
              description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
            source:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 500
                kind:
                  enum:
                    - synthetic
                    - historical
                    - live
              required:
                - id
                - kind
              additionalProperties: true
              description: Caller-declared provenance; synthetic remains synthetic in output artifacts.
            parameters:
              type: object
              properties:
                window:
                  type: integer
                  default: 5
                  minimum: 2
                  maximum: 252
                  description: 回归与波动窗口
                atr_window:
                  type: integer
                  minimum: 2
                  maximum: 252
                  description: ATR 窗口，默认 window
                rank_window:
                  type: integer
                  minimum: 2
                  maximum: 252
                  description: 价格排名窗口，默认 window
              additionalProperties: false
              description: Optional overrides. Defaults and limits match the existing calculation.
            decision_times:
              type: array
              items:
                type: string
                description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
              maxItems: 1000
              minItems: 1
              description: decision_times 可省略，默认 [as_of]；提供时是 1..1000 个不晚于 as_of 的 UTC 时点。每个时点至少需 max(window,atr_window,rank_window)+1 根当时已可见的历史 K 线；decision_times.length * bars.length <= 10000000。
            bars:
              type: array
              items:
                type: object
                properties:
                  time:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  available_at:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  open:
                    type: number
                  high:
                    type: number
                  low:
                    type: number
                  close:
                    type: number
                  volume:
                    type: number
                additionalProperties: true
                required:
                  - time
                  - available_at
                  - open
                  - high
                  - low
                  - close
                  - volume
              maxItems: 10000
              minItems: 1
              description: bars 是 1..10000 条已知 OHLCV，按收盘 time 严格递增且不重复；每行含 time、available_at、open/high/low/close、volume。time <= available_at <= as_of，价格为正且 high/low 覆盖 open/close，volume >= 0。
          additionalProperties: true
          required:
            - schema_version
            - source
            - as_of
            - bars
          description: 完整的固定输入对象；examples/input.json 仅为合成格式示例，不是实盘证据。
      required:
        - input
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# 交易特征基线"
