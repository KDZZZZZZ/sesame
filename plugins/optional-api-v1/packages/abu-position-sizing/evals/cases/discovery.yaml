id: abu-position-sizing-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/abu-position-sizing/skills/abu-position-sizing/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/abu-position-sizing
  - step: 1
    pointer: /tools/0/name
    equals: abu_position_sizing_analyze
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        input:
          type: object
          properties:
            schema_version:
              const: 1
            as_of:
              type: string
              description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
            source:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 500
                kind:
                  enum:
                    - synthetic
                    - historical
                    - live
              required:
                - id
                - kind
              additionalProperties: true
              description: Caller-declared provenance; synthetic remains synthetic in output artifacts.
            account:
              type: object
              properties:
                equity:
                  type: number
                currency:
                  type: string
              additionalProperties: true
            instrument:
              type: object
              properties:
                price_currency:
                  type: string
              additionalProperties: true
            parameters:
              type: object
              properties:
                atr_window:
                  type: integer
                  default: 14
                  minimum: 2
                  maximum: 200
                  description: ATR 窗口
                atr_stop_multiple:
                  type: number
                  default: 2
                  minimum: 0.1
                  maximum: 100
                  description: 风险距离 ATR 倍数
                risk_fraction:
                  type: number
                  default: 0.01
                  minimum: 0
                  maximum: 0.2
                  description: 每笔权益风险比例
                kelly_win_probability:
                  type: number
                  default: 0.5
                  minimum: 0
                  maximum: 1
                  description: 假定胜率
                kelly_avg_win_loss_ratio:
                  type: number
                  default: 1
                  minimum: 5e-324
                  maximum: 1000
                  description: 假定平均盈利/亏损比
                kelly_fraction_cap:
                  type: number
                  default: 0.25
                  minimum: 0
                  maximum: 1
                  description: Kelly 比例上限
                kelly_fraction_multiplier:
                  type: number
                  default: 0.5
                  minimum: 0
                  maximum: 1
                  description: 分数 Kelly 缩放
                price_rank_window:
                  type: integer
                  default: 60
                  minimum: 2
                  maximum: 1000
                  description: 价格排名窗口
              additionalProperties: false
              description: Optional overrides. Defaults and limits match the existing calculation.
            bars:
              type: array
              items:
                type: object
                properties:
                  time:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  available_at:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  open:
                    type: number
                  high:
                    type: number
                  low:
                    type: number
                  close:
                    type: number
                  volume:
                    type: number
                additionalProperties: true
                required:
                  - time
                  - available_at
                  - open
                  - high
                  - low
                  - close
                  - volume
              maxItems: 10000
              minItems: 1
              description: bars 是 1..10000 条已知 OHLCV，按收盘 time 严格递增且不重复；每行含 time、available_at、open/high/low/close、volume。time <= available_at <= as_of，价格为正且 high/low 覆盖 open/close，volume >= 0。
          additionalProperties: true
          required:
            - schema_version
            - source
            - as_of
            - bars
            - account
            - instrument
          description: 完整的固定输入对象；examples/input.json 仅为合成格式示例，不是实盘证据。
      required:
        - input
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# 仓位计算基线"
