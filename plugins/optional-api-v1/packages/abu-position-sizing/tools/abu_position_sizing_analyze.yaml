name: abu_position_sizing_analyze
title: abu_position_sizing_analyze
description: 在明确权益、币种和标的单位假设下计算 ATR 风险预算、分数 Kelly 与价格排名仓位基线。
inputSchema:
  type: object
  properties:
    input:
      type: object
      properties:
        schema_version:
          const: 1
        as_of:
          type: string
          description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
        source:
          type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 500
            kind:
              enum:
                - synthetic
                - historical
                - live
          required:
            - id
            - kind
          additionalProperties: true
          description: Caller-declared provenance; synthetic remains synthetic in output artifacts.
        account:
          type: object
          properties:
            equity:
              type: number
            currency:
              type: string
          additionalProperties: true
        instrument:
          type: object
          properties:
            price_currency:
              type: string
          additionalProperties: true
        parameters:
          type: object
          properties:
            atr_window:
              type: integer
              default: 14
              minimum: 2
              maximum: 200
              description: ATR 窗口
            atr_stop_multiple:
              type: number
              default: 2
              minimum: 0.1
              maximum: 100
              description: 风险距离 ATR 倍数
            risk_fraction:
              type: number
              default: 0.01
              minimum: 0
              maximum: 0.2
              description: 每笔权益风险比例
            kelly_win_probability:
              type: number
              default: 0.5
              minimum: 0
              maximum: 1
              description: 假定胜率
            kelly_avg_win_loss_ratio:
              type: number
              default: 1
              minimum: 5e-324
              maximum: 1000
              description: 假定平均盈利/亏损比
            kelly_fraction_cap:
              type: number
              default: 0.25
              minimum: 0
              maximum: 1
              description: Kelly 比例上限
            kelly_fraction_multiplier:
              type: number
              default: 0.5
              minimum: 0
              maximum: 1
              description: 分数 Kelly 缩放
            price_rank_window:
              type: integer
              default: 60
              minimum: 2
              maximum: 1000
              description: 价格排名窗口
          additionalProperties: false
          description: Optional overrides. Defaults and limits match the existing calculation.
        bars:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
                description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
              available_at:
                type: string
                description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
              open:
                type: number
              high:
                type: number
              low:
                type: number
              close:
                type: number
              volume:
                type: number
            additionalProperties: true
            required:
              - time
              - available_at
              - open
              - high
              - low
              - close
              - volume
          maxItems: 10000
          minItems: 1
          description: bars 是 1..10000 条已知 OHLCV，按收盘 time 严格递增且不重复；每行含 time、available_at、open/high/low/close、volume。time <= available_at <= as_of，价格为正且 high/low 覆盖 open/close，volume >= 0。
      additionalProperties: true
      required:
        - schema_version
        - source
        - as_of
        - bars
        - account
        - instrument
      description: 完整的固定输入对象；examples/input.json 仅为合成格式示例，不是实盘证据。
  required:
    - input
  additionalProperties: false
outputSchema:
  type: object
  properties:
    schema_version:
      const: 1
    baseline:
      const: true
    status:
      const: research_baseline
    parameters:
      type: object
    observations:
      description: observations.account/instrument 保留单位假设，latest/series 给出风险/仓位观察，decision_available_at 为证据可用时点。省略数量换算时只得到资金/价格点维度的计算，不是券商下单手数。
    limitations:
      type: array
      items:
        type: string
    input_artifact:
      type: object
      description: 立即返回 {schema_version:1,baseline:true,status:"research_baseline",source,as_of,parameters,observations,limitations,input_sha256,implementation_sha256,input_artifact,result_artifact}。两个 artifact 是完整不可变 DataRef，保留 id/revision/digest/kind/schemaVersion；若需再次读取，可将完整 ref 传给 data_read({ref})（需 data-access/workspace）。input_artifact 保存 [{input}]，result_artifact 保存 [{...计算结果}]，后者不自包含 artifact 引用。
    result_artifact:
      type: object
      description: 立即返回 {schema_version:1,baseline:true,status:"research_baseline",source,as_of,parameters,observations,limitations,input_sha256,implementation_sha256,input_artifact,result_artifact}。两个 artifact 是完整不可变 DataRef，保留 id/revision/digest/kind/schemaVersion；若需再次读取，可将完整 ref 传给 data_read({ref})（需 data-access/workspace）。input_artifact 保存 [{input}]，result_artifact 保存 [{...计算结果}]，后者不自包含 artifact 引用。
  required:
    - schema_version
    - baseline
    - status
    - parameters
    - observations
    - limitations
    - input_artifact
    - result_artifact
  additionalProperties: true
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - resources.create
    - resources.publish
  binding:
    type: native
    name: abu_position_sizing_analyze
  usage:
    purpose: 在明确权益、币种和标的单位假设下计算 ATR 风险预算、分数 Kelly 与价格排名仓位基线。
    inputs: 调用形状为 {input:{schema_version:1,source:{id,kind},as_of,parameters?,...}}，不是文件路径或数据 ID。source.id 为 1..500 字符，kind 为 synthetic/historical/live；as_of 及全部时间字段使用真实 UTC YYYY-MM-DDTHH:mm:ss.sssZ（含毫秒）。输入限 2MiB 有限 JSON，不接收代码。parameters 只支持列出的字段。 bars 是 1..10000 条已知 OHLCV，按收盘 time 严格递增且不重复；每行含 time、available_at、open/high/low/close、volume。time <= available_at <= as_of，价格为正且 high/low 覆盖 open/close，volume >= 0。 account:{equity>0,currency}；instrument:{price_currency,quantity_unit?,point_value?}。币种和数量单位代码须为 2..32 字符的大写标识；quantity_unit 与 point_value 必须同时提供或同时省略。point_value 表示每个数量单位每一个价格点对应的资金金额，不能把它误作最小跳动。
    outputs: observations.account/instrument 保留单位假设，latest/series 给出风险/仓位观察，decision_available_at 为证据可用时点。省略数量换算时只得到资金/价格点维度的计算，不是券商下单手数。 立即返回 {schema_version:1,baseline:true,status:"research_baseline",source,as_of,parameters,observations,limitations,input_sha256,implementation_sha256,input_artifact,result_artifact}。两个 artifact 是完整不可变 DataRef，保留 id/revision/digest/kind/schemaVersion；若需再次读取，可将完整 ref 传给 data_read({ref})（需 data-access/workspace）。input_artifact 保存 [{input}]，result_artifact 保存 [{...计算结果}]，后者不自包含 artifact 引用。 交给调用者时保留上述固定引用、source/as_of、实际参数和 limitations。把账户/单位假设和 latest/series 的风险预算、数量交给风险审查；实际券商手数、保证金和可成交性须用账户后端核验，观察值不直接转成订单。
    prerequisites:
      - 提供与任务相符的已知输入；本能力不联网取数，不需要 Python、ABU 安装或券商账户。
    limitations:
      - equity 是整段计算的固定假设，不是模拟权益轨迹。Kelly 的概率和盈亏比来自输入假设；未校准概率不能当作可靠盈利概率。本能力不发单。
      - 首根 TR 使用 high-low，累计 atr_window 根输入可得 ATR；完整仓位结果还须满足 price_rank_window，否则 status=warmup。与 abu-indicators/abu-volatility 首根 TR=null、需 N+1 根的初始化口径不同。
      - 来源与 available_at 是调用方声明，能力不会独立验证供应商历史；synthetic 证据必须保持演示标记。结果是研究观察，不是订单、成交或收益证明。
      - 复用前核对输入版本、参数、截止时间与实现口径；已有匹配结果可直接引用。同源价格、成交或统计派生结果不能重复计为独立证据；计算只回答本项局部问题，方法解释与最终综合由调用者负责。
