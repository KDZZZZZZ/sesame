name: judgment_rules
title: judgment_rules
description: 读取专属准则、候选及前瞻验证状态；criteria 是可共享读取的 CRITERIA.md 固定 ArtifactRef。
inputSchema:
  type: object
  properties: {}
  additionalProperties: false
outputSchema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          version:
            type: integer
          title:
            type: string
          guideline:
            type: string
          topic:
            type: string
          regime:
            type: string
          limitations:
            type: string
          evidence_ids:
            type: array
            items:
              type: string
          parent_rule_id:
            type:
              - string
              - "null"
          created_at:
            type: string
          status:
            enum:
              - candidate
              - active
              - probation
              - retired
          evaluation:
            type:
              - object
              - "null"
          retired_at:
            type: string
          retirement_reason:
            type: string
        required:
          - id
          - title
          - guideline
          - status
        additionalProperties: false
    policy:
      type: object
      properties: {}
      required: []
      additionalProperties: true
    criteria:
      type: object
      properties:
        id:
          type: string
        revision:
          type: string
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          const: resource
        schemaVersion:
          const: 1.0.0
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
  required:
    - items
    - policy
    - criteria
  additionalProperties: false
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - Read saved workspace evidence
    - Read and update the private judgment ledger
    - Publish immutable judgment criteria
  usage:
    purpose: 读取专属准则、候选及前瞻验证状态；criteria 是可共享读取的 CRITERIA.md 固定 ArtifactRef。
    inputs: "{}."
    outputs: '{items,policy,criteria}; criteria is the immutable published CRITERIA.md reference. The Agent reads it with host_resources_read({ref,part:"content",entry:"CRITERIA.md",encoding:"utf8"}); the plugin SDK uses host.resources.read(ref,options). These are prospective judgment criteria, not confirmed personal trading-risk red lines; those belong to the memory policy.'
    prerequisites:
      - Main conversation only; task/tool names do not grant a delegated Agent this authority.
    limitations:
      - The live main-only tools are not delegated by sharing the document. Standard host.agent.run grants exact-reference resource reads by default; pass the returned criteria ref explicitly. Additional business capabilities still require an explicit allowedCalls grant.
  binding:
    type: native
    name: judgment_rules
