name: judgment_review_queue
title: judgment_review_queue
description: 按需读取持久复盘清单：到期判断、待归因核验和待全文核对的回复。主 Agent 自行选择复盘时机；不发送用户消息，不启动模型，不自动核验。
inputSchema:
  type: object
  properties:
    kind:
      anyOf:
        - type: string
          const: all
        - type: string
          const: due
        - type: string
          const: reflection
        - type: string
          const: coverage
    offset:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
      maximum: 100
  additionalProperties: false
outputSchema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
        properties: {}
        required: []
        additionalProperties: true
    total:
      type: integer
    next_offset:
      type:
        - integer
        - "null"
    criteria:
      type: object
      properties:
        id:
          type: string
        revision:
          type: string
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          const: resource
        schemaVersion:
          const: 1.0.0
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
    offset:
      type: integer
    statistics:
      type: object
      properties: {}
      required: []
      additionalProperties: true
  required:
    - items
    - total
    - next_offset
  additionalProperties: false
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - Read saved workspace evidence
    - Read and update the private judgment ledger
    - Publish immutable judgment criteria
  usage:
    purpose: 按需读取持久复盘清单：到期判断、待归因核验和待全文核对的回复。主 Agent 自行选择复盘时机；不发送用户消息，不启动模型，不自动核验。
    inputs: '{kind?:"all"|"due"|"reflection"|"coverage",offset?:0,limit?:30}.'
    outputs: "{items,total,offset,next_offset,statistics,criteria}; items identify due judgment_id, reflection judgment_id or coverage message_id; criteria is a published CRITERIA.md ArtifactRef."
    prerequisites:
      - Main conversation only; task/tool names do not grant a delegated Agent this authority.
    limitations:
      - A queue read neither verifies an outcome nor completes semantic reflection.
  binding:
    type: native
    name: judgment_review_queue
