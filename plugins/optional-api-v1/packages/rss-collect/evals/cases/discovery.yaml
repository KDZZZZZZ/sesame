id: rss-collect-discovery
environment:
  mode: replay
  fixtures: rss-collect-recorded-call.json
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/rss-collect/skills/rss-collect/SKILL.md
  - operation: tools/call
    params:
      name: parse_feed
      arguments:
        file_path: sample.atom
        max_entries: 3
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/rss-collect
  - step: 1
    pointer: /tools/0/name
    equals: parse_feed
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        xml_content:
          type: string
          description: Raw RSS/Atom XML string
          minLength: 1
        file_path:
          type: string
          description: Relative path to a bundled XML file; cannot access conversation or host files
          minLength: 1
        max_entries:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        source_ref:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            revision:
              type: string
              minLength: 1
            digest:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
            kind:
              const: data
            schemaVersion:
              type: string
              minLength: 1
          required:
            - id
            - revision
            - digest
            - kind
            - schemaVersion
          additionalProperties: false
          description: Exact immutable data ref returned by sources_fetch; original source is read inside the plugin, without copying a preview or a workspace JSON line.
      additionalProperties: false
      oneOf:
        - required:
            - xml_content
        - required:
            - file_path
        - required:
            - source_ref
  - step: 2
    pointer: /contents/0/text
    contains: "## 输入与组合"
  - step: 3
    pointer: /structuredContent
    equals:
      format: atom
      feed_title: Release notes from trafilatura
      feed_updated: 2026-10-02T16:53:21Z
      entry_count: 10
      entries:
        - title: trafilatura-2.3.0
          link: https://github.com/adbar/trafilatura/releases/tag/v2.3.0
          published: 2026-10-02T16:53:41Z
          id: tag:github.com,2008:Repository/180136168/v2.3.0
          content_snippet: "Major changes: Downloads and decompression overhaul by @adbar ( #921 ) Simplified document handling code and better correctness by @adbar ( #938 ) Simpler and faster deduplication, scoped caches accepted by @adbar ( #919 ) Fixes: Better text extraction: forms, link farms, inline code, infinite scrol"
        - title: trafilatura-2.2.0
          link: https://github.com/adbar/trafilatura/releases/tag/v2.2.0
          published: 2026-07-31T16:07:10Z
          id: tag:github.com,2008:Repository/180136168/v2.2.0
          content_snippet: "Major changes: Revamped text recovery and extraction sequence: better recall overall and better extraction on forums by @adbar ( #881 ) More targeted boilerplate pruning to reduce over-extraction by @adbar ( #887 ) More robust tests and better processing for nested elements by @adbar ( #866 ) Better"
        - title: trafilatura-2.1.0
          link: https://github.com/adbar/trafilatura/releases/tag/v2.1.0
          published: 2026-06-07T17:44:28Z
          id: tag:github.com,2008:Repository/180136168/v2.1.0
          content_snippet: "Major changes: Dependencies updated, lxml in particular (with minimal changes in the code) Faster XPath performance using XSLT extensions by @Honesty-of-the-Cavernous-Tissue ( #793 ) More deprecation warnings More robust code Fixes: Fix node pruning raising an AttributeError in certain cases by @PLP"
      source: sample.atom
      version: 3.0.0
