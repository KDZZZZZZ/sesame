id: abu-trend-pullback-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/abu-trend-pullback/skills/abu-trend-pullback/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/abu-trend-pullback
  - step: 1
    pointer: /tools/0/name
    equals: abu_trend_pullback_analyze
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        input:
          type: object
          properties:
            schema_version:
              const: 1
            as_of:
              type: string
              description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
            source:
              type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 500
                kind:
                  enum:
                    - synthetic
                    - historical
                    - live
              required:
                - id
                - kind
              additionalProperties: true
              description: Caller-declared provenance; synthetic remains synthetic in output artifacts.
            parameters:
              type: object
              properties:
                trend_window:
                  type: integer
                  default: 20
                  minimum: 4
                  maximum: 500
                  description: 长趋势窗口
                pullback_window:
                  type: integer
                  default: 5
                  minimum: 2
                  maximum: 100
                  description: 短回撤窗口
                min_trend_return:
                  type: number
                  default: 0.05
                  minimum: 0
                  maximum: 5
                  description: 最小趋势收益比例
                min_pullback:
                  type: number
                  default: 0.02
                  minimum: 0
                  maximum: 1
                  description: 最小回撤比例
                max_pullback:
                  type: number
                  default: 0.25
                  minimum: 0
                  maximum: 1
                  description: 最大回撤比例
                golden_tolerance:
                  type: number
                  default: 0.08
                  minimum: 0
                  maximum: 0.5
                  description: 黄金分割参考容差
              additionalProperties: false
              description: Optional overrides. Defaults and limits match the existing calculation.
            bars:
              type: array
              items:
                type: object
                properties:
                  time:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  available_at:
                    type: string
                    description: Canonical UTC YYYY-MM-DDTHH:mm:ss.sssZ, including milliseconds; preserve actual evidence time.
                  open:
                    type: number
                  high:
                    type: number
                  low:
                    type: number
                  close:
                    type: number
                  volume:
                    type: number
                additionalProperties: true
                required:
                  - time
                  - available_at
                  - open
                  - high
                  - low
                  - close
                  - volume
              maxItems: 10000
              minItems: 1
              description: bars 是 1..10000 条已知 OHLCV，按收盘 time 严格递增且不重复；每行含 time、available_at、open/high/low/close、volume。time <= available_at <= as_of，价格为正且 high/low 覆盖 open/close，volume >= 0。
          additionalProperties: true
          required:
            - schema_version
            - source
            - as_of
            - bars
          description: 完整的固定输入对象；examples/input.json 仅为合成格式示例，不是实盘证据。
      required:
        - input
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# 趋势回撤基线"
