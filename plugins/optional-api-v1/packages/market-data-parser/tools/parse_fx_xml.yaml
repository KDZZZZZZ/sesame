name: parse_fx_xml
title: parse_fx_xml
description: 信息解析：解析已有TCMB Tarih_Date XML的日期、公告号、币种、单位与买卖汇率；不获取行情、不作交易判断。优先传sources_fetch返回的完整source_ref；也可传xml_content或包内file_path，三选一。插件读取完整冻结原文，不重新抓取。 长结果返回完整正文/结构资源引用及有界预览。
inputSchema:
  type: object
  properties:
    xml_content:
      type: string
      description: Raw XML string
      minLength: 1
    file_path:
      type: string
      description: Relative path to a bundled XML file; cannot access conversation or host files
      minLength: 1
    codes:
      type: array
      items:
        type: string
      description: Optional currency code filter, e.g. ["USD","EUR"]
    source_ref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          const: data
        schemaVersion:
          type: string
          minLength: 1
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
      description: Exact immutable data ref returned by sources_fetch; original source is read inside the plugin, without copying a preview or a workspace JSON line.
  additionalProperties: false
  oneOf:
    - required:
        - xml_content
    - required:
        - file_path
    - required:
        - source_ref
outputSchema:
  type: object
  properties:
    format:
      type: string
    date:
      type: string
    bulletin_no:
      type: string
    total_currencies:
      type: number
    returned_currencies:
      type: number
    currencies:
      type: array
      items:
        type: object
        properties:
          code:
            type: string
          name:
            type: string
          unit:
            type: string
          forex_buying:
            type: string
          forex_selling:
            type: string
        additionalProperties: true
    source:
      type: string
    version:
      type: string
    source_ref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          const: data
        schemaVersion:
          type: string
          minLength: 1
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
      description: Exact immutable data ref returned by sources_fetch; original source is read inside the plugin, without copying a preview or a workspace JSON line.
    source_provenance:
      type: object
      additionalProperties: true
      description: Original snapshot final URL, retrieval time, content type and hash; parsing is derived evidence, not a new independent source.
    output_truncated:
      type: boolean
      description: True means the complete result is only in result_ref; returned text is a preview.
    result_ref:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        kind:
          const: data
        schemaVersion:
          type: string
          minLength: 1
      required:
        - id
        - revision
        - digest
        - kind
        - schemaVersion
      additionalProperties: false
      description: Exact immutable derived result artifact; use result_entries with host.resources.read. Original source and provenance are retained inside it.
    result_entries:
      type: object
      properties:
        structured:
          const: rows.json
        text:
          const: text.txt
      required:
        - structured
      additionalProperties: false
    result_bytes:
      type: integer
      minimum: 0
    result_preview:
      type: string
      maxLength: 4000
    returned_entries:
      type: integer
      minimum: 0
  additionalProperties: true
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - resources.read
    - process
    - filesystem
    - resources.publish
  binding:
    type: native
    name: parse_fx_xml
  usage:
    purpose: 把已有TCMB汇率XML转成保留单位和买卖方向的输入，供方法/工作流复用。
    inputs: 三选一：{source_ref:<sources_fetch返回的完整ref>}，或{xml_content:<完整文本>}，或{file_path:<包内相对样本路径>}；其余筛选参数按Schema。source_ref由插件按字节分页读取；不要把20000字符预览或data_read工作区路径代替原文。inline输入上限2MiB UTF-8；source_ref原始字节上限2MiB，按原编码解码后上限8MiB UTF-8。
    outputs: JSON返回provider/base/date/total_currencies/returned_currencies/rates；XML返回date/bulletin_no/total_currencies/returned_currencies/currencies（code,name,unit,forex_buying,forex_selling）。两者都有source/version。支持旧base/date和官方Open Access的base_code/time_last_update_utc，不把获取时间替代数据日期。 source_ref输入自动返回source_ref、source_provenance（原最终URL、获取时间、原始字节hash、内容类型、编码）；source为最终URL。inline/包内输入的source仅为inline/包内文件名，不推断URL或抓取时间。 超过24KiB的解析结果不直接注入上下文，返回output_truncated:true、result_ref、result_entries、result_bytes及有界预览（汇率保留total_currencies/returned_currencies，完整结构在result_entries.structured，没有text.txt）。读取完整结构时，先查manifest或result_bytes：JSON结构优先用host_resources_read({ref:result_ref,part:"rows",fields:[...]})；需读取原始文本时按大页读取host_resources_read({ref:result_ref,part:"content",entry:result_entries.structured,offset:0,length:49152,encoding:"utf8"})，互不依赖的分段按nextOffset或字节范围在同一轮并行读取，禁止按8KiB逐轮串行试探。预览不能当全文，长结果省略text/entries/rates/currencies；小结果保持完整原字段。
    prerequisites:
      - Existing Python 3 executable (host pythonPath, otherwise python on Windows / python3 on Linux). Only standard-library modules are used; no API key, pip install or network is required for parsing.
      - host.resources.read resolves source_ref and host.process.exec runs the bundled parser using owned temporary files.
      - host.resources.create/publish/remove retain large parsed results as immutable data artifacts; no extra Agent tool is needed.
    limitations:
      - 只支持TCMB格式；样本不是当前报价，不推导股票/K线或其他JSON/XML能力。
      - 解析同一快照不增加独立来源；结果交给方法/工作流，不另开报告。
      - 仅解析传入快照；原来源选择、取证权限和收费/登录限制由获取能力处理。XML条目和汇率不代表实时价格，保留原始日期与覆盖范围。
    examples:
      - input:
          file_path: sample_fx.xml
          codes:
            - USD
            - EUR
        output:
          format: tcmb-xml
          date: 10/02/2026
          bulletin_no: 2026/186
          total_currencies: 22
          returned_currencies: 2
          currencies:
            - code: USD
              name: US DOLLAR
              unit: "1"
              forex_buying: "48.9699"
              forex_selling: "49.0582"
            - code: EUR
              name: EURO
              unit: "1"
              forex_buying: "55.0826"
              forex_selling: "55.1819"
          source: sample_fx.xml
          version: 3.0.0
  requires:
    - id: python-process
      capability: host.process.exec
      reason: Run the bundled standard-library Python parser through the existing host process capability.
