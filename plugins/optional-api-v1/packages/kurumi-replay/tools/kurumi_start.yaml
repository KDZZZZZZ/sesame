name: kurumi_start
title: kurumi_start
description: 只在首次从300000JPY开始挑战；已有挑战只延续实际资金。选已配置openai/gpt-6.1-sol，真实受限子Agent决定后才推进。
inputSchema:
  type: object
  properties:
    command_id:
      type: string
      description: 精确操作幂等ID；重试保持同ID与参数
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]{16,128}$
    expected_version:
      type: integer
      minimum: 0
      description: kurumi_status返回的控制revision，新挑战用0
    max_steps:
      type: integer
      minimum: 1
      maximum: 5000
      description: 本次最多付费角色决定数，省略1；多步需要用户已授权
  required:
    - command_id
    - expected_version
  additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: run
  effects: []
  usage:
    purpose: 只在首次从300000JPY开始挑战；已有挑战只延续实际资金。选已配置openai/gpt-6.1-sol，真实受限子Agent决定后才推进。
    inputs: "{command_id,expected_version,max_steps?:1}; first challenge uses expected_version:0. max_steps bounds requested decision work; later calls retain actual account capital."
    outputs: Current simulation status with revision, runId, state:{chapter,index,status,balance,position,decisions,fills}, control, settings, archive, task, recovery/reconciliation and error; control acceptance is not a completed simulation step.
    prerequisites:
      - Only the main conversation can use spectator/control capabilities. The two player capabilities require the registered current role task.
      - Prepared/probed native matching environment, fixed real data, configured openai/gpt-6.1-sol and archive availability.
    limitations:
      - command_id is stable for identical retries; expected_version is the latest kurumi_status.revision, not engine version. VERSION_CONFLICT requires reading current state before deciding a new operation.
      - Creates real paid restricted role tasks. Missing configured model does not switch to another model. Accepted control can still pause before a step commits.
  binding:
    type: native
    name: kurumi_start
  finalOutputSchema:
    type: object
    additionalProperties: true
