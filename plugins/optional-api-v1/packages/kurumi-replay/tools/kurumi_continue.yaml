name: kurumi_continue
title: kurumi_continue
description: 主Agent继续已存在连续挑战，不充值、不改余额、不改变未来游标；restart必须先核对未知任务。
inputSchema:
  type: object
  properties:
    command_id:
      type: string
      description: 精确操作幂等ID；重试保持同ID与参数
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]{16,128}$
    expected_version:
      type: integer
      minimum: 0
      description: kurumi_status返回的控制revision，新挑战用0
    max_steps:
      type: integer
      minimum: 1
      maximum: 5000
  required:
    - command_id
    - expected_version
  additionalProperties: false
outputSchema:
  type: object
  properties:
    type:
      const: run
    run:
      type: object
    receipt:
      type: object
  required:
    - type
    - run
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: run
  effects: []
  usage:
    purpose: 主Agent继续已存在连续挑战，不充值、不改余额、不改变未来游标；restart必须先核对未知任务。
    inputs: "{command_id,expected_version,max_steps?:1}; continues the existing run; a pending four-H1 continuation uses its original saved decision."
    outputs: Current simulation status with revision, runId, state:{chapter,index,status,balance,position,decisions,fills}, control, settings, archive, task, recovery/reconciliation and error; control acceptance is not a completed simulation step.
    prerequisites:
      - Only the main conversation can use spectator/control capabilities. The two player capabilities require the registered current role task.
      - Existing prepared challenge; any unknown prior role/recovery reconciled.
    limitations:
      - command_id is stable for identical retries; expected_version is the latest kurumi_status.revision, not engine version. VERSION_CONFLICT requires reading current state before deciding a new operation.
      - Does not reset capital or replace the prior intent. Automatic within-block continuation does not ask the model again or reopen a position.
  binding:
    type: native
    name: kurumi_continue
  finalOutputSchema:
    type: object
    additionalProperties: true
