      - id: native_run
        kind: function
        consumers:
          - host
        description: Run the explicitly requested fixed native replay operation.
        inputSchema:
          type: object
          properties:
            action:
              enum:
                - status
                - prepare
                - advance
            state:
              type: object
              additionalProperties: true
            decision:
              type: object
              additionalProperties: true
            data:
              type: object
              additionalProperties: true
          required:
            - action
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: run
        effects: []
        usage:
          purpose: Run the explicitly requested fixed native replay operation.
          inputs: '{action:"status"|"prepare"|"advance",state?,decision?,data?}; owned plugin supplies fixed data/state.'
          outputs: Actual isolated native environment/prepare/advance result with execution evidence or a diagnostic failure.
          prerequisites:
            - Host lifecycle or owning-plugin native dispatch only; never a direct Agent tool.
          limitations:
            - Only nested calls from this owning plugin; no arbitrary shell/code or model-authored source substitution.
