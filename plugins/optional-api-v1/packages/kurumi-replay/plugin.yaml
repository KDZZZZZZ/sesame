      - id: market_bind
        kind: function
        consumers:
          - host
        description: Read revealed simulation market bind
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects: []
        usage:
          purpose: "Host-only market source adapter: bind."
          inputs: "{binding:<host source connection/configuration>}; the host creates and owns this binding."
          outputs: "{bindingId,...source capabilities}; opaque binding retained by host."
          prerequisites:
            - Host source dispatch and an initialized replay service; query/subscribe requires its existing binding.
          limitations:
            - Only revealed simulation evidence; no history advance or broker call. Snapshot pagination consistency does not imply unrestricted future coverage.
        binding:
          type: native
          name: market_bind
