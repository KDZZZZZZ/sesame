formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/trading-decision
title: 交易决策
description: 消费固定研究成果、当前账户与用户风险规则，冻结目标仓位并取得真实执行回执；支持明确授权的周期或事件调度。
version: 3.4.4
license: MIT
engines:
  sesame: ">=0.3.0-dev.2 <0.4.0"
entry: index.js
x-sesame:
  catalog:
    category: "strategy"
    functionalCategory: "business"
    implementationKinds: ["workflow"]
    title:
      en: "Trading decisions and plans"
      zh: "交易决策与计划"
    summary:
      en: "Consume fixed research, current positions and personal risk rules to freeze portfolio decisions and coordinate authorized execution."
      zh: "消费固定研究成果、当前持仓与个人风险规则，冻结目标仓位并协调授权执行。"
    dependencies:
      en: "Configured model, memory, data-access and an exact execution binding. Research is supplied as fixed evidence; no embedded analyst team."
      zh: "需要已配置模型、memory 风险记忆、data-access 和精确执行绑定。研究通过固定成果引用输入，不再内嵌分析师团队。"
  default_state: discoverable
  main_tool_names:
    - trading_decision_plan
    - trading_decision_run
    - trading_decision_event
    - trading_decision_runs
    - trading_decision_activity
  permissions:
    scopes:
      - capabilities.compose
    calls:
      - host.agent.run
      - host.runs.read
      - host.runs.wait
      - host.runs.interrupt
      - host.resources.read
      - sesame/reports#components_show
      - sesame/reports#report_check
      - sesame/workspace#write
      - host.reports.describe
  contributions:
    configSchema:
      type: object
      additionalProperties: false
    capabilities:
      - tool/trading_decision_models
      - tool/trading_decision_plan
      - tool/trading_decision_run
      - tool/trading_decision_event
      - tool/trading_decision_runs
      - tool/trading_decision_activity
      - tool/trading_decision_context
      - tool/trading_decision_check
      - tool/trading_decision_decide
      - tool/trading_decision_apply
      - tool/trading_decision_report
      - tool/trading_decision_review
      - id: activate
        kind: function
        description: Start private plan recovery and scheduler without replaying interrupted execution.
        consumers:
          - host
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
        execution: immediate
        effects:
          - read:trading-checkpoints
          - manage:scheduler
        binding:
          type: native
          name: activate
        usage:
          purpose: Start private plan recovery and scheduler without replaying interrupted execution.
          inputs: Host lifecycle activation payload; no Agent input.
          outputs: Initialization/recovery acknowledgement; reconciles retained plans and enables the existing scheduler.
          prerequisites:
            - Host lifecycle only.
          limitations:
            - Does not replay interrupted execution.
      - id: dispose
        kind: function
        description: Cancel unfinished Runs and close subscriptions and private databases.
        consumers:
          - host
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
        execution: immediate
        effects:
          - cancel:workflow
          - close:private-stores
        binding:
          type: native
          name: dispose
        usage:
          purpose: Cancel unfinished Runs and close subscriptions and private databases.
          inputs: Host lifecycle disposal payload.
          outputs: Cleanup acknowledgement after cancelling active work and closing subscriptions/storage.
          prerequisites:
            - Host lifecycle only.
          limitations:
            - Cleanup retains execution receipts and cannot reverse broker effects.
      - id: trading_decision_workflow_execute
        kind: workflow
        description: "Execute an admitted authorized trading decision: consume fixed research, verify account/risk rules, freeze target, execute and retain actual receipts."
        consumers:
          - host
        inputSchema:
          type: object
          properties:
            runId:
              type: string
              minLength: 1
          required:
            - runId
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            runId:
              type: string
            status:
              type: string
            report:
              type:
                - object
                - "null"
              additionalProperties: true
          required:
            - runId
            - status
            - report
          additionalProperties: false
        execution: run
        effects:
          - start:agents
          - invoke:selected-execution
          - publish:report
          - write:trading-checkpoints
        binding:
          type: native
          name: trading_decision_workflow_execute
        usage:
          purpose: "Execute an admitted authorized trading decision: consume fixed research, verify account/risk rules, freeze target, execute and retain actual receipts."
          inputs: "{runId:<already admitted business run>}."
          outputs: "Accepted host Run; missing dependencies interrupt before Agent dispatch. Resume retains the same Run/session, actual member identities, frozen target and actual execution receipts. Result: {runId,status,report} after the round and archival, including decision-only or review-blocked rounds. Report delivery requires the published artifact; pending or failed archival is not delivery."
          prerequisites:
            - Host workflow admission only; no direct Agent invocation.
          limitations:
            - Host Run cancellation and broker-order cancellation are different operations.
            - Interruptions preserve checkpoints and do not publish a final failure report. Unknown external execution outcomes require reconciliation and are never resent automatically.
        resumable: true
        requires:
          - id: selected-workflow-dependencies
            capability: sesame/trading-decision#trading_decision_workflow_dependencies
            input:
              runId:
                $ref: input#/runId
            reason: Check frozen declarations and local state before workflow admission or resume; live native observation is performed and validated during workflow execution.
      - id: trading_decision_workflow_dependencies
        kind: function
        consumers:
          - host
        description: Check frozen model/plugin declarations, retained execution state, memory/fixed-data capabilities and pinned research artifacts. This read-only readiness probe does not observe a live account or invoke its native transport.
        inputSchema:
          type: object
          properties:
            runId:
              type: string
              minLength: 1
          required:
            - runId
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            available:
              type: boolean
            reason:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
            - available
          additionalProperties: false
        execution: immediate
        effects:
          - read
        binding:
          type: native
          name: trading_decision_workflow_dependencies
        usage:
          purpose: Check frozen model/plugin declarations, retained execution state, memory/fixed-data capabilities and pinned research artifacts. This read-only readiness probe does not observe a live account or invoke its native transport.
          inputs: "{runId:<saved business run ID>}; the host maps this from the workflow input."
          outputs: "{available,reason?,details?}; availability applies only to frozen declarations and local state. details.liveObservation is not-probed; no native adapter/evaluator, model call or business mutation is performed."
          prerequisites:
            - Saved business run with frozen configuration; called by the host before workflow execution.
          limitations:
            - This probe never calls a live snapshot. The actual workflow validates native account/coverage before pending decision work or writes; an already sent execution without a saved receipt remains blocked for reconciliation.
    sources: []
    services: []
    knowledge:
      - id: instructions
        path: instructions.md
        description: Fixed research consumption, personal risk rules, authorized target decisions and actual execution.
        kind: prompt
      - id: README.md
        path: README.md
        description: README.md
        kind: reference
      - id: PROVENANCE.md
        path: PROVENANCE.md
        description: PROVENANCE.md
        kind: reference
      - id: COMPOSITION.md
        path: COMPOSITION.md
        description: COMPOSITION.md
        kind: reference
      - id: skills-trading-decision-SKILL.md
        path: skills/trading-decision/SKILL.md
        description: skills/trading-decision/SKILL.md
        kind: skill
    stateCollections: []
    views: []
    hooks:
      - id: activate
        contract: sesame.lifecycle/1
        event: lifecycle.activate
        consumer: host
        configSchema:
          type: object
          additionalProperties: false
        operations:
          handle: activate
      - id: dispose
        contract: sesame.lifecycle/1
        event: lifecycle.dispose
        consumer: host
        configSchema:
          type: object
          additionalProperties: false
        operations:
          handle: dispose
    artifactSchemas:
      - kind: report
        schemaVersion: 1.0.0
        schema:
          type: object
          required:
            - schemaVersion
            - title
            - summary
            - entry
            - runtime
            - runtimeRevision
            - data
            - related
            - features
            - locale
            - provenance
          properties:
            schemaVersion:
              const: 1.0.0
            title:
              type: string
            summary:
              type: string
            entry:
              const: report.html
            runtime:
              const: sesame-report/1
            runtimeRevision:
              const: 1.0.0
            data:
              type: array
            related:
              type: array
            features:
              type: array
            locale:
              type: string
            provenance:
              type: object
          additionalProperties: false
        id: workflow-report
