formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/abu-similarity
title: 同期收益相似性基线
description: 时间对齐的收益相关、秩相关和方向相似性。这是可改进基线而非标准答案；输入显式来源和截止时点，输出可复核研究结果。 自动冻结输入与结果数据工件，用户可复核。
version: 2.0.3
license: GPL-3.0-only
engines:
  sesame: ">=0.2.3"
author:
  name: Sesame contributors; ABU reference by bbfamily / 阿布
entry: index.js
x-sesame:
  catalog:
    category: "research"
    functionalCategory: "analysis"
    implementationKinds: ["function"]
    title:
      en: "Concurrent return similarity"
      zh: "同期收益相似性"
    summary:
      en: "Compare returns with exactly matching start/end timestamps using Pearson, Spearman and sign agreement; does not retrieve historical scenarios or predict probabilities."
      zh: "以完全相同起止时点对齐收益，计算Pearson、Spearman与方向一致率；不检索历史情景或预测概率。"
    dependencies:
      en: "Node.js and explicit fixed, time-labelled inputs. Research output is not a native backtest or executable order."
      zh: "需要 Node.js 与明确来源、截止时点的固定输入。研究结果不等同于原生回测或可执行订单。"
  default_state: discoverable
  agent_scope: all
  prompts:
    - instructions.md
  skills:
    - skills
  resources:
    - LICENSE
    - PROVENANCE.md
    - README.md
    - examples/input.json
    - scripts/baseline.mjs
    - scripts/runtime.mjs
    - references/method.md
  provides: {}
  contributions:
    capabilities:
      - tool/abu_similarity_analyze
    sources: []
    views: []
    services: []
    knowledge:
      - id: knowledge-0
        path: examples/input.json
        description: 市场相似性基线 — examples/input.json
        kind: reference
      - id: knowledge-1
        path: instructions.md
        description: abu_similarity_analyze 的局部目标、解释边界和跨方法交接。
        kind: prompt
      - id: knowledge-2
        path: PROVENANCE.md
        description: 市场相似性基线 — PROVENANCE.md
        kind: reference
      - id: knowledge-3
        path: README.md
        description: 市场相似性基线 — README.md
        kind: reference
      - id: knowledge-4
        path: references/method.md
        description: abu_similarity_analyze 的公式、参数口径与基线差异；核对是否可以复用其他已计算结果。
        kind: reference
      - id: knowledge-5
        path: skills/abu-similarity/SKILL.md
        description: 数值方法：比较已提供标的在相同相邻时间区间的收益相关、秩相关和方向相似性。 输入为已固定证据；输出为 observations 与输入/结果工件，供方法解释或工作流复用。
        kind: skill
    hooks: []
    stateCollections: []
