name: qmt_execution_identity
title: qmt_execution_identity
description: Guarded native execution adapter identity. Retains raw audit receipts; unknown outcomes never authorize resend.
inputSchema:
  type: object
  properties: {}
  required: []
  additionalProperties: false
outputSchema:
  type: object
  properties:
    contract:
      const: sesame.execution-adapter/1
      type: string
    backend:
      const: qmt
      type: string
    account:
      type: object
      properties:
        accountId:
          type: string
          minLength: 1
        connectionId:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
      required:
        - accountId
        - connectionId
        - revision
      additionalProperties: false
  required:
    - contract
    - backend
    - account
  additionalProperties: false
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - state.read
  usage:
    purpose: sesame.execution-adapter/1 identity; native SDK mechanics stay in this adapter.
    inputs: Use the declared normalized operation input, exact account/revision and retained operation IDs.
    outputs: Versioned adapter projection plus unchanged raw native evidence. Snapshot/identity do not establish permission or broker readiness.
    prerequisites:
      - Delegated access requires a matching frozen execution task; writes additionally require a live workflow-to-portfolio apply invocation chain.
    limitations:
      - No broker acceptance is inferred from a declaration. Missing history never proves no submission.
  binding:
    type: native
    name: qmt_execution_identity
