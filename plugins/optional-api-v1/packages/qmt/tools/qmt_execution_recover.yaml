name: qmt_execution_recover
title: qmt_execution_recover
description: Guarded native execution adapter recover. Retains raw audit receipts; unknown outcomes never authorize resend.
inputSchema:
  type: object
  properties:
    record:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        backend:
          const: qmt
        account:
          type: object
          properties:
            accountId:
              type: string
              minLength: 1
            connectionId:
              type: string
              minLength: 1
            revision:
              type: string
              minLength: 1
          required:
            - accountId
            - connectionId
            - revision
          additionalProperties: false
        backendCommandId:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        action:
          enum:
            - market
            - limit
            - close
        side:
          enum:
            - buy
            - sell
        createdAt:
          type: integer
        remark:
          type: string
          minLength: 1
        quantity:
          type: string
          minLength: 1
        planExecution:
          type: boolean
      required:
        - backend
        - account
      additionalProperties: true
    expectedCurrent:
      type: object
      properties:
        accountId:
          type: string
          minLength: 1
        connectionId:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
      required:
        - accountId
        - connectionId
        - revision
      additionalProperties: false
  required:
    - record
  additionalProperties: false
outputSchema:
  type: object
  properties:
    contract:
      const: sesame.execution-adapter/1
      type: string
    backend:
      const: qmt
      type: string
    command:
      type: object
      additionalProperties: true
    receipt:
      type: object
      properties:
        contract:
          const: sesame.execution-adapter/1
          type: string
        backend:
          const: qmt
          type: string
        status:
          enum:
            - submitted
            - cancel_requested
            - rejected
            - partially_filled
            - execution_reported
            - outcome_unknown
        submissionAttempted:
          type:
            - boolean
            - "null"
        raw:
          type: object
          additionalProperties: true
        timing:
          type: object
          additionalProperties: true
      required:
        - contract
        - backend
        - status
        - submissionAttempted
        - raw
      additionalProperties: false
    orders:
      type: array
      items:
        type: object
        additionalProperties: true
    historicalOrders:
      type: array
      items:
        type: object
        additionalProperties: true
    deals:
      type: array
      items:
        type: object
        additionalProperties: true
    positions:
      type: array
      items:
        type: object
        additionalProperties: true
    coverage:
      type: string
      minLength: 1
    complete:
      type: boolean
      const: false
    historyCoverage:
      type: object
      additionalProperties: true
  required:
    - contract
    - backend
    - command
    - receipt
    - orders
    - historicalOrders
    - deals
    - positions
    - coverage
    - complete
  additionalProperties: false
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - backend.read
    - network
    - process
  usage:
    purpose: sesame.execution-adapter/1 recover; native SDK mechanics stay in this adapter.
    inputs: Use the declared normalized operation input, exact account/revision and retained operation IDs.
    outputs: Versioned adapter projection plus unchanged raw native evidence. Snapshot/identity do not establish permission or broker readiness.
    prerequisites:
      - Delegated access requires a matching frozen execution task; writes additionally require a live workflow-to-portfolio apply invocation chain.
    limitations:
      - No broker acceptance is inferred from a declaration. Missing history never proves no submission.
  binding:
    type: native
    name: qmt_execution_recover
