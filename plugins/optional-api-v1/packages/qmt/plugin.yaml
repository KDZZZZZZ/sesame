        binding:
          type: native
          name: account_snapshot
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable.
          - field: account_id
            reason: Account reads and commands target the explicitly configured STOCK account.
          - field: userdata_directory
