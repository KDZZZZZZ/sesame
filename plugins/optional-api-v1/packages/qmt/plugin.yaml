        binding:
          type: native
          name: qmt_dispose
      - id: positions_close
        kind: function
        consumers:
          - host
        description: Close confirmed native STOCK shares using a fresh best-bid limit and the native account/position/quote guard. Retain uncertain receipts before dispatch; never resend them.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              properties:
                connection:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 300
                    revision:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - id
                    - revision
                  additionalProperties: false
                account:
                  type: object
                  properties:
                    connectionId:
                      type: string
                      minLength: 1
                      maxLength: 300
                    accountId:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - connectionId
                    - accountId
                  additionalProperties: false
              required:
                - connection
                - account
              additionalProperties: false
            positionId:
              type: string
              minLength: 1
              maxLength: 300
            quantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            operationId:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,100}$
            expected:
              type: object
              properties:
                revision:
                  type: string
                  minLength: 1
                  maxLength: 300
                instrument:
                  type: object
                  properties:
                    sourceId:
                      type: string
                      minLength: 1
                      maxLength: 300
                    instrumentId:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
                side:
                  type: string
                  minLength: 1
                  maxLength: 300
                quantity:
                  type: object
                  properties:
                    value:
                      type: string
                      pattern: ^(0|[1-9]\d*)(\.\d+)?$
                      maxLength: 100
                    unit:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - value
                    - unit
                  additionalProperties: false
              required:
                - revision
                - instrument
                - side
                - quantity
              additionalProperties: false
          required:
            - binding
            - positionId
            - operationId
            - expected
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            operationId:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,100}$
            positionId:
              type: string
              minLength: 1
              maxLength: 300
            status:
              enum:
                - submitted
                - partially_filled
                - filled
                - closed
                - rejected
                - outcome_unknown
            requestedQuantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            filledQuantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            remainingPositionQuantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            orderIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 300
              maxItems: 100
            observedAt:
              type: integer
              minimum: 0
            error:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 300
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
              required:
                - code
                - message
              additionalProperties: false
          required:
            - operationId
            - positionId
            - status
            - requestedQuantity
            - observedAt
          additionalProperties: false
        execution: immediate
        effects:
          - external-trading
          - plugin.state.write
        usage:
          purpose: 执行账户页确认的手动平仓。
          inputs: "{binding:{connection:{id,revision},account:{connectionId,accountId}},positionId,operationId,expected:{revision,instrument:{sourceId,instrumentId},side,quantity:{value,unit}},quantity?}；expected来自用户确认的账户页持仓，quantity省略表示确认数量。"
          outputs: "{operationId,positionId,status,requestedQuantity,observedAt,filledQuantity?,remainingPositionQuantity?,orderIds?,dealIds?,error?}；status=closed|filled|partially_filled|submitted|rejected|outcome_unknown；closed确认持仓已全平，filled仅确认本次数量已完成。"
          prerequisites:
            - 仅宿主已确认的主会话账户UI可调用；普通Agent使用公开portfolio能力，不能自行伪造UI provenance。
          limitations:
            - 提交真实减仓意图；同ID同输入仅取原回执，账户/数量变化会拒绝。
            - submitted/unknown不表示平仓完成；有未确认操作时先核对原回执，不能换ID重复。
            - 只卖可卖股票，受T+1及新鲜bid限制；没有原生order_id不按持仓变化猜成交。
        binding:
          type: native
          name: positions_close
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
          - field: account_id
            reason: Account reads and commands target the explicitly configured STOCK account. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
          - field: userdata_directory
            reason: Account access uses the existing broker MiniQMT userdata_mini directory. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
          - field: market_port
            reason: Native market reads use the explicitly configured MiniQMT localhost port. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
      - id: positions_read_receipt
        kind: function
        consumers:
          - host
        description: Read the retained close and exact current-day native order ID; verify fills and actual remaining positions without sending an order.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              properties:
                connection:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 300
                    revision:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - id
                    - revision
                  additionalProperties: false
                account:
                  type: object
                  properties:
                    connectionId:
                      type: string
                      minLength: 1
                      maxLength: 300
                    accountId:
                      type: string
                      minLength: 1
                      maxLength: 300
                  required:
                    - connectionId
                    - accountId
                  additionalProperties: false
              required:
                - connection
                - account
              additionalProperties: false
            operationId:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,100}$
          required:
            - binding
            - operationId
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            operationId:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,100}$
            positionId:
              type: string
              minLength: 1
              maxLength: 300
            status:
              enum:
                - submitted
                - partially_filled
                - filled
                - closed
                - rejected
                - outcome_unknown
            requestedQuantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            filledQuantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            remainingPositionQuantity:
              type: object
              properties:
                value:
                  type: string
                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 300
              required:
                - value
                - unit
              additionalProperties: false
            orderIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 300
              maxItems: 100
            observedAt:
              type: integer
              minimum: 0
            error:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 300
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
              required:
                - code
                - message
              additionalProperties: false
          required:
            - operationId
            - positionId
            - status
            - requestedQuantity
            - observedAt
          additionalProperties: false
        execution: immediate
        effects:
          - network
          - plugin.state.write
        usage:
          purpose: 核对账户页平仓的已保留回执。
          inputs: "{binding:{connection:{id,revision},account:{connectionId,accountId}},operationId:<已有平仓键>}。"
          outputs: "{operationId,positionId,status,requestedQuantity,observedAt,filledQuantity?,remainingPositionQuantity?,orderIds?,dealIds?,error?}；status=closed|filled|partially_filled|submitted|rejected|outcome_unknown；closed确认持仓已全平，filled仅确认本次数量已完成。"
          prerequisites:
            - 仅宿主已确认的主会话账户UI可调用；普通Agent使用公开portfolio能力，不能自行伪造UI provenance。
          limitations:
            - 读取可刷新原生证据，不发补单。
            - submitted/unknown不表示平仓完成；有未确认操作时先核对原回执，不能换ID重复。
            - 只卖可卖股票，受T+1及新鲜bid限制；没有原生order_id不按持仓变化猜成交。
        binding:
          type: native
          name: positions_read_receipt
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
          - field: account_id
            reason: Account reads and commands target the explicitly configured STOCK account. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
          - field: userdata_directory
            reason: Account access uses the existing broker MiniQMT userdata_mini directory. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
          - field: market_port
            reason: Native market reads use the explicitly configured MiniQMT localhost port. Retained receipts remain readable without a fresh native call; the existing operation guards apply when a native call is needed.
            optional: true
      - id: configuration.read
        kind: function
        consumers:
          - host
        description: Read only the saved QMT configuration for the shared settings catalog. No path discovery, SDK probe, process, terminal or broker connection is performed.
        inputSchema:
          type: object
          properties: {}
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - state.read
        usage:
          purpose: 统一配置入口读取现有 QMT 配置。
          inputs: "{}"
          outputs: "{configuration:{id,version,connection_id,python_path,userdata_directory,account_id,broker,market_port,sector}}"
          prerequisites: []
          limitations:
            - 配置存在不代表 SDK、行情或账户已经连接；读取不会发现 Python 候选或执行健康探测。
        binding:
          type: native
          name: configuration.read
      - id: configuration.update
        kind: function
        consumers:
          - host
        description: Main-conversation immediate adapter for shared QMT settings. Maps command_id to the existing operation_id and preserves the original configuration CAS, validation and receipt authority.
        inputSchema:
          type: object
          required:
            - command_id
            - expected_version
            - changes
          properties:
            expected_version:
              type: integer
              minimum: 1
            changes:
              type: object
              properties:
                python_path:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                userdata_directory:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                account_id:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                broker:
                  anyOf:
                    - type: string
                      minLength: 1
                    - type: "null"
                market_port:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 65535
                    - type: "null"
                sector:
                  type: string
                  description: Existing native stock catalog sector; default 沪深京A股
                  minLength: 1
                  maxLength: 20000
              additionalProperties: false
            command_id:
              type: string
              minLength: 16
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
              description: Stable command identity, mapped unchanged to the existing QMT configuration operation ID
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.state.write
        usage:
          purpose: 统一配置入口沿用原 QMT 配置保存流程。
          inputs: "{command_id,expected_version,changes}；changes 与 qmt_configure 相同。"
          outputs: 原 qmt_configure 保存结果；相同 command_id 和输入复用原回执。
          prerequisites:
            - 主会话即时执行；使用当前配置版本和已存在的路径。
          limitations:
            - 不安装 SDK、不启动终端、不登录或下单；保存配置不构成交易授权。原 qmt_configure 与 qmt_environment 接口保持不变。
        binding:
          type: native
          name: configuration.update
      - tool/qmt_execution_identity
      - tool/qmt_execution_snapshot
      - tool/qmt_execution_prepare
      - tool/qmt_execution_submit
      - tool/qmt_execution_recover
      - tool/qmt_execution_command
      - tool/qmt_execution_cancel
