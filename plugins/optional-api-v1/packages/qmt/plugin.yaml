formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/qmt
title: QMT 行情与股票账户
description: 可选 Windows MiniQMT：A股日线、报价、股票账户、当日委托成交，以及显式授权的限价下单和撤单。既有配置优先；缺失依赖按需准备。
version: 2.1.1
license: MIT
engines:
  sesame: ">=0.3.0-dev.1 <0.4.0"
entry: index.js
x-sesame:
  default_state: discoverable
  main_tool_names:
    - qmt_environment
    - qmt_configure
    - qmt_download_history
    - qmt_order
    - qmt_cancel
    - qmt_command
  prompts:
    - instructions.md
  skills:
    - skills
  resources:
    - README.md
    - requirements.txt
    - TRADING.md
  contributions:
    configSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/qmt_environment
      - tool/qmt_configure
      - tool/qmt_read
      - tool/qmt_download_history
      - tool/qmt_order
      - tool/qmt_cancel
      - tool/qmt_command
      - tool/qmt_trading_context
      - tool/qmt_trading_order
      - tool/qmt_trading_cancel
      - tool/qmt_trading_command
      - id: market_bind
        kind: function
        consumers:
          - host
        description: QMT market bind from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              properties:
                connection:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    revision:
                      type: string
                      minLength: 1
                  required:
                    - id
                    - revision
                  additionalProperties: false
              required: []
              additionalProperties: false
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.write
        usage:
          purpose: 为宿主建立精确行情来源会话；不代表已取得报价。
          inputs: "{binding:{}} 使用已保存 QMT 配置；也可带 inspect/公开查询返回的精确 connection:{id,revision}，不会枚举或切换另一账户。"
          outputs: '{bindingId,connection:{id,revision},sourceId,health:"configured",limitations}；实际数据可用性以原生读取为准，不启动终端。'
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/qmt#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - connection.id/revision 来自当前绑定或公开查询的 metadata.connection，不等于插件 source.revision。STALE_REVISION/CONNECTION_CHANGED 时重新取得当前身份；不能猜账号、版本或静默切换来源。
        binding:
          type: native
          name: market_bind
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable.
      - id: market_unbind
        kind: function
        consumers:
          - host
        description: QMT market unbind from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.write
        usage:
          purpose: 释放宿主创建的行情绑定。
          inputs: '{binding:<bind返回的含bindingId对象>}；例 {binding:{bindingId:"host-owned-id"}}。'
          outputs: "{closed:true}；释放该绑定与其分页状态。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/qmt#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - 仅释放本次来源会话，不是平仓或停终端。
        binding:
          type: native
          name: market_unbind
      - id: market_searchInstruments
        kind: function
        consumers:
          - host
        description: QMT market searchInstruments from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                query:
                  type: string
                assetClasses:
                  type: array
                  items:
                    type: string
                    minLength: 1
                venues:
                  type: array
                  items:
                    type: string
                    minLength: 1
              required: []
              additionalProperties: false
            page:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                cursor:
                  type: string
                  minLength: 1
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
            - page
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - process
          - network
        usage:
          purpose: 检索该明确来源的真实品种；返回 ref 是后续 instrument 的来源。
          inputs: '{binding:<bind结果>,query:{query:"000001",assetClasses?,venues?},page:{limit:20,cursor?}}；limit≤200，cursor 仅沿用同一来源/过滤条件。'
          outputs: "{items:[{ref:{sourceId,instrumentId},symbol,name,assetClass,venue?}],nextCursor?,metadata:{snapshotId?,consistency?,meta,connection?}}；空 items 仅是该次检索无匹配。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/qmt#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - connection.id/revision 来自当前绑定或公开查询的 metadata.connection，不等于插件 source.revision。STALE_REVISION/CONNECTION_CHANGED 时重新取得当前身份；不能猜账号、版本或静默切换来源。
            - 本地未复权D1历史；历史缺口可通过明确 qmt_download_history 补充。原生成交量单位不猜测；没有账户订阅/标准委托成交历史能力。
        binding:
          type: native
          name: market_searchInstruments
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable.
          - field: market_port
            reason: Native market reads use the explicitly configured MiniQMT localhost port.
          - field: sector
            reason: Stock search uses the saved sector and preserves its existing 沪深京A股 default.
            optional: true
      - id: market_describeInstrument
        kind: function
        consumers:
          - host
        description: QMT market describeInstrument from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instrument:
                  type: object
                  properties:
                    sourceId:
                      type: string
                      minLength: 1
                    instrumentId:
                      type: string
                      minLength: 1
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
              required:
                - instrument
              additionalProperties: false
            page:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                cursor:
                  type: string
                  minLength: 1
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
            - page
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - process
          - network
        usage:
          purpose: 读取具体品种的价格/数量单位、时间基准和支持周期。
          inputs: '{binding:<bind结果>,query:{instrument:{sourceId:"qmt:<configured connection_id>",instrumentId:"000001.SZ"}}}；实际 instrument 用 search 返回 ref。'
          outputs: "{items:[{ref,symbol,name,assetClass,price,quantity,volume,timeBasis,calendar,features,native}],metadata:{meta,connection?}}；unknown/unsupported 字段保留，features 决定支持的 spec。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/qmt#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - 本地未复权D1历史；历史缺口可通过明确 qmt_download_history 补充。原生成交量单位不猜测；没有账户订阅/标准委托成交历史能力。
        binding:
          type: native
          name: market_describeInstrument
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable.
          - field: market_port
            reason: Native market reads use the explicitly configured MiniQMT localhost port.
      - id: market_queryBars
        kind: function
        consumers:
          - host
        description: QMT market queryBars from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instrument:
                  type: object
                  properties:
                    sourceId:
                      type: string
                      minLength: 1
                    instrumentId:
                      type: string
                      minLength: 1
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
                spec:
                  type: object
                  properties:
                    timeframe:
                      type: string
                      minLength: 1
                    priceBasis:
                      enum:
                        - bid
                        - ask
                        - mid
                        - last
                    adjustment:
                      enum:
                        - none
                        - forward
                        - backward
                    session:
                      type: string
                      minLength: 1
                    calendarRevision:
                      type: object
                      additionalProperties: true
                  required:
                    - timeframe
                    - priceBasis
                    - adjustment
                    - session
                    - calendarRevision
                  additionalProperties: false
                range:
                  type: object
                  properties:
                    from:
                      anyOf:
                        - type: object
                          properties:
                            basis:
                              const: utc
                            unixMs:
                              type: integer
                          required:
                            - basis
                            - unixMs
                          additionalProperties: false
                        - type: object
                          properties:
                            basis:
                              const: wall
                            authority:
                              type: string
                              minLength: 1
                            zone:
                              type: string
                              minLength: 1
                            value:
                              type: string
                              minLength: 1
                            fold:
                              type: integer
                          required:
                            - basis
                            - authority
                            - value
                          additionalProperties: false
                    to:
                      anyOf:
                        - type: object
                          properties:
                            basis:
                              const: utc
                            unixMs:
                              type: integer
                          required:
                            - basis
                            - unixMs
                          additionalProperties: false
                        - type: object
                          properties:
                            basis:
                              const: wall
                            authority:
                              type: string
                              minLength: 1
                            zone:
                              type: string
                              minLength: 1
                            value:
                              type: string
                              minLength: 1
                            fold:
                              type: integer
                          required:
                            - basis
                            - authority
                            - value
                          additionalProperties: false
                  required:
                    - from
                    - to
                  additionalProperties: false
                includeForming:
                  type: boolean
                direction:
                  enum:
                    - forward
                    - backward
              required:
                - instrument
                - spec
                - range
              additionalProperties: false
            page:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                cursor:
                  type: string
                  minLength: 1
              required:
                - limit
              additionalProperties: false
          required:
            - binding
            - query
            - page
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - process
          - network
        usage:
          purpose: 读取有界历史柱和真实覆盖证据，供宿主查询/冻结。
          inputs: '{binding:<bind结果>,query:{instrument:<search.ref>,spec:<describe支持的spec>,range:{from:<SourceTime>,to:<SourceTime>},includeForming:false,direction:"forward"},page:{limit:100,cursor?}}。仅 timeframe=1d、priceBasis=last、adjustment=none、session=regular|default、calendarRevision:{status:"unknown"}。range 为 UTC 或 Asia/Shanghai wall SourceTime，最多10年；只读本地历史。'
          outputs: "{items:[{id,revision,openTime,endTime,open,high,low,close,volume,isClosed,closure}],nextCursor?,metadata:{seriesId,instrument,spec,coverage,snapshotId,consistency,meta,connection?}}；OHLC 是十进制字符串，volume 自带单位/未知状态；无 nextCursor 只说明本次快照分页结束。"
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/qmt#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - coverage.complete:false 表示覆盖未获证明，可使用已返回的真实行并保留限制，不能改成 true 或当作空数据/请求失败。历史查询成功不证明实时订阅或图表渲染成功。
            - 本地未复权D1历史；历史缺口可通过明确 qmt_download_history 补充。原生成交量单位不猜测；没有账户订阅/标准委托成交历史能力。
        binding:
          type: native
          name: market_queryBars
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable.
          - field: market_port
            reason: Native market reads use the explicitly configured MiniQMT localhost port.
      - id: market_subscribeBars
        kind: function
        consumers:
          - host
        description: QMT market subscribeBars from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instrument:
                  type: object
                  properties:
                    sourceId:
                      type: string
                      minLength: 1
                    instrumentId:
                      type: string
                      minLength: 1
                  required:
                    - sourceId
                    - instrumentId
                  additionalProperties: false
                spec:
                  type: object
                  properties:
                    timeframe:
                      type: string
                      minLength: 1
                    priceBasis:
                      enum:
                        - bid
                        - ask
                        - mid
                        - last
                    adjustment:
                      enum:
                        - none
                        - forward
                        - backward
                    session:
                      type: string
                      minLength: 1
                    calendarRevision:
                      type: object
                      additionalProperties: true
                  required:
                    - timeframe
                    - priceBasis
                    - adjustment
                    - session
                    - calendarRevision
                  additionalProperties: false
                tailLimit:
                  type: integer
                  minimum: 1
                  maximum: 2000
                includeForming:
                  type: boolean
                resumeToken:
                  type: string
                  minLength: 1
              required:
                - instrument
                - spec
                - tailLimit
              additionalProperties: false
          required:
            - binding
            - query
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - process
          - network
          - plugin.session.write
        usage:
          purpose: 为宿主持续提供初始行情快照及增量。
          inputs: '{binding:<bind结果>,query:{instrument:<search.ref>,spec:<describe支持的spec>,tailLimit:100,includeForming:true}}；不传历史range或复用分页cursor，tailLimit正整数≤2000；恢复使用新快照。仅 timeframe=1d、priceBasis=last、adjustment=none、session=regular|default、calendarRevision:{status:"unknown"}。'
          outputs: '{id,events:AsyncIterable,close}；首帧 {type:"snapshot",snapshot:{seriesId,instrument,spec,bars,coverage,meta?},position:{streamId,epoch,seq},consistency,recovery:"snapshot"}；后续 {streamId,epoch,seq,eventId,schemaVersion,observedAt,type,payload}，type 为 bars.upsert/bars.closed（按源能力）或 stream.gap。position/consistency/recovery 平铺在首帧，不嵌入 metadata。'
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/qmt#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - 1秒目标轮询，受原生请求耗时影响；日柱不是分钟柱，报价保留原生时间。
            - 订阅由宿主绑定、取消和释放，Agent 不持有 bindingId。stream.gap/RESYNC_REQUIRED 可按同一来源重新取得快照；具体 SCHEMA_MISMATCH 或首帧 position 缺失是协议问题，反复重绑、新建图或启用无关服务不能修复。
            - coverage.complete:false 表示覆盖未获证明，可使用已返回的真实行并保留限制，不能改成 true 或当作空数据/请求失败。历史查询成功不证明实时订阅或图表渲染成功。
        binding:
          type: native
          name: market_subscribeBars
        transport: subscription
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable.
          - field: market_port
            reason: Native market reads use the explicitly configured MiniQMT localhost port.
      - id: market_subscribeQuotes
        kind: function
        consumers:
          - host
        description: QMT market subscribeQuotes from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              additionalProperties: true
            query:
              type: object
              properties:
                instruments:
                  type: array
                  items:
                    type: object
                    properties:
                      sourceId:
                        type: string
                        minLength: 1
                      instrumentId:
                        type: string
                        minLength: 1
                    required:
                      - sourceId
                      - instrumentId
                    additionalProperties: false
                  minItems: 1
                  maxItems: 5
                resumeToken:
                  type: string
                  minLength: 1
              required:
                - instruments
              additionalProperties: false
          required:
            - binding
            - query
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - process
          - network
          - plugin.session.write
        usage:
          purpose: 给宿主提供有来源时间和新鲜度边界的报价快照轮询。
          inputs: '{binding:<bind结果>,query:{instruments:[{sourceId:"qmt:<configured connection_id>",instrumentId:"000001.SZ"}]}}；数量限制 1–50，不支持 resumeToken；实际引用来自 search。'
          outputs: '{id,events:AsyncIterable,close}；首帧 {type:"snapshot",snapshot:{quotes,meta},position:{streamId,epoch,seq},consistency,recovery:"snapshot"}，随后 quotes.upsert 或 stream.gap；报价字段用 value/unknown 状态表达。'
          prerequisites:
            - Agent 使用 data_providers({contract:"sesame.market/1"}) 返回的 sesame/qmt#market 精确 ref，经 market_instruments 搜索/描述，再按任务使用 market_read 或 canvas_binding/canvas_apply；本 capability 仅供宿主数据适配层调用。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - 1秒目标轮询，受原生请求耗时影响；日柱不是分钟柱，报价保留原生时间。
            - 订阅由宿主绑定、取消和释放，Agent 不持有 bindingId。stream.gap/RESYNC_REQUIRED 可按同一来源重新取得快照；具体 SCHEMA_MISMATCH 或首帧 position 缺失是协议问题，反复重绑、新建图或启用无关服务不能修复。
            - 本地未复权D1历史；历史缺口可通过明确 qmt_download_history 补充。原生成交量单位不猜测；没有账户订阅/标准委托成交历史能力。
        binding:
          type: native
          name: market_subscribeQuotes
        transport: subscription
        configurationRequirements:
          - field: python_path
            reason: Native QMT calls use the saved existing Windows Python executable.
          - field: market_port
            reason: Native market reads use the explicitly configured MiniQMT localhost port.
      - id: account_bind
        kind: function
        consumers:
          - host
        description: QMT account bind from the configured native broker source.
        inputSchema:
          type: object
          properties:
            binding:
              type: object
              properties:
                connection:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    revision:
                      type: string
                      minLength: 1
                  required:
                    - id
                    - revision
                  additionalProperties: false
              required: []
              additionalProperties: false
          required:
            - binding
          additionalProperties: false
        outputSchema:
          type: object
          additionalProperties: true
        execution: immediate
        effects:
          - plugin.session.write
        usage:
          purpose: 为宿主建立精确账户数据绑定。
          inputs: "{binding:{}} 使用已保存 QMT 配置；也可带 inspect/公开查询返回的精确 connection:{id,revision}，不会枚举或切换另一账户。"
          outputs: '{bindingId,connection:{id,revision},sourceId,health:"configured",limitations}；实际数据可用性以原生读取为准，不启动终端。'
          prerequisites:
            - 宿主 sesame/qmt#account 数据源专用；普通Agent读取账户使用已声明 portfolio_execution_context 或 qmt_trading_context，原生查询使用该包公开工具。
            - qmt_environment inspect/verify 与 qmt_configure 提供现有 Windows x64 MiniQMT、Python、实际 market_port；股票账户读取还需已授权 account_id/userdata_mini。
          limitations:
            - connection.id/revision 来自当前绑定或公开查询的 metadata.connection，不等于插件 source.revision。STALE_REVISION/CONNECTION_CHANGED 时重新取得当前身份；不能猜账号、版本或静默切换来源。
        binding:
          type: native
          name: account_bind
        configurationRequirements:
