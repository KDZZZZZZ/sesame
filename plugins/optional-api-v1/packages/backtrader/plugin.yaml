formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/backtrader
title: BACKTRADER optional backend
description: 计算验证能力：消费固定数据与已编写策略运行Cerebro回测或有界optstrategy原生优化，保留各次实际结果与引用；参数选择由工作流负责，不连接实盘。
version: 2.1.0
license: GPL-3.0-or-later
engines:
  sesame: ">=0.3.0-dev.1 <0.4.0"
author:
  name: Sesame contributors
  url: https://github.com/KDZZZZZZ/sesame
entry: index.js
x-sesame:
  default_state: discoverable
  prompts:
    - instructions.md
  skills:
    - skills
  resources:
    - PROVENANCE.md
  permissions:
    scopes:
      - process.execute
    calls:
      - host.process.exec
  contributions:
    configSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/backtrader_environment
      - tool/backtrader_backtest
      - tool/backtrader_optimize
      - tool/backtrader_result
      - id: backtrader_dispose
        kind: function
        consumers:
          - host
        description: Close private plugin storage and owned resources.
        inputSchema:
          type: object
          additionalProperties: true
        outputSchema:
          type: object
          properties:
            closed:
              const: true
          required:
            - closed
          additionalProperties: false
        execution: immediate
        effects:
          - plugin.session.close
        usage:
          purpose: 关闭插件自有资源。
          inputs: 宿主生命周期输入 {}。
          outputs: "{closed:true}。"
          prerequisites:
            - 仅宿主卸载/关闭时调用。
          limitations:
            - 释放插件存储和自有会话/订阅；不删除已发布证据，不结束用户交易终端。
        binding:
          type: native
          name: backtrader_dispose
      - tool/backtrader_operation
    sources: []
    views: []
    services: []
    knowledge:
      - id: documentation-0
        path: instructions.md
        description: "Documentation: prompt.md"
        kind: prompt
      - id: documentation-1
        path: PROVENANCE.md
        description: "Documentation: PROVENANCE.md"
        kind: reference
      - id: documentation-2
        path: README.md
        description: "Documentation: README.md"
        kind: reference
      - id: documentation-3
        path: skills/backtrader-fixed-research/SKILL.md
        description: "Documentation: skills\\backtrader-fixed-research\\SKILL.md"
        kind: skill
      - id: public-interface-contract
        path: INTERFACES.md
        consumers:
          - agent
          - host
        description: "Every declared capability: concrete inputs/outputs, dependency entrypoints, effects, completion evidence and recovery boundaries."
        kind: reference
    hooks:
      - id: dispose
        event: lifecycle.dispose
        contract: sesame.lifecycle/1
        consumer: host
        configSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        operations:
          handle: backtrader_dispose
    stateCollections: []
    artifactSchemas:
      - id: data
        kind: data
        schemaVersion: 1.0.0
        schema:
          type: object
          properties:
            format:
              const: json-rows
            path:
              type: string
              minLength: 1
            rowCount:
              type: integer
              minimum: 0
            columns:
              type: array
            provenance:
              type: object
              additionalProperties: true
          required:
            - format
            - path
            - rowCount
            - columns
            - provenance
          additionalProperties: true
      - id: environment
        kind: environment
        schemaVersion: 1.0.0
        schema:
          type: object
          additionalProperties: true
      - id: resource
        kind: resource
        schemaVersion: 1.0.0
        schema:
          type: object
          additionalProperties: true
      - id: strategy.result
        kind: strategy.result
        schemaVersion: 1.0.0
        schema:
          type: object
          additionalProperties: true
