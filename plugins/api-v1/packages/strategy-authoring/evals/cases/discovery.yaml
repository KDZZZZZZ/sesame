id: strategy-authoring-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/strategy-authoring/skills/strategy-authoring/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/strategy-authoring
  - step: 1
    pointer: /tools/0/name
    equals: strategy_decision
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      required:
        - action
      properties:
        action:
          anyOf:
            - type: string
              const: models
            - type: string
              const: submit
            - type: string
              const: status
            - type: string
              const: cancel
            - type: string
              const: invalidate
            - type: string
              const: timeline
            - type: string
              const: bridge_start
            - type: string
              const: bridge_stop
        request_path:
          type: string
          description: Workspace JSON decision request conforming to references/agent-inputs.md
          minLength: 1
          maxLength: 20000
        job_id:
          type: string
          description: Job ID returned by submit; selects its portfolio run for invalidate/timeline
          minLength: 1
          maxLength: 20000
        wait:
          type: boolean
          description: Wait for this one job to finish; cancellation of the tool wait does not cancel the job
        reason:
          type: string
          description: Reason for cancel or invalidation
          minLength: 1
          maxLength: 20000
        as_of_ms:
          type: integer
          minimum: 0
          description: UTC time for timeline replay or cancel/invalidate; required for historical invalidation
        output_path:
          type: string
          description: Workspace JSON path for the saved immutable decision timeline
          minLength: 1
          maxLength: 20000
        operation_id:
          type: string
          description: Idempotency key to publish a saved timeline as an evidence resource
          minLength: 1
          maxLength: 20000
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# SVL strategy authoring"
