        kind: reference
      - id: strategy-authoring
        path: skills/strategy-authoring/SKILL.md
        description: SVL策略创作方法。
        kind: skill
    hooks:
      - id: activate
        contract: sesame.lifecycle/1
        consumer: host
        configSchema:
          type: object
        event: lifecycle.activate
        operations:
          handle: strategy_activate
      - id: dispose
        contract: sesame.lifecycle/1
        consumer: host
        configSchema:
          type: object
        event: lifecycle.dispose
        operations:
          handle: strategy_dispose
    stateCollections: []
    artifactSchemas:
      - id: strategy-source
        kind: strategy.source
        schemaVersion: 1.0.0
        schema:
          type: object
          required:
            - strategyId
            - sourcePath
            - sourceDigest
            - language
            - languageVersion
          properties:
            strategyId:
              type: string
            sourcePath:
              type: string
            sourceDigest:
              type: string
            language:
              type: string
            languageVersion:
              type: string
      - id: evaluation-resource
        kind: resource
        schemaVersion: 1.0.0
        schema:
          type: object
          required:
            - type
          properties:
            type:
              enum:
                - svl-evaluation
                - strategy-pipeline-evaluation
                - strategy-agent-timeline
