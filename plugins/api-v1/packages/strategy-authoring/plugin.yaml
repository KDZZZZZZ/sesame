        description: 策略语言、方法或可重放示例。
        kind: reference
      - id: reference-4
        path: examples/crossover.svl.json
        description: 策略语言、方法或可重放示例。
        kind: reference
      - id: reference-5
        path: examples/crossover.replay.json
        description: 策略语言、方法或可重放示例。
        kind: reference
      - id: reference-6
        path: references/pipeline.md
        description: 策略语言、方法或可重放示例。
