name: strategy_decision
title: strategy_decision
description: Run an isolated versioned Agent signal or risk decision with the configured model and frozen artifact inputs. Submit is asynchronous; status waits optionally, cancel/invalidate retire requests, timeline exports actual saved outputs without new model calls. Never places orders.
inputSchema:
  type: object
  required:
    - action
  properties:
    action:
      anyOf:
        - type: string
          const: models
        - type: string
          const: submit
        - type: string
          const: status
        - type: string
          const: cancel
        - type: string
          const: invalidate
        - type: string
          const: timeline
        - type: string
          const: bridge_start
        - type: string
          const: bridge_stop
    request_path:
      type: string
      description: Workspace JSON decision request conforming to references/agent-inputs.md
      minLength: 1
      maxLength: 20000
    job_id:
      type: string
      description: Job ID returned by submit; selects its portfolio run for invalidate/timeline
      minLength: 1
      maxLength: 20000
    wait:
      type: boolean
      description: Wait for this one job to finish; cancellation of the tool wait does not cancel the job
    reason:
      type: string
      description: Reason for cancel or invalidation
      minLength: 1
      maxLength: 20000
    as_of_ms:
      type: integer
      minimum: 0
      description: UTC time for timeline replay or cancel/invalidate; required for historical invalidation
    output_path:
      type: string
      description: Workspace JSON path for the saved immutable decision timeline
      minLength: 1
      maxLength: 20000
    operation_id:
      type: string
      description: Idempotency key to publish a saved timeline as an evidence resource
      minLength: 1
      maxLength: 20000
  additionalProperties: false
outputSchema:
  type: object
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - model:complete
    - write:private-records
    - network:local-bridge
    - publish:artifact
    - workspace.write
  resultRetention: summary
  usage:
    purpose: Run an isolated versioned Agent signal or risk decision with the configured model and frozen artifact inputs. Submit is asynchronous; status waits optionally, cancel/invalidate retire requests, timeline exports actual saved outputs without new model calls. Never places orders.
    inputs: models 列模型；submit 用 request_path，格式见 agent-inputs.md；返回 job.id 后 status/cancel/invalidate/timeline 使用 job_id。wait=true 等该作业，历史 timeline/invalidate 指定 as_of_ms；timeline 可 output_path/operation_id 保存。bridge_start/stop 管理本机适配桥。
    outputs: submit/status 返回 id/status/output/decision/error/attempts；timeline 返回已保存判断；models 返回可用模型；bridge_start 返回临时 endpoint/token，bridge_stop 不取消模型作业。
    prerequisites:
      - 服务已激活；submit 需要已配置模型与固定输入引用；无对话记忆或工具权限。
    limitations:
      - 不下单。等待取消不取消作业，须 cancel；失败按 error 和 failurePolicy 处理，不能把未完成判断当有效信号。桥 token 仅给本机适配器，不写报告/成果。
  binding:
    type: native
    name: strategy_decision
