formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/memory
title: 长期记忆
description: 保存有来源的长期记忆；区分个人交易风格、经确认的风险红线与策略认知，自动整理只提出风险候选，主 Agent 管理正式规则。
version: 3.2.0
license: MIT
engines:
  sesame: ">=0.3.0-dev.1 <0.4.0"
entry: index.js
x-sesame:
  default_state: mounted
  prompts:
    - instructions.md
  skills:
    - skills
  execution: native
  main_tool_names:
    - memory_manage
  permissions:
    scopes:
      - workspace.messages.read
    calls:
      - host.messages.query
      - host.sessions.query
      - host.artifacts.query
      - host.model.complete
  contributions:
    configSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/memory_search
      - tool/memory_read
      - tool/memory_trading_context
      - tool/memory_propose
      - tool/memory_mark_used
      - tool/memory_manage
      - id: memory_tree
        kind: function
        consumers:
          - host
        description: 读取长期记忆分类树。
        inputSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        outputSchema:
          type: object
        execution: immediate
        effects:
          - read:memory
        resultRetention: summary
        usage:
          purpose: 读取长期记忆分类树。
          inputs: 空对象；宿主记忆界面读取。
          outputs: "{items,categories} 分类树，节点含 path/count/children。"
          prerequisites:
            - 有效宿主会话。
          limitations:
            - 只读，不创建分类或改变记忆。
        binding:
          type: native
          name: memory_tree
      - id: memory_index
        kind: function
        consumers:
          - host
        description: 读取启动用的有界记忆摘要索引。
        inputSchema:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 30
          required: []
          additionalProperties: false
        outputSchema:
          type: object
        execution: immediate
        effects:
          - read:memory
        resultRetention: summary
        usage:
          purpose: 读取启动用的有界记忆摘要索引。
          inputs: limit 默认20；宿主启动上下文使用有界摘要。
          outputs: "{items,total}；仅当前 hot/warm 记忆的启动摘要。"
          prerequisites:
            - 有效宿主会话。
          limitations:
            - 归档和过期记录不进入索引；需召回时另用 search，不刷新采用时间。
        binding:
          type: native
          name: memory_index
      - id: memory_stats
        kind: function
        consumers:
          - host
        description: 读取维护策略与实际整理回执。
        inputSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        outputSchema:
          type: object
        execution: immediate
        effects:
          - read:memory
        resultRetention: summary
        usage:
          purpose: 读取维护策略与实际整理回执。
          inputs: 空对象；宿主设置/维护界面读取。
          outputs: "{total,states,policy,last_maintenance,maintenance_error,compaction}；policy.version 用于配置修改，compaction 可能为 null。"
          prerequisites:
            - 有效宿主会话。
          limitations:
            - partial/failed 整理回执不表示全部来源处理完成。
        binding:
          type: native
          name: memory_stats
      - id: memory_configure
        kind: function
        consumers:
          - host
        description: 按版本更新记忆保留策略。
        inputSchema:
          type: object
          properties:
            expected_version:
              type: integer
              minimum: 1
            hot_days:
              type: integer
              minimum: 0
            archive_days:
              type: integer
              minimum: 0
            candidate_days:
              type: integer
              minimum: 0
            inferred_low_value_days:
              type: integer
              minimum: 0
            maintenance_interval_ms:
              type: integer
              minimum: 0
          required:
            - expected_version
          additionalProperties: false
        outputSchema:
          type: object
        execution: immediate
        effects:
          - write:memory
        resultRetention: summary
        usage:
          purpose: 按版本更新记忆保留策略。
          inputs: expected_version 来自 stats.policy.version；只补丁 hot_days/archive_days/candidate_days/inferred_low_value_days/maintenance_interval_ms。
          outputs: 持久化后的 policy 与新 version，并运行维护。
          prerequisites:
            - 主会话宿主调用；archive_days>hot_days，inferred_low_value_days=0 关闭自动清理。
          limitations:
            - 可能按新策略归档/清理已有记录；版本冲突读取新 policy 后重算补丁。
        binding:
          type: native
          name: memory_configure
      - id: memory_activate
        kind: function
        consumers:
          - host
        description: 打开插件私有记忆库并恢复遗忘清理通知。
        inputSchema:
          type: object
        outputSchema:
          type: object
        execution: immediate
        effects:
          - write:memory
        resultRetention: summary
        usage:
          purpose: 打开插件私有记忆库并恢复遗忘清理通知。
          inputs: 宿主 lifecycle.activate；实现使用 storageRoot，不消费业务字段。
          outputs: '{ready:true,storage:"plugin-private-sqlite"}，恢复遗忘通知并启动维护定时器。'
          prerequisites: []
          limitations:
            - 激活不会发模型请求；维护清理按保存的策略执行。
        binding:
          type: native
          name: memory_activate
      - id: memory_before_compact
        kind: function
        consumers:
          - host
        description: 从真实用户消息与固定成果中自动整理记忆。
        inputSchema:
          type: object
        outputSchema:
          type: object
        execution: immediate
        effects:
          - model:complete
          - write:memory
        resultRetention: summary
        usage:
          purpose: 从真实用户消息与固定成果中自动整理记忆。
          inputs: 宿主 lifecycle.beforeCompact 提供 model、准备压缩的分支/消息和原因，signal 由宿主注入。
          outputs: 持久整理回执含 status/counts/processedChunks/pendingSources；失败保留进度，宿主仍能继续压缩。
          prerequisites:
            - 宿主会话、当前可用模型、真实用户消息/已发布成果。
          limitations:
            - 最多六块；不把工具日志或助手摘要当事实，不自动遗忘、不刷新采用时间；下次压缩接续未完成来源。
            - 新增或修改 trading/risk-rules 始终只产生候选，不能自动接纳。
        binding:
          type: native
          name: memory_before_compact
      - id: memory_before_run_release
        kind: function
        consumers:
          - host
        description: 清理独立 Run 的临时候选；临时会话在成果封存后另行整理。
        inputSchema:
          type: object
        outputSchema:
          type: object
        execution: immediate
        effects:
          - write:memory
        resultRetention: summary
        usage:
          purpose: 清理独立 Run 的临时候选，保留等待会话收尾的内容。
          inputs: 宿主 lifecycle.beforeRunRelease；runId 或 workspaceRunId 标识要终结的任务。
          outputs: 该任务未合并候选的真实清理结果。
          prerequisites:
            - 宿主当前会话上下文。
          limitations:
            - 主会话候选与待封存工作区的候选保留。
        binding:
          type: native
          name: memory_before_run_release
      - id: memory_release_task
        kind: function
        consumers: [host]
        description: 临时会话删除前，根据已封存的最终成果和持久的用户消息补记长期记忆。
        inputSchema:
          type: object
          required: [ownerSessionId, conversationId, workspaceRunId, checkpointId, reason, messages, artifactRefs]
          properties:
            ownerSessionId: { type: string, minLength: 1 }
            conversationId: { type: string, minLength: 1 }
            workspaceRunId: { type: string, minLength: 1 }
            checkpointId: { type: string, minLength: 1 }
            reason: { const: task_release }
            messages: { type: array, items: { type: object, required: [source] } }
            artifactRefs: { type: array, items: { type: object, required: [id, revision, kind, digest, schemaVersion] } }
        outputSchema: { type: object }
        execution: immediate
        effects: [model:complete, write:memory]
        resultRetention: summary
        usage:
          purpose: 将可复核候选交给持久主会话，从任务最终来源整理可复用结论。
          inputs: 宿主在封存后给出任务与持久主会话身份、检查点、来源、当前模型与预算。
          outputs: 转交及清除候选的计数、分块整理回执。
          prerequisites: [来源在临时会话删除后仍可由主会话读取。]
          limitations: [对已处理来源去重；未完成的持久来源在主会话后续压缩时继续处理。]
        binding: { type: native, name: memory_release_task }
      - id: memory_dispose
        kind: function
        consumers:
          - host
        description: 停止维护并关闭插件私有记忆库。
        inputSchema:
          type: object
        outputSchema:
          type: object
        execution: immediate
        effects:
          - write:memory
        resultRetention: summary
        usage:
          purpose: 停止维护并关闭插件私有记忆库。
          inputs: 宿主 lifecycle.dispose；无业务输入。
          outputs: "{closed:true}；停止维护，等待私有库操作并关闭 SQLite。"
          prerequisites: []
          limitations:
            - 不删除持久记忆；无需 Agent 手动调用。
        binding:
          type: native
          name: memory_dispose
    sources: []
    views: []
    services:
      - id: memory
        contract: sesame.memory/1
        consumer: host
        configSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        operations:
          search: memory_search
          read: memory_read
          tree: memory_tree
          index: memory_index
          manage: memory_manage
          stats: memory_stats
          configure: memory_configure
          trading_context: memory_trading_context
          releaseTask: memory_release_task
    knowledge:
      - id: memory-guide
        path: instructions.md
        description: 长期记忆的资料、候选、来源与生命周期。
        kind: prompt
      - id: manage-memory
        path: skills/manage-memory/SKILL.md
        description: 记忆分类与管理方法。
        kind: skill
      - id: personal-trading-memory
        path: skills/personal-trading-memory/SKILL.md
        description: 个人风格、风险红线与策略认知的记忆方法；用实际账户和合约参数核算规则并由用户确认。
        kind: skill
    hooks:
      - id: activate
        contract: sesame.lifecycle/1
        consumer: host
        configSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        event: lifecycle.activate
        operations:
          handle: memory_activate
      - id: beforeCompact
        contract: sesame.lifecycle/1
        consumer: host
        configSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        event: lifecycle.beforeCompact
        operations:
          handle: memory_before_compact
      - id: beforeRunRelease
        contract: sesame.lifecycle/1
        consumer: host
        configSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        event: lifecycle.beforeRunRelease
        operations:
          handle: memory_before_run_release
      - id: dispose
        contract: sesame.lifecycle/1
        consumer: host
        configSchema:
          type: object
          properties: {}
          required: []
          additionalProperties: false
        event: lifecycle.dispose
        operations:
          handle: memory_dispose
    stateCollections: []
    artifactSchemas: []
