name: memory_mark_used
title: memory_mark_used
description: 仅在记忆实际用于一个已发布成果或明确用户决策后记录采用，附具体原因和持久来源。相同来源重复调用不刷新闲置时间；搜索曝光和读取不算采用。
inputSchema:
  type: object
  required:
    - id
    - reason
    - source
  properties:
    id:
      type: string
      description: 已实际采用的记忆 ID
      minLength: 1
      maxLength: 20000
    reason:
      type: string
      description: 说明它如何影响该成果或决策
      minLength: 1
      maxLength: 20000
    source:
      anyOf:
        - type: object
          properties:
            type:
              type: string
              const: user_message
            id:
              type: string
              minLength: 1
              maxLength: 20000
              description: 真实用户消息 ID；不能使用委派消息或成果 ID
          required:
            - type
            - id
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: artifact
            id:
              type: string
              minLength: 1
              maxLength: 20000
              description: 原 ArtifactRef.id
            revision:
              type: string
              minLength: 1
              maxLength: 20000
              description: 原 ArtifactRef.revision 字符串
            kind:
              type: string
              minLength: 1
              maxLength: 20000
              description: 原 ArtifactRef.kind
            digest:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
              description: 原 ArtifactRef.digest
            schemaVersion:
              type: string
              minLength: 1
              maxLength: 20000
              description: 原 ArtifactRef.schemaVersion
          required:
            - type
            - id
            - revision
            - kind
            - digest
            - schemaVersion
          additionalProperties: false
      description: 来源必须有 type。冻结成果使用 {type:"artifact",...完整 ArtifactRef}；用户表达使用 {type:"user_message",id:"真实消息ID"}。不省略 type，不改写来源类别或成果版本。
  additionalProperties: false
outputSchema:
  type: object
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - write:memory
  resultRetention: summary
  usage:
    purpose: 仅在记忆实际用于一个已发布成果或明确用户决策后记录采用，附具体原因和持久来源。相同来源重复调用不刷新闲置时间；搜索曝光和读取不算采用。
    inputs: id 是已实际用于结论的记忆；reason 说明影响；source 是该已发布成果或明确用户决策消息。
    outputs: 更新后的采用记录/记忆状态；同一来源重复调用幂等。
    prerequisites:
      - 记忆确实影响了这份成果/决策。
    limitations:
      - 曝光、搜索、读取不算采用，不能用假引用刷新生命周期。
  binding:
    type: native
    name: memory_mark_used
