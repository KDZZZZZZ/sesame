id: memory-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/memory/skills/manage-memory/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/memory
  - step: 1
    pointer: /tools/0/name
    equals: memory_manage
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      required:
        - action
      properties:
        action:
          anyOf:
            - type: string
              const: save
            - type: string
              const: candidates
            - type: string
              const: accept
            - type: string
              const: reject
            - type: string
              const: archive
            - type: string
              const: restore
            - type: string
              const: forget
            - type: string
              const: stats
        id:
          type: string
          description: accept/reject 使用候选 ID；其余写操作使用正式记忆 ID
          minLength: 1
          maxLength: 20000
        expected_version:
          type: integer
          minimum: 1
          description: 对应对象最新 version：候选来自 candidates，正式记忆来自 memory_read；不是成果 revision
        entry:
          type: object
          properties:
            category:
              type: string
              description: 分类路径，阅读 manage-memory skill 获取完整分类树
              minLength: 1
              maxLength: 20000
            title:
              type: string
              description: 稳定的事实或偏好名称
              minLength: 1
              maxLength: 20000
            summary:
              type: string
              description: 用于检索的简短摘要
              minLength: 1
              maxLength: 20000
            content:
              type: string
              description: 完整结论、依据与适用条件，不保存原始日志
              minLength: 1
              maxLength: 20000
            scope:
              anyOf:
                - type: object
                  properties:
                    kind:
                      type: string
                      const: global
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      type: string
                      const: project
                    project_id:
                      type: string
                      minLength: 1
                      maxLength: 160
                      pattern: ^[\w.-]+$
                      description: 真实项目 ID
                  required:
                    - kind
                    - project_id
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      type: string
                      const: strategy
                    project_id:
                      type: string
                      minLength: 1
                      maxLength: 160
                      pattern: ^[\w.-]+$
                      description: 策略所属项目 ID
                    strategy_id:
                      type: string
                      minLength: 1
                      maxLength: 160
                      pattern: ^[\w.-]+$
                      description: 真实策略 ID
                  required:
                    - kind
                    - project_id
                    - strategy_id
                  additionalProperties: false
            sources:
              type: array
              items:
                anyOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        const: user_message
                      id:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 真实用户消息 ID；不能使用委派消息或成果 ID
                    required:
                      - type
                      - id
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        const: artifact
                      id:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 原 ArtifactRef.id
                      revision:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 原 ArtifactRef.revision 字符串
                      kind:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 原 ArtifactRef.kind
                      digest:
                        type: string
                        pattern: ^sha256:[a-f0-9]{64}$
                        description: 原 ArtifactRef.digest
                      schemaVersion:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 原 ArtifactRef.schemaVersion
                    required:
                      - type
                      - id
                      - revision
                      - kind
                      - digest
                      - schemaVersion
                    additionalProperties: false
                description: 来源必须有 type。冻结成果使用 {type:"artifact",...完整 ArtifactRef}；用户表达使用 {type:"user_message",id:"真实消息ID"}。不省略 type，不改写来源类别或成果版本。
              minItems: 1
              maxItems: 20
            tags:
              type: array
              items:
                type: string
                maxLength: 64
              maxItems: 20
            evidence:
              anyOf:
                - type: string
                  const: explicit
                - type: string
                  const: verified
                - type: string
                  const: inferred
                - type: string
                  const: conflicted
            pinned:
              type: boolean
            value:
              anyOf:
                - type: string
                  const: low
                - type: string
                  const: normal
                - type: string
                  const: high
            expires_at:
              anyOf:
                - type: string
                - type: "null"
            review_at:
              anyOf:
                - type: string
                - type: "null"
            conflicts_with:
              type: array
              items:
                type: string
              maxItems: 20
          additionalProperties: false
        confirmation_source:
          type: object
          properties:
            type:
              const: user_message
              type: string
            id:
              type: string
              minLength: 1
              maxLength: 160
          required:
            - type
            - id
          additionalProperties: false
          description: 仅操作 trading/risk-rules 正式规则时必填：本次明确同意该操作的真实用户消息。修改、归档、恢复、遗忘不能复用上次 confirmed_by；不是用户新确认时先提候选并沟通。
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "## 来源与候选的正确形状"
