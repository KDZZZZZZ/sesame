name: configuration_integration_catalog
title: configuration_integration_catalog
description: 读取所有已安装插件声明的配置项、配置状态及其依赖能力，密钥不回显。
inputSchema:
  type: object
  properties:
    plugin_id:
      type: string
      minLength: 1
      maxLength: 256
  additionalProperties: false
outputSchema:
  type: object
  additionalProperties: true
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects: []
  usage:
    purpose: 读取所有已安装插件声明的配置项、配置状态及其依赖能力，密钥不回显。
    inputs: 可选 plugin_id 精确筛选一个已安装插件；空对象列出所有已声明统一配置的插件，不接收 fields。
    outputs: items 中包含插件字段、configured/writable/authority/clearable、可用的 expected_version 和实际依赖能力；不返回已存密钥。
    prerequisites:
      - 主 Agent 会话。
    limitations:
      - 配置存在不代表远端可用。设置写入必须即时执行。
  binding:
    type: native
    name: configuration_integration_catalog
