name: data_snapshot
title: data_snapshot
description: 一次完成真实来源分页、预算检查、冻结证据和DataRef发布。
inputSchema:
  type: object
  properties:
    source:
      type: object
      properties:
        providerId:
          type: string
          minLength: 1
          maxLength: 4096
          description: data_sources 返回的完整来源ID
        revision:
          type: string
          minLength: 1
          maxLength: 4096
          description: 精确声明版本
        binding:
          type: object
      required:
        - providerId
        - revision
      additionalProperties: false
    operation:
      type: string
      minLength: 1
      maxLength: 4096
      description: 静态声明的查询operation
    input:
      type: object
    operationId:
      type: string
      minLength: 1
      maxLength: 128
      description: 稳定操作ID
    title:
      type: string
      minLength: 1
      maxLength: 500
      description: 数据标题
    provenanceKind:
      enum:
        - observed
        - derived
        - user_input
        - demo
    maxRows:
      type: integer
      minimum: 1
      maximum: 100000
    dependencies:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 4096
            description: 成果ID
          revision:
            type: string
            minLength: 1
            maxLength: 4096
            description: 精确修订
          digest:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          kind:
            type: string
            minLength: 1
            maxLength: 4096
            description: 成果类型
          schemaVersion:
            const: 1.0.0
        required:
          - id
          - revision
          - digest
          - kind
          - schemaVersion
        additionalProperties: false
      maxItems: 64
  required:
    - source
    - input
    - operationId
    - title
  additionalProperties: false
outputSchema:
  type: object
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - data.query
    - resource.create
    - artifact.publish
    - state.write
  usage:
    purpose: 一次完成真实来源分页、预算检查、冻结证据和DataRef发布。
    inputs: source/operation/input 选真实来源；operationId 标识此次固定查询，title 命名成果；maxRows 默认 100000。来源无 provenance 时显式 provenanceKind；dependencies 为已发布固定引用。
    outputs: "{ref,evidence,rowCount,columns,sample,provenance,receipt}；ref 是完整固定 DataRef，evidence 保存真实页与采集依据。"
    prerequisites:
      - 来源插件可用；有可分页的 JSON 查询操作。
    limitations:
      - 完整采集成功才发布；预算超限不发布截断结果。同一 operationId 复用冻结字节，新观察用新 ID；demo 标记不得升级。
  binding:
    type: native
    name: data_snapshot
