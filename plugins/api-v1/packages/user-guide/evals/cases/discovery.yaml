id: user-guide-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/user-guide/skills/sesame-user-guide/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/user-guide
  - step: 1
    pointer: /tools
    equals: []
  - step: 2
    pointer: /contents/0/text
    contains: "# Sesame 用户使用指南"
