/* Report styles, injected after theme.css into every isolated report.
   Borderless and editorial: hierarchy comes from type, colour and whitespace; the few lines are full-width
   hairlines (a rule above each statistic, row dividers, a disclosure line). Only overlays and code get a surface.
   reportKit (report-kit.js) renders into the .kit-* classes; the plain classes serve hand-written reports. */
html{color-scheme:var(--native-color-scheme,var(--report-default-native-color-scheme));scroll-behavior:smooth;scrollbar-color:var(--scrollbar-color,var(--report-default-scrollbar-color));scrollbar-width:thin}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:clamp(24px,5vw,56px) clamp(20px,5vw,48px);background:var(--surface-secondary,var(--report-default-surface-secondary));color:var(--foreground,var(--report-default-foreground));font:14px/1.7 var(--sans,var(--report-default-sans));overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body>main,.report{max-width:880px;margin-inline:auto;min-width:0}
[hidden]{display:none!important}
::selection{background:var(--selection,var(--report-default-selection));color:var(--selection-foreground,var(--report-default-selection-foreground))}
h1,h2,h3,h4,p,figure,blockquote{margin:0}
h1{font-family:var(--serif,var(--report-default-serif));font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.02em;font-weight:560;max-width:24ch;text-wrap:balance}
h2{font-family:var(--serif,var(--report-default-serif));font-size:21px;line-height:1.35;letter-spacing:-.01em;font-weight:580;margin:56px 0 8px}
h3{font-size:14px;line-height:1.5;font-weight:600;margin:28px 0 8px}
p+p{margin-top:12px}p,li{max-width:66ch;text-wrap:pretty}
small,.muted,.report-caption,figcaption{color:var(--muted,var(--report-default-muted));font-size:12.5px}
a{color:var(--link,var(--report-default-link));text-decoration-color:rgba(var(--forest-rgb,var(--report-default-forest-rgb)),.4);text-underline-offset:4px}a:hover{text-decoration-color:currentColor}
strong,b{font-weight:600}
.positive{color:var(--success,var(--report-default-success))}.negative{color:var(--danger,var(--report-default-danger))}
:is(button,a,select,input,summary,textarea):focus-visible{outline:2px solid var(--focus,var(--report-default-focus));outline-offset:3px;border-radius:4px}

/* Controls: filled ghost pills, no outlines; tabs are text with an underline. */
button,input,select,textarea{font:inherit;color:inherit}
button,select{min-height:30px;padding:5px 14px;border:0;border-radius:999px;background:light-dark(var(--surface,var(--report-default-surface)), rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.09));color:var(--foreground,var(--report-default-foreground));font-size:12.5px;font-weight:550}
button{cursor:pointer;transition:background-color .2s,color .2s,box-shadow .3s}
button:hover{background:light-dark(var(--surface,var(--report-default-surface)), rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.14))}button:disabled{opacity:.45;cursor:default}
select{appearance:none;padding-right:30px;background:light-dark(var(--surface,var(--report-default-surface)), rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.06)) var(--chevron,var(--report-default-chevron)) no-repeat right 11px center/11px}
input[type=checkbox],input[type=radio]{accent-color:var(--indigo,var(--report-default-indigo));width:15px;height:15px}
input:not([type=checkbox]):not([type=radio]),textarea{max-width:100%;padding:7px 2px;border:0;border-bottom:1px solid var(--field-border,var(--report-default-field-border));border-radius:0;background:transparent}
:is(input:not([type=checkbox]):not([type=radio]),textarea):focus{border-bottom-color:var(--field-border-focus,var(--report-default-field-border-focus));outline:0}
/* Only real tabs (role=tab or aria-pressed) become underlined text; any other button keeps its pill. */
.report-tabs,[role=tablist]{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px;margin:24px 0;padding:0}
:is(.report-tabs button[aria-pressed],[role=tab]){min-height:0;padding:6px 0;border-radius:0;background:none;color:var(--muted,var(--report-default-muted));font-weight:550;box-shadow:inset 0 -2px 0 transparent}
:is(.report-tabs button[aria-pressed],[role=tab]):hover{background:none;color:var(--foreground,var(--report-default-foreground))}
.report-tabs [aria-pressed=true],[role=tab][aria-selected=true]{color:var(--foreground,var(--report-default-foreground));box-shadow:inset 0 -2px 0 var(--foreground,var(--report-default-foreground))}

/* Hand-written report structure follows the same rules. */
header.report-header{margin-bottom:8px}
.report-header p{margin-top:12px;color:var(--muted,var(--report-default-muted));font-size:15px;max-width:62ch}
.report-meta{display:flex;gap:6px 22px;flex-wrap:wrap;margin:18px 0 0;padding:0;list-style:none;color:var(--muted,var(--report-default-muted));font-size:12.5px}
.report-section{margin:56px 0}.report-section>h2:first-child{margin-top:0}
/* Statistics: a hairline above each figure, columns separated by whitespace only. */
.report-grid,.report-metrics,.kit-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:22px 28px;margin:28px 0}
.report-card,.report-metric,.kit-metric{min-width:0;margin:0;padding:12px 0 0;border-top:1px solid var(--border-strong,var(--report-default-border-strong))}
.report-metric dt,.report-metric>span,.kit-metric dt{display:block;color:var(--muted,var(--report-default-muted));font-size:12px}
.report-metric dd,.report-metric>strong,.kit-metric-value{display:block;margin:4px 0 0;font-size:clamp(22px,3vw,28px);font-weight:600;line-height:1.2;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.report-note,blockquote{margin:20px 0;padding:2px 0 2px 16px;border-left:2px solid var(--indigo,var(--report-default-indigo));color:var(--muted,var(--report-default-muted));font-size:13.5px}
figure{margin:28px 0}figcaption{margin-top:8px}img,svg,canvas,video{max-width:100%;height:auto}svg{overflow:visible}svg text{font-family:var(--sans,var(--report-default-sans))}
/* Tables: header rule and row hairlines, no frame. */
.report-table{max-width:100%;overflow:auto;margin:20px 0}
table{width:100%;border-collapse:collapse;text-align:left;font-size:12.5px;font-variant-numeric:tabular-nums}
caption{padding:0 0 10px;color:var(--muted,var(--report-default-muted));text-align:left;font-size:12.5px}
th,td{padding:10px 16px 10px 0;vertical-align:top;border-bottom:1px solid var(--separator,var(--report-default-separator))}
th:last-child,td:last-child{padding-right:0}
th{border-bottom-color:var(--border-strong,var(--report-default-border-strong));color:var(--subtle,var(--report-default-subtle));font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
tbody tr{transition:background-color .15s}tbody tr:hover{background:light-dark(var(--surface,var(--report-default-surface)), rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.02))}
td.numeric,th.numeric{text-align:right}td.wrap{min-width:150px;white-space:normal;overflow-wrap:anywhere}
td[data-tone=positive]{color:var(--success,var(--report-default-success))}td[data-tone=negative]{color:var(--danger,var(--report-default-danger))}
pre{max-width:100%;overflow:auto;padding:14px 16px;border-radius:10px;background:var(--surface-tertiary,var(--report-default-surface-tertiary));font:12px/1.7 var(--mono,var(--report-default-mono));white-space:pre-wrap;overflow-wrap:anywhere}
code{font:.9em var(--mono,var(--report-default-mono))}:not(pre)>code{padding:1px 5px;border-radius:5px;background:light-dark(var(--surface,var(--report-default-surface)), rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.07))}
ul,ol{padding-left:20px}li+li{margin-top:6px}
details{margin:16px 0}
summary{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--muted,var(--report-default-muted));font-size:12.5px;list-style:none;cursor:pointer;transition:color .2s}
summary::-webkit-details-marker{display:none}
summary::before{content:'';flex:none;width:6px;height:6px;margin:0 3px 0 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .3s var(--ease,var(--report-default-ease))}
details[open]>summary::before{transform:rotate(45deg)}summary:hover{color:var(--foreground,var(--report-default-foreground))}
dialog{width:min(980px,calc(100vw - 24px));max-height:88vh;padding:28px;overflow:auto;border:1px solid var(--border,var(--report-default-border));border-radius:18px;background:var(--overlay,var(--report-default-overlay));color:var(--foreground,var(--report-default-foreground));box-shadow:var(--overlay-shadow,var(--report-default-overlay-shadow))}
dialog::backdrop{background:var(--backdrop,var(--report-default-backdrop));backdrop-filter:blur(6px)}dialog[open]{animation:report-pop .35s var(--ease,var(--report-default-ease))}
dialog header{display:flex;align-items:center;justify-content:space-between;gap:16px}dialog header h3{margin:0;font-size:17px}
dialog header button{width:32px;min-height:32px;padding:0;font-size:18px;line-height:1}

/* ── reportKit ─────────────────────────────────────────────────────────── */
.kit-report{--tone:var(--indigo,var(--report-default-indigo));counter-reset:kit-section}
[data-tone=positive]{--tone:var(--success,var(--report-default-success))}[data-tone=negative]{--tone:var(--danger,var(--report-default-danger))}[data-tone=caution]{--tone:var(--warning,var(--report-default-warning))}[data-tone=neutral]{--tone:var(--indigo,var(--report-default-indigo))}
.kit-header{display:grid;gap:12px}
.kit-eyebrow{display:flex;align-items:center;gap:8px;color:var(--muted,var(--report-default-muted));font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.kit-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent-gradient,var(--report-default-accent-gradient));box-shadow:0 0 10px rgba(var(--forest-rgb,var(--report-default-forest-rgb)),.2)}
.kit-subtitle{color:var(--muted,var(--report-default-muted));font-size:15px;max-width:62ch}
.kit-meta{display:flex;flex-wrap:wrap;gap:6px 24px;margin:6px 0 0;padding:0;list-style:none}
.kit-meta li{max-width:none;display:inline-flex;align-items:baseline;gap:8px;margin:0;font-size:12.5px}
.kit-meta span{color:var(--subtle,var(--report-default-subtle))}.kit-meta b{font-weight:500;font-variant-numeric:tabular-nums}
.kit-tone-icon{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* Verdict: an editorial lead — tone kicker, large sentence, quiet qualifier. */
.kit-verdict{margin:44px 0 0;max-width:60ch}
.kit-verdict-kicker{display:flex;align-items:center;gap:7px;color:var(--tone);font-size:12px;font-weight:600;letter-spacing:.06em}
.kit-verdict-kicker .kit-tone-icon{width:13px;height:13px}
.kit-verdict-headline{margin-top:10px;font-family:var(--serif,var(--report-default-serif));font-size:clamp(21px,2.8vw,25px);font-weight:520;line-height:1.4;letter-spacing:-.01em;text-wrap:pretty}
.kit-verdict-detail{margin-top:10px;color:var(--muted,var(--report-default-muted));font-size:14.5px;line-height:1.7}
.kit-metrics{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));margin-top:40px}
.kit-metric{display:flex;flex-direction:column}
.kit-metric dd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin:4px 0 0}
.kit-metric-value{margin:0}.kit-metric[data-tone=positive] .kit-metric-value{color:var(--success,var(--report-default-success))}.kit-metric[data-tone=negative] .kit-metric-value{color:var(--danger,var(--report-default-danger))}.kit-metric[data-tone=caution] .kit-metric-value{color:var(--warning,var(--report-default-warning))}
.kit-delta{color:var(--tone);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}.kit-delta[data-tone=neutral]{color:var(--muted,var(--report-default-muted))}
.kit-delta small{color:var(--muted,var(--report-default-muted));font-weight:400;font-size:11.5px}
.kit-metric-hint{margin-top:4px;color:var(--subtle,var(--report-default-subtle));font-size:11.5px}
/* Sections are numbered and separated by space, not rules. */
.kit-section{margin:72px 0 0;counter-increment:kit-section}
.kit-section h2{display:flex;align-items:baseline;gap:12px;margin:0}
.kit-section h2::before{content:counter(kit-section,decimal-leading-zero);flex:none;color:var(--subtle,var(--report-default-subtle));font:500 12px var(--mono,var(--report-default-mono));letter-spacing:.04em}
.kit-takeaway{margin:10px 0 0;font-family:var(--serif,var(--report-default-serif));font-size:17px;line-height:1.6;max-width:60ch}
.kit-section>:last-child{margin-bottom:0}

/* Charts sit on the page: title and reading note above, faint horizontal grid only. */
.kit-chart{position:relative;margin:32px 0 0}
.kit-chart-head{display:grid;gap:2px;margin:0 0 14px}
.kit-chart-head strong{color:var(--foreground,var(--report-default-foreground));font-size:13.5px;font-weight:600}
.kit-chart-caption{color:var(--muted,var(--report-default-muted));font-size:12.5px}
.kit-legend{display:flex;flex-wrap:wrap;gap:2px 16px;margin:-6px 0 12px}
.kit-legend button{display:inline-flex;align-items:center;gap:7px;min-height:24px;padding:0;background:none;color:var(--muted,var(--report-default-muted));font-size:12px}
.kit-legend button:hover{background:none;color:var(--foreground,var(--report-default-foreground))}
.kit-legend i{width:8px;height:8px;border-radius:2px;background:var(--swatch)}
.kit-legend button[aria-pressed=false]{opacity:.4}.kit-legend button[aria-pressed=false] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--swatch)}
.kit-chart-stage{position:relative;min-width:0}
.kit-svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.kit-axis{fill:var(--chart-text,var(--report-default-chart-text));font-size:10.5px;font-variant-numeric:tabular-nums}
.kit-category{fill:var(--muted,var(--report-default-muted));font-size:11.5px}
.kit-grid{stroke:rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.045)}
.kit-baseline{stroke:rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.28)}
.kit-mark{stroke:var(--forest,var(--report-default-forest));stroke-dasharray:3 4;opacity:.75}.kit-mark-label{fill:var(--muted,var(--report-default-muted));font-size:10.5px}
.kit-line{stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.kit-dot{opacity:.9}.kit-hot{stroke:var(--surface-secondary,var(--report-default-surface-secondary));stroke-width:2}
.kit-crosshair{stroke:rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.22)}
.kit-bar,.kit-cell{transition:opacity .15s}.kit-bar:hover{opacity:.75}.kit-cell:hover{stroke:rgba(var(--ink-rgb,var(--report-default-ink-rgb)),.6);stroke-width:1.5}
.kit-value{fill:var(--muted,var(--report-default-muted));font-size:10.5px;font-variant-numeric:tabular-nums}
.kit-cell-value{fill:var(--foreground,var(--report-default-foreground));font-size:10px;font-variant-numeric:tabular-nums;pointer-events:none}
.kit-tooltip{position:absolute;z-index:5;display:grid;gap:3px;min-width:120px;max-width:260px;padding:8px 10px;border:1px solid var(--border,var(--report-default-border));border-radius:10px;background:var(--glass,var(--report-default-glass));box-shadow:var(--overlay-shadow,var(--report-default-overlay-shadow));font-size:12px;pointer-events:none;backdrop-filter:blur(10px)}
.kit-tooltip strong{color:var(--muted,var(--report-default-muted));font-size:11px;font-weight:500}
.kit-tooltip span{display:flex;align-items:center;gap:7px}.kit-tooltip i{width:7px;height:7px;border-radius:2px}
.kit-tooltip em{color:var(--muted,var(--report-default-muted));font-style:normal}.kit-tooltip b{margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}

/* Findings: a ruled list; evidence reads as inline figures, not chips. */
.kit-findings{margin:28px 0 0;padding:0;list-style:none;border-top:1px solid var(--separator,var(--report-default-separator))}
.kit-findings>li{max-width:none;display:grid;grid-template-columns:16px minmax(0,1fr);gap:14px;margin:0;padding:16px 0;border-bottom:1px solid var(--separator,var(--report-default-separator))}
.kit-finding-mark{display:block;width:14px;height:14px;margin-top:5px;color:var(--tone)}
.kit-claim{font-size:14.5px;font-weight:550;line-height:1.6}
.kit-evidence{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 0;padding:0;list-style:none}
.kit-evidence li{display:inline-flex;align-items:baseline;gap:7px;margin:0;font-size:12.5px}
.kit-evidence span{color:var(--muted,var(--report-default-muted))}.kit-evidence b{font-weight:600;font-variant-numeric:tabular-nums}
.kit-evidence li[data-tone=positive] b{color:var(--success,var(--report-default-success))}.kit-evidence li[data-tone=negative] b{color:var(--danger,var(--report-default-danger))}.kit-evidence li[data-tone=caution] b{color:var(--warning,var(--report-default-warning))}
.kit-evidence-text{margin-top:6px;color:var(--muted,var(--report-default-muted));font-size:13px}
.kit-caveat{margin-top:6px;color:var(--subtle,var(--report-default-subtle));font-size:12.5px}
.kit-note{margin:24px 0 0;padding:1px 0 1px 14px;border-left:2px solid var(--tone);color:var(--muted,var(--report-default-muted));font-size:13.5px}
.kit-table{margin-top:28px}
.kit-more{margin:-8px 0 0}.kit-more summary{font-size:12px}
.kit-empty{color:var(--muted,var(--report-default-muted));font-size:12.5px}
.kit-custom{margin:28px 0 0;min-width:0}

/* Appendix: a disclosure line at the end of the page. */
.kit-appendix{margin:80px 0 0;border-top:1px solid var(--separator,var(--report-default-separator))}
.kit-appendix>summary{padding:18px 0;color:var(--foreground,var(--report-default-foreground));font-size:13.5px;font-weight:600}
.kit-appendix-body{display:grid;gap:24px;padding:4px 0 8px 23px}
.kit-method-group h3{margin:0 0 8px;color:var(--subtle,var(--report-default-subtle));font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.kit-method-group ul{margin:0;padding-left:16px;color:var(--muted,var(--report-default-muted));font-size:13px}
.kit-method-group li::marker{color:var(--subtle,var(--report-default-subtle))}
.kit-sources{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);gap:8px 18px;margin:0;font-size:12.5px}
.kit-sources dt{color:var(--subtle,var(--report-default-subtle))}.kit-sources dd{margin:0;color:var(--muted,var(--report-default-muted));font-family:var(--mono,var(--report-default-mono));font-size:11.5px;overflow-wrap:anywhere}

@keyframes report-pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@media(max-width:500px){
  body{padding:28px 18px}
  .report-grid,.report-metrics,.kit-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
  .kit-section{margin-top:56px}.kit-verdict{margin-top:32px}.kit-appendix-body{padding-left:18px}
  dialog{padding:18px}h2{font-size:17px}th,td{padding:9px 12px 9px 0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
@media print{body{background:white;color:black;padding:0}th,td,.kit-metric,.kit-findings,.kit-findings>li{border-color:#ddd}button,[role=tablist],.kit-legend{display:none}p,li{max-width:none}}

<script>// Sesame reportKit. MIT. Restored from the original Sesame report renderer.
// Packaged by the reports plugin; the only data capability is the report/1 read-only bridge.
(function installReportKit() {
  const SVG = 'http://www.w3.org/2000/svg';
  const locale = () => document.documentElement.lang || 'en';
  const formatNumber = (value, options) => new Intl.NumberFormat(locale(), options).format(value);
  const tr = (zh, en, values = {}) => (/^zh/i.test(locale()) ? zh : en).replace(/\{(\w+)\}/g, (match, key) => values[key] ?? match);
  const chartInstances = new WeakMap();
  const fail = message => { const error = new Error(`reportKit: ${message}`); error.name = 'ReportSpecError'; throw error; };
  const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const finite = value => typeof value === 'number' && Number.isFinite(value);

  // Content length is authoring guidance, never a rendering failure.
  const text = (value, path, max, required = true) => {
    if (value == null || value === '') { if (required) fail(`${path} is required.`); return ''; }
    if (typeof value !== 'string') fail(`${path} must be a string.`);
    return value;
  };
  const list = (value, path, max, required = false) => {
    if (value == null) { if (required) fail(`${path} is required.`); return []; }
    if (!Array.isArray(value)) fail(`${path} must be an array.`);
    return value;
  };
  const tones = ['positive', 'negative', 'caution', 'neutral'];
  const tone = (value, path) => { if (value == null) return 'neutral'; if (!tones.includes(value)) fail(`${path} must be one of ${tones.join(', ')}.`); return value; };

  const h = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null || value === false) continue;
      if (key === 'class') node.className = value; else if (key === 'text') node.textContent = value; else node.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children.flat()) if (child != null && child !== false) node.append(child);
    return node;
  };
  const s = (tag, attrs = {}) => { const node = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) if (v != null) node.setAttribute(k, v); return node; };
  const resolve = target => {
    const node = typeof target === 'string' ? document.querySelector(target) : target;
    if (!(node instanceof Element)) fail(`target ${String(target)} was not found.`);
    return node;
  };

  // ── Numbers ───────────────────────────────────────────────────────────
  const formats = ['number', 'integer', 'percent', 'ratio', 'currency', 'text'];
  const formatValue = (value, options = {}) => {
    const { format = 'number', digits, unit, signed } = options;
    if (!formats.includes(format)) fail(`format must be one of ${formats.join(', ')}.`);
    if (value == null || (typeof value === 'number' && !Number.isFinite(value))) return '—';
    if (format === 'text' || typeof value !== 'number') return String(value) + (unit ? ` ${unit}` : '');
    const number = format === 'ratio' ? value * 100 : value;
    const abs = Math.abs(number);
    const max = digits ?? (format === 'integer' ? 0 : abs >= 1000 ? 0 : abs >= 100 ? 1 : abs >= 1 ? 2 : abs === 0 ? 0 : 4);
    const out = formatNumber(number, { maximumFractionDigits: max, minimumFractionDigits: digits ?? 0 });
    const sign = signed && number > 0 ? '+' : '';
    const suffix = format === 'percent' || format === 'ratio' ? '%' : unit ? ` ${unit}` : '';
    return `${sign}${out}${suffix}`;
  };
  const compact = value => Math.abs(value) >= 10000 ? formatNumber(value, { notation: 'compact', maximumFractionDigits: 2 }) : formatNumber(value, { maximumFractionDigits: Math.abs(value) >= 100 ? 0 : Math.abs(value) >= 1 ? 2 : 4 });
  // Axis labels carry exactly the precision the tick step needs: 9,990 / 10,000 / 10,010, not 1万 / 1万 / 1万.
  const axisFormat = values => {
    const step = values.length > 1 ? Math.abs(values[1] - values[0]) : Math.abs(values[0]) || 1;
    const magnitude = Math.max(...values.map(Math.abs));
    if (magnitude >= 1e21 || step > 0 && step < 1e-6) {
      const digits = Number.isFinite(step) && step > 0 ? Math.max(2, Math.min(16, Math.ceil(Math.log10(magnitude || 1) - Math.log10(step)) + 1)) : 2;
      return value => value === 0 ? '0' : value.toExponential(digits);
    }
    if (step >= 100000) return value => formatNumber(value, { notation: 'compact', maximumFractionDigits: Math.max(0, 2 - Math.floor(Math.log10(step / 1000))) });
    const digits = Math.max(0, Math.min(6, -Math.floor(Math.log10(step) + 1e-9)));
    return value => formatNumber(value, { maximumFractionDigits: digits, minimumFractionDigits: digits });
  };
  const signTone = value => !finite(value) || value === 0 ? 'neutral' : value > 0 ? 'positive' : 'negative';

  // ── Data ──────────────────────────────────────────────────────────────
  // Resolve exact fixed bindings only. Paging never substitutes a live query.
  async function rows(dataId, { maxRows = 50000 } = {}) {
    if (!window.report?.readData) fail('the report/1 data bridge is unavailable.');
    if (!Number.isInteger(maxRows) || maxRows < 1 || maxRows > 1000000) fail('maxRows must be an integer from 1 to 1000000.');
    const out = [], seen = new Set(); let cursor;
    do {
      const page = await window.report.readData(dataId, { limit: Math.min(1000, maxRows + 1 - out.length), ...(cursor ? { cursor } : {}) });
      if (!Array.isArray(page.rows)) fail('data page did not contain rows.');
      out.push(...page.rows);
      if (out.length > maxRows) fail('row budget exceeded; bind an aggregation or explicitly raise maxRows.');
      cursor = page.page?.nextCursor;
      if (cursor && seen.has(cursor)) fail('data cursor repeated.');
      if (cursor) seen.add(cursor);
    } while (cursor);
    return out;
  }

  // ── Components ────────────────────────────────────────────────────────
  const icons = { positive: 'M5 12.5l4.5 4.5L19 7.5', negative: 'M7 7l10 10M17 7L7 17', caution: 'M12 7v6M12 16.5v.5', neutral: 'M6 12h12' };
  const toneIcon = value => { const svg = s('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true', class: 'kit-tone-icon' }); svg.append(s('path', { d: icons[value] })); return svg; };

  function verdict(target, spec, path = 'verdict') {
    if (!isObject(spec)) fail(`${path} must be an object.`);
    const t = tone(spec.tone, `${path}.tone`);
    const node = h('section', { class: 'kit-verdict', 'data-tone': t, 'aria-label': tr('结论', 'Conclusion') },
      h('p', { class: 'kit-verdict-kicker' }, toneIcon(t), tr('结论', 'Conclusion')),
      h('p', { class: 'kit-verdict-headline', text: text(spec.headline, `${path}.headline`, 80) }),
      spec.detail ? h('p', { class: 'kit-verdict-detail', text: text(spec.detail, `${path}.detail`, 160, false) }) : null);
    resolve(target).append(node); return node;
  }

  function metricNode(item, path) {
    if (!isObject(item)) fail(`${path} must be an object.`);
    const value = item.value;
    if (value != null && typeof value !== 'number' && typeof value !== 'string') fail(`${path}.value must be a number from report data, a short string or null.`);
    if (typeof value === 'string') text(value, `${path}.value`, 16);
    const t = item.tone === 'auto' ? signTone(value) : tone(item.tone, `${path}.tone`);
    const delta = item.delta == null ? null : (() => {
      if (!isObject(item.delta) || !finite(item.delta.value)) fail(`${path}.delta must be { value: number, label?: string }.`);
      return h('span', { class: 'kit-delta', 'data-tone': signTone(item.delta.value) }, formatValue(item.delta.value, { ...item, ...item.delta, signed: true }), item.delta.label ? h('small', { text: ` ${text(item.delta.label, `${path}.delta.label`, 16)}` }) : null);
    })();
    return h('div', { class: 'kit-metric', 'data-tone': t },
      h('dt', { text: text(item.label, `${path}.label`, 16) }),
      h('dd', {}, h('span', { class: 'kit-metric-value', text: formatValue(value, item) }), delta),
      item.hint ? h('p', { class: 'kit-metric-hint', text: text(item.hint, `${path}.hint`, 30, false) }) : null);
  }
  function metrics(target, items, path = 'metrics') {
    const entries = list(items, path, 8, true);
    const node = h('dl', { class: 'kit-metrics', style: `--cols:${entries.length <= 4 ? Math.max(1, entries.length) : entries.length <= 6 ? 3 : 4}` }, entries.map((item, i) => metricNode(item, `${path}[${i}]`)));
    resolve(target).append(node); return node;
  }

  function evidenceNode(evidence, path) {
    if (typeof evidence === 'string') return h('p', { class: 'kit-evidence-text', text: text(evidence, path, 100) });
    return h('ul', { class: 'kit-evidence' }, list(evidence, path, 4).map((item, i) => {
      if (!isObject(item)) fail(`${path}[${i}] must be { label, value, format?, unit? }.`);
      const t = item.tone === 'auto' ? signTone(item.value) : tone(item.tone, `${path}[${i}].tone`);
      return h('li', { 'data-tone': t }, h('span', { text: text(item.label, `${path}[${i}].label`, 16) }), h('b', { text: formatValue(item.value, item) }));
    }));
  }
  function findings(target, items, path = 'findings') {
    const node = h('ol', { class: 'kit-findings' }, list(items, path, 6, true).map((item, i) => {
      const p = `${path}[${i}]`;
      if (!isObject(item)) fail(`${p} must be { claim, evidence, tone?, caveat? }.`);
      const t = tone(item.tone, `${p}.tone`);
      return h('li', { 'data-tone': t }, h('span', { class: 'kit-finding-mark' }, toneIcon(t)),
        h('div', {}, h('p', { class: 'kit-claim', text: text(item.claim, `${p}.claim`, 60) }),
          item.evidence == null ? null : evidenceNode(item.evidence, `${p}.evidence`),
          item.caveat ? h('p', { class: 'kit-caveat', text: text(item.caveat, `${p}.caveat`, 80, false) }) : null));
    }));
    resolve(target).append(node); return node;
  }

  function note(target, spec, path = 'note') {
    if (!isObject(spec)) fail(`${path} must be { text, tone? }.`);
    const node = h('p', { class: 'kit-note', 'data-tone': tone(spec.tone, `${path}.tone`), text: text(spec.text, `${path}.text`, 120) });
    resolve(target).append(node); return node;
  }

  function table(target, spec, path = 'table') {
    if (!isObject(spec)) fail(`${path} must be { columns, rows, limit?, caption? }.`);
    const columns = list(spec.columns, `${path}.columns`, 8, true).map((column, i) => {
      if (typeof column === 'string') return { key: column, label: column };
      if (!isObject(column) || typeof column.key !== 'string') fail(`${path}.columns[${i}] must be a key or { key, label, format?, digits?, unit?, tone? }.`);
      return column;
    });
    const data = list(spec.rows, `${path}.rows`, 0, true), limit = spec.limit ?? 8;
    if (!Number.isInteger(limit) || limit < 1) fail(`${path}.limit must be a positive integer.`);
    const numeric = column => column.format ? column.format !== 'text' : data.some(row => finite(row?.[column.key]));
    const body = h('tbody', {}, data.map((row, i) => h('tr', { hidden: i >= limit }, columns.map(column => {
      const value = row?.[column.key];
      const t = column.tone === 'auto' ? signTone(value) : null;
      return h('td', { class: numeric(column) ? 'numeric' : null, 'data-tone': t, text: formatValue(value, column) });
    }))));
    const wrap = h('div', { class: 'report-table kit-table' }, h('table', {},
      spec.caption ? h('caption', { text: text(spec.caption, `${path}.caption`, 60) }) : null,
      h('thead', {}, h('tr', {}, columns.map(column => h('th', { class: numeric(column) ? 'numeric' : null, scope: 'col', text: column.label ?? column.key })))), body));
    const nodes = [wrap];
    if (data.length > limit) {
      const more = h('details', { class: 'kit-more' }, h('summary', { text: tr('显示其余 {count} 行', 'Show {count} more rows', { count: data.length - limit }) }));
      more.addEventListener('toggle', () => { body.querySelectorAll('tr').forEach((tr, i) => { tr.hidden = !more.open && i >= limit; }); });
      nodes.push(more);
    }
    if (!data.length) nodes.push(h('p', { class: 'kit-empty', text: tr('没有符合条件的记录。', 'No matching records.') }));
    resolve(target).append(...nodes); return wrap;
  }

  // ── Charts ────────────────────────────────────────────────────────────
  const kinds = ['line', 'area', 'bar', 'hbar', 'scatter', 'heatmap'];
  let gradientId = 0;
  // SVG presentation attributes accept CSS variables, so a theme switch keeps chart selections intact.
  const css = name => `var(${name},var(--report-default-${name.slice(2)}))`;
  const palette = () => [1, 2, 3, 4, 5, 6].map(i => css(`--chart-series-${i}`));
