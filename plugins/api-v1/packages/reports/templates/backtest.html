<!doctype html>
<html lang="{{LOCALE}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>{{STYLES}}</style></head>
<body><main id="report" data-sesame-report-template="report/1" aria-label="{{TITLE}}"></main>
<script>{{KIT}}</script><script>{{CHARTS}}</script><script>{{EXPLORER}}</script><script>
const config = {{CONFIG}};
async function initialize() {
  const identity = await window.report.readData(config.dataId, { limit: 1 });
  const rows = await reportKit.rows(config.dataId, { maxRows: 100000 });
  // The provider supplies source evidence and frozen trial rows. Presentation
  // never computes a winner or invents missing parameters or native source logic.
  SesameBacktest.render('#report', { ...config, rows, demo: config.demo || identity.provenance?.kind === 'demo' });
}
window.report.track(initialize()).catch(error => {
  const panel = document.getElementById('report'); panel.className = 'status-error'; panel.textContent = error.message;
});
</script></body></html>
