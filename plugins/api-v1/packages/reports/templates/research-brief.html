<!doctype html>
<html lang="{{LOCALE}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>{{STYLES}}</style></head>
<body><main id="report" aria-label="{{TITLE}}"></main>
<script>{{KIT}}</script><script>{{CHARTS}}</script><script>
const config={{CONFIG}};
async function initialize(){
 const rows=await reportKit.rows(config.dataId);
 const chartData=Object.fromEntries(await Promise.all(config.chartData.map(async item=>[item.property,await reportKit.rows(item.data_id)])));
 // This outline is editable. Add evidence, metrics, comparisons and custom interactions
 // to suit the question; the reusable components supply the familiar Sesame styling.
 reportKit.render('#report',{
  title:config.title,eyebrow:config.label,
  meta:[{label:config.labels.sample,value:rows.length},{label:config.labels.unit,value:config.chart.unit}],
  verdict:{tone:'neutral',headline:config.summary},
  sections:[{title:config.labels.evidence,takeaway:config.takeaway,blocks:[{type:'custom',render(element){
   const chart=document.createElement('div');chart.id='chart';element.append(chart);
   const details=document.createElement('details');details.className='report-inspect';
   const summary=document.createElement('summary');summary.textContent=config.labels.table;details.append(summary);
   const toolbar=document.createElement('div');toolbar.className='report-toolbar';
   const label=document.createElement('label');label.textContent=config.labels.filter;
   const filter=document.createElement('input');filter.id='filter';filter.type='search';filter.placeholder=config.labels.placeholder;label.append(filter);toolbar.append(label);
   const count=document.createElement('span');count.id='row-count';count.className='report-source';count.setAttribute('role','status');toolbar.append(count);details.append(toolbar);
   const table=document.createElement('div');table.id='table';details.append(table);element.append(details);
   const selected=document.createElement('div');selected.className='report-selected-record';selected.hidden=true;details.append(selected);
   let candidates=rows,visible=rows,grid;
   function renderTable(){
    const q=filter.value.trim().toLowerCase();visible=candidates.filter(row=>!q||Object.values(row).some(value=>String(value??'').toLowerCase().includes(q)));
    count.textContent=`${visible.length} / ${rows.length}`;
    grid=SesameCharts.table(table,visible,config.columns);
   }
   function select(row){
    details.open=true;selected.hidden=true;
    if(candidates.includes(row)){
     if(!visible.includes(row)){filter.value='';renderTable();}
     grid.select(visible.indexOf(row));
    }else{selected.hidden=false;SesameCharts.table(selected,[row],Object.keys(row));grid.select(-1);}
   }
   filter.addEventListener('input',renderTable);renderTable();
   // Search affects the inspector only. A partial set of flow links, calendar
   // observations or waterfall steps would change the meaning of the chart.
   const options={...config.chart,...chartData,onSelect:select};
   if(['line','bar','scatter'].includes(config.chart.kind)) reportKit.chart(chart,{...options,data:rows,caption:config.chart.unit,tone:config.chart.kind==='bar'?'signed':undefined});
   else{
    const header=document.createElement('div');header.className='kit-chart-head';const title=document.createElement('strong');title.textContent=config.chart.title;header.append(title);element.insertBefore(header,chart);
    SesameCharts.chart(chart,{...options,rows,onFilter:filtered=>{candidates=filtered;renderTable();}});
   }
  }}]}],
  method:{steps:[config.sourceNote],sources:[{label:config.labels.binding,value:[config.dataId,...config.chartData.map(item=>item.data_id)].join(', ')}]}
 });
}
window.report.track(initialize()).catch(error=>{const panel=document.getElementById('report');panel.className='status-error';panel.textContent=error.message;});
</script></body></html>
