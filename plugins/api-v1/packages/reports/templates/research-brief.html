<!doctype html>
<html lang="{{LOCALE}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>{{STYLES}}</style></head>
<body><main>
<header class="report-header"><p class="eyebrow">{{LABEL}}</p><h1>{{TITLE}}</h1><p class="lede">{{SUMMARY}}</p></header>
<div class="report-toolbar"><label>{{FILTER_LABEL}} <input id="filter" type="search" placeholder="{{FILTER_PLACEHOLDER}}"></label><span id="row-count" class="report-source" role="status"></span></div>
<div class="report-grid"><section class="report-panel wide"><h2>{{CHART_TITLE}}</h2><p class="takeaway">{{TAKEAWAY}}</p><div id="chart"></div></section><section class="report-panel wide"><h2>{{TABLE_TITLE}}</h2><div id="table"></div></section></div>
<footer class="report-footer"><p>{{SOURCE_NOTE}}</p><p class="report-source" id="data-source"></p></footer>
</main><script>{{CHARTS}}</script><script>
const config={{CONFIG}};
async function initialize(){
 const rows=await SesameCharts.readRows(config.dataId);
 document.getElementById('data-source').textContent=config.dataId;
 function render(){const q=document.getElementById('filter').value.trim().toLowerCase(),visible=rows.filter(row=>!q||Object.values(row).some(value=>String(value??'').toLowerCase().includes(q)));document.getElementById('row-count').textContent=`${visible.length} / ${rows.length}`;const table=SesameCharts.table('#table',visible,config.columns);SesameCharts.chart('#chart',{...config.chart,rows:visible,onSelect:(_,index)=>table.select(index)});}
 document.getElementById('filter').addEventListener('input',render);render();
}
window.report.track(initialize()).catch(error=>{const panel=document.getElementById('chart');panel.className='status-error';panel.textContent=error.message;});
</script></body></html>
