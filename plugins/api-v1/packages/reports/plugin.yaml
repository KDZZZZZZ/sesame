        usage:
          purpose: Host-only view of fixed answer component JSON.
          inputs: Exact component resource ArtifactRef, or an existing answer-surface report reference for read-only recovery.
          outputs: title, locale, entry, files and presentation; temporary display only.
          prerequisites:
            - A fixed component resource is available.
          limitations:
            - Does not publish, invoke models or read current workspace files.
        binding:
          type: native
          name: components_render
