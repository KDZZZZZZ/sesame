      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/workflow_status
      - tool/workflow_plan
      - tool/workflow_step
    sources: []
    views: []
    services: []
    knowledge:
      - id: resource.1
        path: instructions.md
        description: 编排职责与通用原则
