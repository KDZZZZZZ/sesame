id: orchestration-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/orchestration/skills/coordinate-research/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/orchestration
  - step: 1
    pointer: /tools/0/name
    equals: workflow_plan
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        action:
          type: string
          enum:
            - open
            - revise
            - close
          description: open 开立；revise 增改待办、补充已有输入或改变条件；close 关闭。
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: 任务标题。open 必填。
        workflow:
          type: string
          minLength: 1
          maxLength: 196
          description: 开立时参考的已声明工作流 id，如 factor.development，重名时传所属包和本地名。
        steps:
          type: array
          minItems: 1
          maxItems: 20
          description: 待办。open 时按顺序写入；revise 时按 step 新增或替换，只能替换还没开始的或失败的待办。一个计划最多 20 条。
          items:
            type: object
            properties:
              step:
                type: string
                pattern: ^[a-z][a-z0-9_]{0,47}$
                description: 待办名：小写字母、数字、下划线。上报和 Run 标签都用它。
              title:
                type: string
                minLength: 1
                maxLength: 40
                description: 动宾短语，如“检查合理性”。显示在用户的流程面板上。
              description:
                type: string
                minLength: 1
                maxLength: 200
                description: 这条待办做什么、做到什么算完成。显示在用户的流程面板上，不写内部标识。
              presets:
                type: array
                maxItems: 20
                uniqueItems: true
                items:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{0,47}$
                description: 包含的预设步骤名，来自参考的工作流。一个预设步骤只能放进一条未结束的待办。
              after:
                type: array
                maxItems: 19
                items:
                  type: string
                description: 必须先完成的待办名。
            required:
              - step
              - title
              - description
            additionalProperties: false
        remove:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,47}$
          description: revise 时移除的待办名。只能移除还没开始的待办。
        have:
          type: array
          maxItems: 64
          items:
            type: string
            pattern: ^[A-Z][A-Za-z0-9]{0,63}(:[a-z][a-z0-9_]{0,31})?$
          description: 已经具备的输入和核对后可复用的产物："Name" 或 "Name:outcome"。只在参考了工作流时可用。
        refs:
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 500
          description: 产物名 → 固定引用（Run id、成果引用、数据集 id、报告路径等）。只放定位信息，不放正文。只在参考了工作流时可用。
        conditions:
          type: object
          maxProperties: 16
          additionalProperties:
            type: boolean
          description: 条件步骤的开关，键是工作流里声明的条件名。只在参考了工作流时可用。
        supersede:
          type: boolean
          description: 已有活动计划时开立新计划必须为 true；旧计划记为放弃。
        outcome:
          type: string
          enum:
            - completed
            - abandoned
          description: close 时的结局。还有待办没有完成、放弃或判为不需要时，只能是 abandoned。
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: 说明。放弃计划时必填。
      required:
        - action
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# 组织研究与协作"
