name: workflow_plan
title: workflow_plan
description: 为当前实质任务开立、调整或关闭流程计划。计划由你写的待办组成，可以参考一个已声明的工作流，把它的预设步骤编进待办。返回现在可以做的待办。只记录和提示，不执行，不授予权限。
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
        - open
        - revise
        - close
      description: open 开立；revise 增改待办、补充已有输入或改变条件；close 关闭。
    title:
      type: string
      minLength: 1
      maxLength: 120
      description: 任务标题。open 必填。
    workflow:
      type: string
      minLength: 1
      maxLength: 196
      description: 开立时参考的已声明工作流 id，如 factor.development，重名时传所属包和本地名。
    steps:
      type: array
      minItems: 1
      maxItems: 20
      description: 待办。open 时按顺序写入；revise 时按 step 新增或替换，只能替换还没开始的或失败的待办。一个计划最多 20 条。
      items:
        type: object
        properties:
          step:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,47}$
            description: 待办名：小写字母、数字、下划线。上报和 Run 标签都用它。
          title:
            type: string
            minLength: 1
            maxLength: 40
            description: 动宾短语，如“检查合理性”。显示在用户的流程面板上。
          description:
            type: string
            minLength: 1
            maxLength: 200
            description: 这条待办做什么、做到什么算完成。显示在用户的流程面板上，不写内部标识。
          presets:
            type: array
            maxItems: 20
            uniqueItems: true
            items:
              type: string
              pattern: ^[a-z][a-z0-9_]{0,47}$
            description: 包含的预设步骤名，来自参考的工作流。一个预设步骤只能放进一条未结束的待办。
          after:
            type: array
            maxItems: 19
            items:
              type: string
            description: 必须先完成的待办名。
        required:
          - step
          - title
          - description
        additionalProperties: false
    remove:
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        pattern: ^[a-z][a-z0-9_]{0,47}$
      description: revise 时移除的待办名。只能移除还没开始的待办。
    have:
      type: array
      maxItems: 64
      items:
        type: string
        pattern: ^[A-Z][A-Za-z0-9]{0,63}(:[a-z][a-z0-9_]{0,31})?$
      description: 已经具备的输入和核对后可复用的产物："Name" 或 "Name:outcome"。只在参考了工作流时可用。
    refs:
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 500
      description: 产物名 → 固定引用（Run id、成果引用、数据集 id、报告路径等）。只放定位信息，不放正文。只在参考了工作流时可用。
    conditions:
      type: object
      maxProperties: 16
      additionalProperties:
        type: boolean
      description: 条件步骤的开关，键是工作流里声明的条件名。只在参考了工作流时可用。
    supersede:
      type: boolean
      description: 已有活动计划时开立新计划必须为 true；旧计划记为放弃。
    outcome:
      type: string
      enum:
        - completed
        - abandoned
      description: close 时的结局。还有待办没有完成、放弃或判为不需要时，只能是 abandoned。
    note:
      type: string
      minLength: 1
      maxLength: 500
      description: 说明。放弃计划时必填。
  required:
    - action
  additionalProperties: false
outputSchema:
  type: object
  additionalProperties: true
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
  execution: immediate
  effects:
    - state.read
    - state.write
    - read
  usage:
    purpose: 为当前实质任务开立、调整或关闭流程计划。计划由你写的待办组成，可以参考一个已声明的工作流，把它的预设步骤编进待办。返回现在可以做的待办。只记录和提示，不执行，不授予权限。
    inputs: 'action=open：title 必填；workflow 和 steps 至少传一个。目标与已声明工作流相符时传 workflow 作参考（先用 workflow_status 看目录），steps 写待办 [{step,title,description,presets?,after?}]，presets 写这条待办包含的预设步骤。只传 workflow 时计划先没有待办，返回里的 reference 列出预设步骤，再用 revise 写待办。have 列出已具备的输入和核对后可复用的产物，写法与工作流定义相同，如 "ResearchRequest"、"SanityResult:pass"；工作流的外部输入必须在此声明。refs 给出产物的固定引用，conditions 打开条件步骤，如 {"user_requests_report": true}。已有活动计划时须 supersede=true。action=revise：steps 按待办名新增或替换，remove 移除还没开始的待办；也可以补充 have、refs 或改变 conditions，已完成的计划也可以这样重新打开。action=close：outcome 为 completed 或 abandoned，放弃时 note 必填。'
    outputs: 与 workflow_status 相同的流程提示，另有 accepted 表示本次调用是否生效。出错时 accepted 为 false，error 给出 code、message 和 fix，流程提示照常返回。
    prerequisites:
      - 仅主 Agent 可用。
      - 多步骤、需要委派或目标与某个已声明工作流相符的任务才建立计划；日常问答和单步轻量请求不建。
    limitations:
      - 一个主会话同时只有一个活动计划。
      - 复用旧产物前先核对品种、周期、数据版本和评价证据是否仍然适用；have 中声明的内容由你负责属实。
      - 待办都已完成，并且参考工作流的目标已经达成（没有参考工作流时不看目标），计划自动完成。只做工作流的一部分时，做完后用 close 以 completed 结束。
      - 计划不增加工具、数据或交易权限，不代替真实的 Run 结果、评价证据和报告交付。
      - 预设步骤是参考，不是必须照搬的清单。合并、拆分、不安排都可以；没有安排但已经可以做的，流程提示会一直列出。
  binding:
    type: native
    name: workflow_plan
