id: research-discovery
environment:
  mode: replay
steps:
  - operation: server/discover
  - operation: tools/list
  - operation: resources/read
    params:
      uri: sesame://plugins/sesame/research/skills/research/SKILL.md
expect:
  - step: 0
    pointer: /serverInfo/name
    equals: sesame/research
  - step: 1
    pointer: /tools/0/name
    equals: research_methods
  - step: 1
    pointer: /tools/0/inputSchema
    equals:
      type: object
      properties:
        query:
          type: string
          maxLength: 1000
          description: 用户问题或关键关系；不传则查看方法目录
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: 最多返回数，默认8；查看全部方法可用50
      required: []
      additionalProperties: false
  - step: 2
    pointer: /contents/0/text
    contains: "# 调查并回答用户的问题"
