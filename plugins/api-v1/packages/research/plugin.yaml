  permissions:
    scopes: []
    calls: []
  contributions:
    configSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/research_methods
      - tool/research_read
    sources: []
    views: []
    services: []
    knowledge:
      - id: prompt
        path: instructions.md
        description: 研究职责、选用时机与插件协作边界。
        kind: prompt
      - id: research-skill
        path: skills/research/SKILL.md
        description: 按任务发现方法、取证、复核和交付的短流程。
        kind: skill
      - id: method-index
        path: methods/index.json
        description: 方法与按需资料的同源索引。
        kind: reference
      - id: market-state
        path: references/methods/market-state.md
        description: 解释当前相对前期、同类资产有哪些变化，区分事实快照与预测。
        kind: reference
      - id: technical-structure
        path: references/methods/technical-structure.md
        description: 围绕观察期限、关键分界、触发、目标及相反路径组织技术判断。
        kind: reference
      - id: volatility-patterns
        path: references/methods/volatility-patterns.md
        description: 研究何时更活跃、不同持有期可能波动多大，以及期权波动定价差异。
        kind: reference
      - id: opportunity-and-calendar
        path: references/methods/opportunity-and-calendar.md
        description: 按用户条件区分候选，或只整理事件时点和已知预期。
        kind: reference
      - id: business-quality
        path: references/methods/business-quality.md
        description: 解释收入、利润和现金怎样产生，增长与竞争优势能否持续。
        kind: reference
      - id: valuation
        path: references/methods/valuation.md
        description: 比较当前价格要求的经营表现、可支持假设和价值敏感性。
        kind: reference
      - id: earnings-preview
        path: references/methods/earnings-preview.md
        description: 围绕事前预期、待揭晓经营变量和公布后的解读安排调查。
        kind: reference
      - id: earnings-review
        path: references/methods/earnings-review.md
        description: 解释实际相对事前预期的差异，以及经营判断具体发生的变化。
        kind: reference
      - id: event-explanation
        path: references/methods/event-explanation.md
        description: 用信息到达、预期差和竞争解释调查涨跌，而非新闻与价格简单配对。
        kind: reference
      - id: macro-outlook
        path: references/methods/macro-outlook.md
        description: 从基准假设连接增长、通胀、政策反应与地区差异。
        kind: reference
      - id: macro-transmission
        path: references/methods/macro-transmission.md
        description: 解释冲击通过何种渠道、时滞和相反力量影响目标资产。
        kind: reference
      - id: comparison
        path: references/methods/comparison.md
        description: 按用户目标选择共同口径，解释决定选择的差异和条件取舍。
        kind: reference
      - id: portfolio-risk
        path: references/methods/portfolio-risk.md
        description: 区分持仓权重、共同暴露、风险贡献和压力损失。
        kind: reference
      - id: performance-attribution
        path: references/methods/performance-attribution.md
        description: 解释已实现表现来自哪些资产、时段、配置和交易变化。
        kind: reference
      - id: allocation-rebalance
        path: references/methods/allocation-rebalance.md
        description: 围绕目标、约束、当前持仓和调整成本比较配置方案。
        kind: reference
      - id: options-structures
        path: references/methods/options-structures.md
        description: 比较合约成本、条件损益，以及时间、波动和到期因素的取舍。
        kind: reference
      - id: factor-evaluation
        path: references/methods/factor-evaluation.md
        description: 评价因子描述或预测什么、在哪些样本成立，以及是否提供增量信息。
        kind: reference
      - id: strategy-evaluation
        path: references/methods/strategy-evaluation.md
        description: 把真实策略规则、样本划分、成本和收益风险联系起来评价。
        kind: reference
      - id: strategy-diagnosis
        path: references/methods/strategy-diagnosis.md
        description: 定位表现变化的时间、贡献来源和竞争原因，再确定值得修改的部分。
        kind: reference
      - id: forecast-review
        path: references/methods/forecast-review.md
        description: 把当时可知的预测与实际结果比较，区分条件、数据和推断偏差。
        kind: reference
      - id: concept-explanation
        path: references/methods/concept-explanation.md
        description: 直接解释用户不理解的关系，用必要市场例子或复算回答。
        kind: reference
      - id: fields-market-observations
        path: references/fields/market-observations.json
        description: 按需解释相关结果的含义、单位、证据和缺失；不指定图表或必填项。
        kind: reference
      - id: fields-technical-events
