name: host_files_read
title: host_files_read
description: 只读读取宿主普通文件，每次最多 256 KiB；支持按字节分页，二进制返回 base64。
inputSchema:
  type: object
  required:
    - path
  properties:
    path:
      type: string
      minLength: 1
      maxLength: 4096
      description: 宿主绝对路径；支持 ~/
    offset:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    limit:
      type: integer
      minimum: 1
      maximum: 262144
    encoding:
      anyOf:
        - type: string
          const: utf8
        - type: string
          const: base64
  additionalProperties: false
outputSchema:
  type: object
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - filesystem.read
  usage:
    purpose: 只读读取宿主普通文件，每次最多 256 KiB；支持按字节分页，二进制返回 base64。
    inputs: path 为宿主普通文件；offset 是0起始字节偏移，limit 最大256KiB；encoding=utf8或base64。
    outputs: "{path,size,modified_at,offset,encoding,content,bytes_returned,chunk_sha256,next_offset,read_only:true}；非UTF-8自动返回base64。"
    prerequisites: []
    limitations:
      - chunk_sha256 只代表返回片段，不是覆盖需要的完整文件哈希；下一页使用 next_offset。
  binding:
    type: native
    name: host_files_read
