name: host_files_run
title: host_files_run
description: 用逐项argv运行实际宿主命令，由host.process.exec统一超时、取消和Run结果。
inputSchema:
  type: object
  required:
    - argv
    - cwd
  properties:
    argv:
      type: array
      items:
        type: string
        maxLength: 32768
      minItems: 1
      maxItems: 256
    cwd:
      type: string
      minLength: 1
      maxLength: 4096
      description: 宿主绝对路径；支持 ~/
    timeout:
      type: integer
      minimum: 1
      maximum: 600
      description: 秒
    env:
      type: object
      patternProperties:
        ^[A-Za-z_][A-Za-z0-9_]*$:
          type: string
          maxLength: 32768
  additionalProperties: false
outputSchema:
  type: object
annotations: {}
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - process.exec
  usage:
    purpose: 用逐项argv运行实际宿主命令，由host.process.exec统一超时、取消和Run结果。
    inputs: argv 为逐项参数数组，无隐式shell；cwd 为已存在宿主目录；timeout 默认60秒；env 可补充环境。
    outputs: 实际进程 output/exitCode 与宿主 run/receipt，等待至进程结束；超时/非零退出有具体错误。
    prerequisites:
      - 可执行程序与 cwd 实际存在。
    limitations:
      - 命令以当前用户权限运行，并非OS沙箱；参数中的凭据会暴露给进程，应使用适合该后端的认证入口。
  binding:
    type: native
    name: host_files_run
