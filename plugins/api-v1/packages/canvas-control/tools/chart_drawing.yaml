name: chart_drawing
title: chart_drawing
description: 读取、创建、修改、清理或显式迁移图表绘图。声明式几何直接渲染，成果源码保持不可变；修改同时校验绘图修订与挂载ID。
inputSchema:
  type: object
  additionalProperties: false
  required:
    - action
    - chart_id
  properties:
    action:
      enum:
        - read
        - put
        - remove
        - migrate
    command_id:
      type: string
      pattern: ^[a-zA-Z0-9_-]{1,100}$
      minLength: 16
    expected_version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    client_id:
      type: string
      pattern: ^[a-zA-Z0-9_-]{1,100}$
    chart_id:
      type: string
      pattern: ^[a-zA-Z0-9_-]{1,100}$
    drawing_id:
      type: string
      pattern: ^[a-zA-Z0-9_-]{1,100}$
    expected_revision:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 100
    expected_attachment:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 100
      description: Exact attached canvas_script id; null only when creating a drawing.
    binding:
      type: object
      additionalProperties: false
      required:
        - source
        - instrument
        - spec
      properties:
        source:
          type: object
          additionalProperties: false
          required:
            - providerId
            - revision
          properties:
            providerId:
              type: string
              minLength: 1
              maxLength: 4096
              pattern: ^.+#.+$
            revision:
              type: string
              minLength: 1
              maxLength: 4096
            binding:
              type: object
        instrument:
          type: object
          additionalProperties: false
          required:
            - sourceId
            - instrumentId
          properties:
            sourceId:
              type: string
              minLength: 1
              maxLength: 4096
            instrumentId:
              type: string
              minLength: 1
              maxLength: 4096
        spec:
          type: object
          additionalProperties: false
          required:
            - timeframe
            - priceBasis
            - adjustment
            - calendarRevision
          properties:
            timeframe:
              type: string
              minLength: 1
              maxLength: 4096
            priceBasis:
              enum:
                - bid
                - ask
                - mid
                - last
            adjustment:
              enum:
                - none
                - forward
                - backward
            session:
              type: string
              minLength: 1
              maxLength: 4096
            calendarRevision:
              type: object
              required:
                - status
              properties:
                status:
                  enum:
                    - value
                    - unknown
                    - not_applicable
                    - unsupported
    target_binding:
      type: object
      additionalProperties: false
      required:
        - source
        - instrument
        - spec
      properties:
        source:
          type: object
          additionalProperties: false
          required:
            - providerId
            - revision
          properties:
            providerId:
              type: string
              minLength: 1
              maxLength: 4096
              pattern: ^.+#.+$
            revision:
              type: string
              minLength: 1
              maxLength: 4096
            binding:
              type: object
        instrument:
          type: object
          additionalProperties: false
          required:
            - sourceId
            - instrumentId
          properties:
            sourceId:
              type: string
              minLength: 1
              maxLength: 4096
            instrumentId:
              type: string
              minLength: 1
              maxLength: 4096
        spec:
          type: object
          additionalProperties: false
          required:
            - timeframe
            - priceBasis
            - adjustment
            - calendarRevision
          properties:
            timeframe:
              type: string
              minLength: 1
              maxLength: 4096
            priceBasis:
              enum:
                - bid
                - ask
                - mid
                - last
            adjustment:
              enum:
                - none
                - forward
                - backward
            session:
              type: string
              minLength: 1
              maxLength: 4096
            calendarRevision:
              type: object
              required:
                - status
              properties:
                status:
                  enum:
                    - value
                    - unknown
                    - not_applicable
                    - unsupported
    drawing:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - kind
        - title
        - anchors
        - style
      properties:
        schemaVersion:
          const: sesame-drawing/1
        kind:
          enum:
            - trend
            - horizontal
            - rectangle
            - fibonacci
        title:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^(?=[^\u0000-\u001f]*$)(?=.*\S).+$
        anchors:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required:
              - time
              - price
            properties:
              time:
                type: number
                minimum: -8640000000000
                maximum: 8640000000000
              price:
                type: number
                minimum: -1000000000000000
                maximum: 1000000000000000
        style:
          type: object
          additionalProperties: false
          required:
            - color
            - width
            - lineStyle
            - fillOpacity
          properties:
            color:
              type: string
              pattern: ^#[a-fA-F0-9]{6}$
            width:
              type: integer
              enum:
                - 1
                - 2
                - 3
                - 4
            lineStyle:
              enum:
                - solid
                - dashed
                - dotted
            fillOpacity:
              type: number
              minimum: 0
              maximum: 0.4
      anyOf:
        - properties:
            kind:
              const: horizontal
            anchors:
              minItems: 1
              maxItems: 1
        - properties:
            kind:
              enum:
                - trend
                - rectangle
                - fibonacci
            anchors:
              minItems: 2
              maxItems: 2
    source:
      type: string
      maxLength: 16384
  oneOf:
    - properties:
        action:
          const: read
      required:
        - drawing_id
      not:
        anyOf:
          - required:
              - drawing
          - required:
              - source
          - required:
              - target_binding
    - properties:
        action:
          const: remove
      required:
        - command_id
        - expected_version
        - binding
        - expected_revision
        - expected_attachment
        - drawing_id
      not:
        anyOf:
          - required:
              - drawing
          - required:
              - source
          - required:
              - target_binding
    - properties:
        action:
          const: migrate
      required:
        - command_id
        - expected_version
        - binding
        - expected_revision
        - expected_attachment
        - drawing_id
        - target_binding
      not:
        anyOf:
          - required:
              - drawing
          - required:
              - source
    - properties:
        action:
          const: put
      required:
        - command_id
        - expected_version
        - binding
        - expected_revision
        - expected_attachment
      oneOf:
        - required:
            - drawing
        - required:
            - source
      not:
        required:
          - target_binding
outputSchema:
  type: object
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - view.write
  usage:
    purpose: 对用户的手工绘图和Agent绘图使用同一持久化代码与版本链。
    inputs: read需要chart_id/drawing_id。变更需要command_id/expected_version、保存的binding、expected_revision和expected_attachment（script.id）；新建二者为null。migrate另需当前target_binding，且can_migrate必须为true。
    outputs: read返回附着绘图，包括spec/source/revision/attachment/active/can_migrate。put/remove/migrate返回当前画布；修改保留旧成果与撤销历史。
    prerequisites:
      - 先canvas_inspect读取图表binding与绘图修订；只修改用户要求的对象。
    limitations:
      - 每个当前绑定最多64幅活跃绘图，非活跃附着绘图可读取和删除，不占活跃配额。来源修订只能由宿主核验恢复，迁移必须单独显式请求；跨品种、规格、日历、时钟或连接不能迁移。缺失历史观测或未知日历不授权迁移。
  binding:
    type: native
    name: chart_drawing
