name: indicator_publish
title: indicator_publish
description: 发布标准 indicator@1 成果。JavaScript 模块须 export compute(input)，输出标准 points/markers；forming 输入、独立 pane 和缺失值由定义明确。固定序列引用已有 DataRef；不将静态数据冒充实时。TypeScript/stream 尚无执行器，不能使用。
inputSchema:
  type: object
  required:
    - operation_id
    - definition
  properties:
    operation_id:
      type: string
      pattern: ^[A-Za-z0-9_-]{16,128}$
    definition:
      type: object
      required:
        - schemaVersion
        - title
        - parameters
        - inputs
        - panes
        - series
        - implementation
      properties:
        schemaVersion:
          type: string
          const: 1.0.0
        title:
          type: string
          description: 指标名称
          minLength: 1
          maxLength: 20000
        description:
          type: string
          description: 说明
          minLength: 1
          maxLength: 20000
        parameters:
          type: array
          items:
            anyOf:
              - type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数 ID
                  type:
                    type: string
                    const: integer
                  required:
                    type: boolean
                  title:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数标题
                  default:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: JSON 安全整数，不加引号
                  min:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: JSON 安全整数，不加引号
                  max:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: JSON 安全整数，不加引号
                required:
                  - id
                  - type
                  - required
                  - title
                additionalProperties: false
              - type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数 ID
                  type:
                    type: string
                    const: decimal
                  required:
                    type: boolean
                  title:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数标题
                  default:
                    type: string
                    pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                    description: 精确十进制字符串，如 "0.01"；不用浮点数或科学计数法
                  min:
                    type: string
                    pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                    description: 精确十进制字符串，如 "0.01"；不用浮点数或科学计数法
                  max:
                    type: string
                    pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                    description: 精确十进制字符串，如 "0.01"；不用浮点数或科学计数法
                required:
                  - id
                  - type
                  - required
                  - title
                additionalProperties: false
              - type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数 ID
                  type:
                    type: string
                    const: boolean
                  required:
                    type: boolean
                  title:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数标题
                  default:
                    type: boolean
                required:
                  - id
                  - type
                  - required
                  - title
                additionalProperties: false
              - type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数 ID
                  type:
                    type: string
                    const: string
                  required:
                    type: boolean
                  title:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数标题
                  default:
                    type: string
                    maxLength: 20000
                required:
                  - id
                  - type
                  - required
                  - title
                additionalProperties: false
              - type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数 ID
                  type:
                    type: string
                    const: enum
                  required:
                    type: boolean
                  title:
                    type: string
                    minLength: 1
                    maxLength: 20000
                    description: 参数标题
                  default:
                    type: string
                  choices:
                    type: array
                    items:
                      type: string
                required:
                  - id
                  - type
                  - required
                  - title
                  - choices
                additionalProperties: false
        inputs:
          type: array
          items:
            type: object
            required:
              - id
              - kind
              - binding
              - lookback
              - forming
            properties:
              id:
                type: string
                description: 输入 ID
                minLength: 1
                maxLength: 20000
              kind:
                anyOf:
                  - type: string
                    const: bars
                  - type: string
                    const: quotes
                  - type: string
                    const: data
              binding:
                anyOf:
                  - type: string
                    const: chart
                  - type: string
                    const: fixed
              series:
                type: object
                properties: {}
                additionalProperties: true
              data:
                type: object
                required:
                  - id
                  - revision
                  - digest
                  - kind
                  - schemaVersion
                properties:
                  id:
                    type: string
                    description: 成果 ID
                    minLength: 1
                    maxLength: 20000
                  revision:
                    type: string
                    description: 固定修订
                    minLength: 1
                    maxLength: 20000
                  digest:
                    type: string
                    description: SHA-256 摘要
                    minLength: 1
                    maxLength: 20000
                  kind:
                    type: string
                    description: 成果类别
                    minLength: 1
                    maxLength: 20000
                  schemaVersion:
                    type: string
                    const: 1.0.0
                additionalProperties: false
              lookback:
                type: integer
                minimum: 0
                maximum: 20000
                description: 最小预热样本数，0表示不要求预热而非空输入；不截断可见历史。所有输入合计最多100000行及8MiB。
              forming:
                anyOf:
                  - type: string
                    const: include
                  - type: string
                    const: closed_only
              window:
                type: integer
                minimum: 1
                maximum: 20000
                description: 可选固定样本窗口，必须>=lookback；只传最后N个符合forming策略的样本。不传则传完整的有界视窗或固定数据。
            additionalProperties: false
        panes:
          type: array
          items:
            type: object
            required:
              - id
              - placement
            properties:
              id:
                type: string
                description: 视区 ID
                minLength: 1
                maxLength: 20000
              placement:
                anyOf:
                  - type: string
                    const: main
                  - type: string
                    const: separate
              title:
                type: string
                description: 视区名称
                minLength: 1
                maxLength: 20000
            additionalProperties: false
          maxItems: 5
        series:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - paneId
              - type
              - unit
              - scale
              - style
            properties:
              id:
                type: string
                description: 序列 ID
                minLength: 1
                maxLength: 20000
              title:
                type: string
                description: 序列名称
                minLength: 1
                maxLength: 20000
              paneId:
                type: string
                description: 实际视区 ID
                minLength: 1
                maxLength: 20000
              type:
                anyOf:
                  - type: string
                    const: line
                  - type: string
                    const: area
                  - type: string
                    const: histogram
                  - type: string
                    const: markers
              unit:
                type: string
                description: 单位
                minLength: 1
                maxLength: 20000
              scale:
                type: object
                required:
                  - mode
                  - scaleId
                properties:
                  mode:
                    anyOf:
                      - type: string
                        const: price
                      - type: string
                        const: independent
                  scaleId:
                    type: string
                    description: 刻度 ID
                    minLength: 1
                    maxLength: 20000
                additionalProperties: false
              style:
                type: object
                required:
                  - color
                properties:
                  color:
                    type: string
                    pattern: ^#[0-9a-fA-F]{6}$
                  width:
                    type: number
                    minimum: 1
                    maximum: 8
                  lineStyle:
                    anyOf:
                      - type: string
                        const: solid
                      - type: string
                        const: dashed
                      - type: string
                        const: dotted
                additionalProperties: false
            additionalProperties: false
          maxItems: 12
        implementation:
          anyOf:
            - type: object
              required:
                - kind
                - entry
                - language
                - runtime
                - dependencies
              properties:
                kind:
                  type: string
                  const: code
                entry:
                  type: string
                  description: files中的入口相对路径
                  minLength: 1
                  maxLength: 20000
                language:
                  type: string
                  const: javascript
                runtime:
                  type: string
                  const: sesame-indicator/1
                dependencies:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - revision
                      - digest
                      - kind
                      - schemaVersion
                    properties:
                      id:
                        type: string
                        description: 成果 ID
                        minLength: 1
                        maxLength: 20000
                      revision:
                        type: string
                        description: 固定修订
                        minLength: 1
                        maxLength: 20000
                      digest:
                        type: string
                        description: SHA-256 摘要
                        minLength: 1
                        maxLength: 20000
                      kind:
                        type: string
                        description: 成果类别
                        minLength: 1
                        maxLength: 20000
                      schemaVersion:
                        type: string
                        const: 1.0.0
                    additionalProperties: false
              additionalProperties: false
            - type: object
              required:
                - kind
                - initial
                - updateMode
              properties:
                kind:
                  type: string
                  const: series
                initial:
                  type: object
                  required:
                    - id
                    - revision
                    - digest
                    - kind
                    - schemaVersion
                  properties:
                    id:
                      type: string
                      description: 成果 ID
                      minLength: 1
                      maxLength: 20000
                    revision:
                      type: string
                      description: 固定修订
                      minLength: 1
                      maxLength: 20000
                    digest:
                      type: string
                      description: SHA-256 摘要
                      minLength: 1
                      maxLength: 20000
                    kind:
                      type: string
                      description: 成果类别
                      minLength: 1
                      maxLength: 20000
                    schemaVersion:
                      type: string
                      const: 1.0.0
                  additionalProperties: false
                updateMode:
                  type: string
                  const: static
              additionalProperties: false
      additionalProperties: false
    files:
      type: object
      patternProperties:
        ^.*$:
          type: string
          maxLength: 32768
      maxProperties: 16
      description: 顶层文件表：入口相对路径 → 完整 JavaScript 源码；与 definition 并列，不能嵌入 implementation
  additionalProperties: false
outputSchema:
  type: object
annotations:
  readOnlyHint: false
errors:
  internal_error:
    message: The operation failed.
    recovery: Inspect the recorded diagnostic before retrying.
x-sesame:
  kind: function
  consumers:
    - agent
    - host
  execution: immediate
  effects:
    - resource.publish
    - resource.write
    - state.write
  usage:
    purpose: 发布标准 indicator@1 成果。JavaScript 模块须 export compute(input)，输出标准 points/markers；forming 输入、独立 pane 和缺失值由定义明确。固定序列引用已有 DataRef；不将静态数据冒充实时。TypeScript/stream 尚无执行器，不能使用。
    inputs: operation_id 固定此次发布；definition 描述 inputs/parameters/panes/series 与 implementation。files 是与 definition 并列的顶层对象，files[definition.implementation.entry] 为 export compute(input) 的完整 JavaScript 模块。integer 的 default/min/max 是 JSON 安全整数，decimal 使用精确十进制字符串；静态 series 引用 initial DataRef。
    outputs: "{ref,receipt}；ref 是已冻结 indicator 的完整 ArtifactRef，后续 chart_script.artifact 使用 ref，receipt 是发布回执。"
    prerequisites:
      - 完整调用示例：plugin_read({pluginId:"sesame/canvas-control",part:"resource",path:"resources/indicator-publish.json"})；定义与模块分别见 resources/close-line.json、resources/close-line.js；依赖是已有固定成果。
    limitations:
      - 发布不执行或验证图表绘制；TypeScript、stream 尚无执行器。修代码要重新发布新成果，静态序列不能宣称实时。
  binding:
    type: native
    name: indicator_publish
