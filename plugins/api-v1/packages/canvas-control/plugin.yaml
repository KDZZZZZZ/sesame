formatVersion: 1
protocolVersion: 2026-07-28
id: sesame/canvas-control
title: 工作台与图表编排
description: 主 Agent 编排水平工作台窗口，以及图表区内部的行情图、实时指标和研究曲线。
version: 4.0.2
license: MIT
engines:
  sesame: ">=0.3.0-dev.1 <0.4.0"
entry: index.js
x-sesame:
  catalog:
    category: "workspace"
    functionalCategory: "presentation"
    implementationKinds: ["service"]
    title:
      en: "Canvas"
      zh: "画布"
    summary:
      en: "Arrange charts, indicators and fixed reports in one workspace."
      zh: "在同一工作台组织图表、指标与固定报告。"
    dependencies:
      en: "Charts need an explicitly selected market provider. Reports work without one."
      zh: "行情图需要明确选择市场提供方；报告无需行情后端。"
    implementationReason: "Host canvas commands provide presentation and persistent workspace behavior through functions, without owning a source or view contribution."
  default_state: discoverable
  agent_scope: main
  prompts:
    - instructions.md
  skills:
    - skills
  mcp_export:
    - canvas_inspect
    - canvas_binding
    - canvas_recover_source
    - canvas_apply
    - canvas_focus
    - chart_script
    - chart_drawing
    - indicator_publish
  resources:
    - resources/close-line.json
    - resources/close-line.js
    - resources/indicator-publish.json
  execution: native
  permissions:
    scopes:
      - capabilities.compose
    calls: []
  contributions:
    configSchema:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    capabilities:
      - tool/canvas_inspect
      - tool/canvas_binding
      - tool/canvas_apply
      - tool/canvas_focus
      - tool/chart_script
      - tool/canvas_recover_source
      - tool/chart_drawing
      - tool/indicator_publish
    sources: []
    views: []
    services: []
    knowledge:
      - id: resource.1
        path: instructions.md
        description: 随包资源 prompt.md
        kind: prompt
      - id: resource.2
        path: resources/close-line.json
        description: 随包资源 resources/close-line.json
        kind: reference
      - id: resource.3
        path: skills/market-chart/SKILL.md
        description: 随包资源 skills/market-chart/SKILL.md
        kind: skill
      - id: reference.indicator-publish-json
        path: resources/indicator-publish.json
        kind: reference
        description: 可直接用于 indicator_publish 的完整调用，包含顶层 files 与类型准确的参数
      - id: reference.close-line-js
        path: resources/close-line.js
        kind: reference
        description: 标准指标 JavaScript 模块示例
    hooks: []
    stateCollections: []
    artifactSchemas:
      - id: indicator
        kind: indicator
        schemaVersion: 1.0.0
        schema:
          type: object
          required:
            - schemaVersion
            - title
            - parameters
            - inputs
            - panes
            - series
            - implementation
          properties:
            schemaVersion:
              type: string
              const: 1.0.0
            title:
              type: string
              description: 指标名称
              minLength: 1
              maxLength: 20000
            description:
              type: string
              description: 说明
              minLength: 1
              maxLength: 20000
            parameters:
              type: array
              items:
                anyOf:
                  - type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数 ID
                      type:
                        type: string
                        const: integer
                      required:
                        type: boolean
                      title:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数标题
                      default:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: JSON 安全整数，不加引号
                      min:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: JSON 安全整数，不加引号
                      max:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: JSON 安全整数，不加引号
                    required:
                      - id
                      - type
                      - required
                      - title
                    additionalProperties: false
                  - type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数 ID
                      type:
                        type: string
                        const: decimal
                      required:
                        type: boolean
                      title:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数标题
                      default:
                        type: string
                        pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                        description: 精确十进制字符串，如 "0.01"；不用浮点数或科学计数法
                      min:
                        type: string
                        pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                        description: 精确十进制字符串，如 "0.01"；不用浮点数或科学计数法
                      max:
                        type: string
                        pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
                        description: 精确十进制字符串，如 "0.01"；不用浮点数或科学计数法
                    required:
                      - id
                      - type
                      - required
                      - title
                    additionalProperties: false
                  - type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数 ID
                      type:
                        type: string
                        const: boolean
                      required:
                        type: boolean
                      title:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数标题
                      default:
                        type: boolean
                    required:
                      - id
                      - type
                      - required
                      - title
                    additionalProperties: false
                  - type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数 ID
                      type:
                        type: string
                        const: string
                      required:
                        type: boolean
                      title:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数标题
                      default:
                        type: string
                        maxLength: 20000
                    required:
                      - id
                      - type
                      - required
                      - title
                    additionalProperties: false
                  - type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数 ID
                      type:
                        type: string
                        const: enum
                      required:
                        type: boolean
                      title:
                        type: string
                        minLength: 1
                        maxLength: 20000
                        description: 参数标题
                      default:
                        type: string
                      choices:
                        type: array
                        items:
                          type: string
                    required:
                      - id
                      - type
                      - required
                      - title
                      - choices
                    additionalProperties: false
            inputs:
              type: array
              items:
                type: object
                required:
                  - id
                  - kind
                  - binding
                  - lookback
                  - forming
                properties:
                  id:
                    type: string
                    description: 输入 ID
                    minLength: 1
                    maxLength: 20000
                  kind:
                    anyOf:
                      - type: string
                        const: bars
                      - type: string
                        const: quotes
                      - type: string
                        const: data
                  binding:
                    anyOf:
                      - type: string
                        const: chart
                      - type: string
                        const: fixed
                  series:
                    type: object
                    properties: {}
                    additionalProperties: true
                  data:
                    type: object
                    required:
                      - id
                      - revision
                      - digest
                      - kind
                      - schemaVersion
                    properties:
                      id:
                        type: string
                        description: 成果 ID
                        minLength: 1
                        maxLength: 20000
                      revision:
                        type: string
                        description: 固定修订
                        minLength: 1
                        maxLength: 20000
                      digest:
                        type: string
                        description: SHA-256 摘要
                        minLength: 1
                        maxLength: 20000
                      kind:
                        type: string
                        description: 成果类别
                        minLength: 1
                        maxLength: 20000
                      schemaVersion:
                        type: string
                        const: 1.0.0
                    additionalProperties: false
                  lookback:
                    type: integer
                    minimum: 0
                    maximum: 20000
                    description: 最小预热样本数，0表示不要求预热而非空输入；不截断可见历史。所有输入合计最多100000行及8MiB。
                  forming:
                    anyOf:
                      - type: string
                        const: include
                      - type: string
                        const: closed_only
                  window:
                    type: integer
                    minimum: 1
                    maximum: 20000
                    description: 可选固定样本窗口，必须>=lookback；只传最后N个符合forming策略的样本。不传则传完整的有界视窗或固定数据。
                additionalProperties: false
            panes:
              type: array
              items:
                type: object
                required:
                  - id
                  - placement
                properties:
                  id:
                    type: string
                    description: 视区 ID
                    minLength: 1
                    maxLength: 20000
                  placement:
                    anyOf:
                      - type: string
                        const: main
                      - type: string
                        const: separate
                  title:
                    type: string
                    description: 视区名称
                    minLength: 1
                    maxLength: 20000
                additionalProperties: false
              maxItems: 5
            series:
              type: array
              items:
                type: object
                required:
                  - id
                  - title
                  - paneId
                  - type
                  - unit
                  - scale
                  - style
                properties:
                  id:
                    type: string
                    description: 序列 ID
                    minLength: 1
                    maxLength: 20000
                  title:
                    type: string
                    description: 序列名称
                    minLength: 1
                    maxLength: 20000
                  paneId:
                    type: string
                    description: 实际视区 ID
                    minLength: 1
                    maxLength: 20000
                  type:
                    anyOf:
                      - type: string
                        const: line
                      - type: string
                        const: area
                      - type: string
                        const: histogram
                      - type: string
                        const: markers
                  unit:
                    type: string
                    description: 单位
                    minLength: 1
                    maxLength: 20000
                  scale:
                    type: object
                    required:
                      - mode
                      - scaleId
                    properties:
                      mode:
                        anyOf:
                          - type: string
                            const: price
                          - type: string
                            const: independent
                      scaleId:
                        type: string
                        description: 刻度 ID
                        minLength: 1
                        maxLength: 20000
                    additionalProperties: false
                  style:
                    type: object
                    required:
                      - color
                    properties:
                      color:
                        type: string
                        pattern: ^#[0-9a-fA-F]{6}$
                      width:
                        type: number
                        minimum: 1
                        maximum: 8
                      lineStyle:
                        anyOf:
                          - type: string
                            const: solid
                          - type: string
                            const: dashed
                          - type: string
                            const: dotted
                    additionalProperties: false
                additionalProperties: false
              maxItems: 12
            implementation:
              anyOf:
                - type: object
                  required:
                    - kind
                    - entry
                    - language
                    - runtime
                    - dependencies
                  properties:
                    kind:
                      type: string
                      const: code
                    entry:
                      type: string
                      description: files中的入口相对路径
                      minLength: 1
                      maxLength: 20000
                    language:
                      type: string
                      const: javascript
                    runtime:
                      type: string
                      const: sesame-indicator/1
                    dependencies:
                      type: array
                      items:
                        type: object
                        required:
                          - id
                          - revision
                          - digest
                          - kind
                          - schemaVersion
                        properties:
                          id:
                            type: string
                            description: 成果 ID
                            minLength: 1
                            maxLength: 20000
                          revision:
                            type: string
                            description: 固定修订
                            minLength: 1
                            maxLength: 20000
                          digest:
                            type: string
                            description: SHA-256 摘要
                            minLength: 1
                            maxLength: 20000
                          kind:
                            type: string
                            description: 成果类别
                            minLength: 1
                            maxLength: 20000
                          schemaVersion:
                            type: string
                            const: 1.0.0
                        additionalProperties: false
                  additionalProperties: false
                - type: object
                  required:
                    - kind
                    - initial
                    - updateMode
                  properties:
                    kind:
                      type: string
                      const: series
                    initial:
                      type: object
                      required:
                        - id
                        - revision
                        - digest
                        - kind
                        - schemaVersion
                      properties:
                        id:
                          type: string
                          description: 成果 ID
                          minLength: 1
                          maxLength: 20000
                        revision:
                          type: string
                          description: 固定修订
                          minLength: 1
                          maxLength: 20000
                        digest:
                          type: string
                          description: SHA-256 摘要
                          minLength: 1
                          maxLength: 20000
                        kind:
                          type: string
                          description: 成果类别
                          minLength: 1
                          maxLength: 20000
                        schemaVersion:
                          type: string
                          const: 1.0.0
                      additionalProperties: false
                    updateMode:
                      type: string
                      const: static
                  additionalProperties: false
          additionalProperties: false
